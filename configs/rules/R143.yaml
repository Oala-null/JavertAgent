rule_id: R143
domain: 临床检验
violation_type: 过度检查
question: 医院部分科室将血浆乳酸测定作为入院患者的常规检查，对大量无相关疾病指征的患者开展检验。
example: 示例：血浆乳酸测定可以反映人体组织氧供需平衡与代谢状态。某医院对荨麻疹患者，普遍开展血浆乳酸测定检查并收费，属于过度检查。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |+
  本规则关注: 患者本次住院里, 是否被无指征收取了「血浆乳酸测定 (Lactate, 动脉血乳酸)」检查/检验.
  按诊疗规范, 血浆乳酸用于休克 / 严重感染 / 缺氧评估或危重患者酸碱平衡监测, 不应作为普通入院常规.

  审计步骤:
  1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  2. 用 search_fees(category="检查类") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.
     检索关键词: "血浆乳酸" / "乳酸测定" / "Lactate" / "动脉血乳酸"
  3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).
  4. 检查 note_diagnosis 中是否含以下指征任一:
     - 休克 / 感染性休克 / 心源性休克 / 失血性休克
     - 脓毒症 / 败血症 / 严重感染
     - 严重缺氧 / 呼吸衰竭
     - 糖尿病酮症酸中毒 / 严重代谢性酸中毒
     - 心衰失代偿
     - 严重创伤
     - 心搏骤停后 / 心肺复苏后
     - 肝衰竭
     
  5. 若有任一指征命中 → CLEAN (有指征).
  6. 【判「无指征」前 MUST 执行】用 scan_progress_indications(patient_id, symptom_kw_list=["胸闷", "气短", "喘", "憋", "胸痛", "下肢水肿", "发热", "咳嗽", "心悸"]) 扫病程/查房 section 族的症状指征.
     - 若命中**阳性**症状 (无 [否认段]/[选项框] 标注) → CLEAN (病程记录有指征, 不只看诊断).
     - 仅当诊断无指征 **且** 病程症状 0 阳性命中时, 才可继续向 VIOLATION 推进.
  7. 若无任一诊断指征命中 且病程症状 0 阳性命中, 且 count >= 1 → VIOLATION,
     evidence: 引诊断完整列表 + 该检查项目名 × count.
  8. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.

trigger_keywords:
  - 血浆乳酸
  - 乳酸测定
  - 动脉血乳酸
  - Lactate
  - 休克
  - 脓毒症
  - 酸碱平衡
trigger_codes:
  - S250302008
suggested_tools:
  - note_diagnosis
  - search_fees
expected_signal: |
  典型违规: 普通择期手术患者无休克/感染诊断, 收乳酸测定.
  典型 CLEAN: 重症监护期间脓毒症患者多次乳酸测定监测组织灌注.
  典型 INCONCLUSIVE: 诊断 "低氧待查" / "代谢紊乱" 等中间状态.
notes: ''
