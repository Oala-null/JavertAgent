rule_id: R108
domain: 医学影像
violation_type: 过度检查
question: 无指征为住院患者普通开展胸部CT检查并收取费用。
example: 示例：某医院将胸部CT作为无肺部疾患既往史的痔疮患者入院必查项目，属于过度检查。
status: ready
priority: P1
handling_level: 可疑（警告）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被无指征收取了「胸部 CT 检查」(普查式开单).
  按诊疗规范, 胸部 CT 适用于已知或疑似肺部 / 纵隔 / 胸壁疾患, 不应作为无肺部既往史患者的入院常规筛查项目.

  审计步骤:
  1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  2. 用 search_fees(keyword=...) 查胸部 CT 是否做过, 记录出现次数 count.
     检索关键词: "胸部 CT" / "胸部 CT 平扫" / "胸部 CT 增强" / "CT 胸部" / "肺部 CT"
  3. 若 count == 0 → CLEAN (规则不适用).
  4. 检查 note_diagnosis 中是否含以下指征任一:
     - 肺部疾患 (肺炎 / 肺结核 / 肺癌 / 肺间质病变 / 肺栓塞 / 慢阻肺 / 哮喘 / 支扩)
     - 纵隔病变 / 胸壁占位 / 胸腔积液
     - 咳嗽 / 咳痰 / 咯血 / 胸痛 / 呼吸困难 主诉
     - 肿瘤分期 / 转移筛查 (已确诊恶性肿瘤需 CT 评估全身)
     - 胸部外伤 / 多发伤
     - 术前评估 (胸外科 / 心外科 / 上腹部大手术需评估肺部状态)
     - 长期吸烟史 + 体检异常
     - 发热待查 (临床路径含胸 CT)

  5. 若有任一指征命中 → CLEAN.
  6. 若无任一指征命中, 且 count >= 1 → VIOLATION,
     evidence: 引诊断完整列表 + 胸 CT 项目名 × count + 价格.
  7. 诊断为"待查"/"疑似"等中间状态 → INCONCLUSIVE.

  特殊注意:
  - 重点防范: 无关科室 (痔疮 / 皮肤病 / 眼科 / 骨折等) 患者无肺部病史, 入院开胸 CT.
  - 即使无诊断指征, 若文书 search_notes(keyword="术前评估") 提到胸 CT 用于术前评估全麻 → CLEAN.
trigger_keywords:
  - 胸部CT
  - 胸部 CT 平扫
  - 肺部 CT
  - 肺炎
  - 咯血
  - 胸痛
  - 术前评估
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 痔疮 / 皮肤病等非胸部相关诊断患者, fee 含 1-2 次胸 CT.
  典型 CLEAN: 肺癌 / 肺炎 / 慢阻肺 患者复查胸 CT.
  典型 INCONCLUSIVE: 主诉模糊 ("不适待查"), 无法判断指征.
notes: ''
