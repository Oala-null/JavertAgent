rule_id: R226
domain: 重症医学
violation_type: 重复收费
question: 开展静脉高营养治疗，重复收取静脉用药集中配置费用。
example: 示例：某省《诊疗目录》规定，静脉高营养治疗项目内涵：含静脉营养配置。某医院为ICU患者输注营养液，其中，静脉用药集中配置为重复收费。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「静脉高营养治疗」项目 + 独立的「静脉用药集中配置 (PIVAS)」费用.
  按各省《医疗服务诊疗目录》, 静脉高营养治疗项目内涵已含静脉营养配置, 单独再收静脉用药集中配置费 = 重复收费.

  审计步骤:
  1. 用 search_fees(category="其他类") 取其他类全部明细; 关注是否同时存在以下两类:
     A 类 (高营养): "静脉高营养治疗" / "全胃肠外营养" / "TPN" / "PN" / "肠外营养"
     B 类 (集中配置): "静脉用药集中配置" / "PIVAS 配置" / "配液费" / "配置费"
  2. 若 A 类无命中 → CLEAN (该患者根本没做静脉高营养, 规则不适用).
  3. 若 A 类有命中且 B 类无命中 → CLEAN (高营养费用单一, 未重复收配置费).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="医嘱"/"药学服务"/"护理记录") 没有提到该报告由
     高危药物 (例如化疗药) 由独立配液中心提供且文书有专门记录 → VIOLATION, evidence 引营养治疗笔数 + 配置费笔数 + 价格 + 同日日期.
  5. 信息明确不足 (例如医嘱里只写 '全胃肠外营养', 但费用同时含配置费, 文书未指明是 PIVAS 还是病区配) → INCONCLUSIVE.

  注意: 患者基础诊断必须含营养不良 / 不能进食 / 重症需要 TPN (note_diagnosis 命中"营养不良"/"重症"/"术后"/"不能进食"/"肠功能衰竭"); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - 静脉高营养
  - 全胃肠外营养
  - TPN
  - PN
  - 静脉用药集中配置
  - PIVAS
  - 配液费
  - 配置费
trigger_codes:
  - S120400008
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 同日存在 "静脉高营养 ¥120/天" 与 "静脉用药集中配置 ¥30/次" 两笔, 药学服务记录无独立 PIVAS 说明.
  典型 CLEAN: 仅有高营养单笔; 或文书明确化疗等高危药物由独立配液中心配制单独计费.
notes: ''
