rule_id: R134
domain: 临床检验
violation_type: 虚构医药服务项目
question: 未开展相关诊疗项目，但收取对应诊疗费用。
example: 示例：某医院未开展血常规、尿常规等检验项目，但向患者收取费用。
status: ready
priority: P0
prompt_addon: |+
  本规则关注: 患者本次住院里, 费用中有「临床检验 (血常规 / 尿常规 / 生化常规)」, 但文书中没有对应的
  执行记录, 即 "虚构 临床检验 (血常规 / 尿常规 / 生化常规) 项目骗取医保基金".
  按医保政策, 临床检验应有对应检验报告 (检验单号 + 报告日期 + 检测数值). 收费但无检验报告 = 虚构.

  审计步骤:
  1. 用 search_fees 查 fee 是否命中. 检索关键词: "血常规" / "尿常规" / "大便常规" / "肝肾功能" / "电解质"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未被收取该费用).
  3. 用 search_notes 检查文书是否有该服务的执行记录:
     - 重点检查 section: "辅助检查" / "检验报告"
     - 执行证据关键词: "检验报告" / "检验单号" / "报告日期" / "检测数值"
  4. 若文书有任一执行证据命中 → CLEAN (服务实际开展).
  5. 若 fee 有 + 文书无执行证据 → VIOLATION,
     evidence: 引 fee 项目名 + 价格 + "在 辅助检查 等 section 中未检索到 检验报告 等执行描述".
  6. 文书 section 不完整 (例如手术记录缺失) / 描述模糊 → INCONCLUSIVE.

  特殊注意:
  - 医院对所有患者一律收某项检验但部分患者实际无该样本 (如无尿患者收尿常规), 强支持 VIOLATION.

trigger_keywords:
  - 血常规
  - 尿常规
  - 大便常规
  - 肝肾功能
  - 电解质
  - 检验报告
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 费用列'尿常规 × 3', 文书检验报告段只有 1 份尿常规.
  典型 CLEAN: 每项检验都有对应报告 + 数值.
  典型 INCONCLUSIVE: 报告日期缺失或检测数值模糊.
notes: ''
