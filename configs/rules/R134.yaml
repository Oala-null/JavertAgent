rule_id: R134
domain: 临床检验
violation_type: 虚构医药服务项目
question: 未开展相关诊疗项目，但收取对应诊疗费用。
example: 示例：某医院未开展血常规、尿常规等检验项目，但向患者收取费用。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: "本规则关注: 患者本次住院里, 费用中有「临床检验 (血常规 / 尿常规 / 生化常规)」, 但文书中没有对应的\n执行记录, 即 \"虚构 临床检验 (血常规 / 尿常规 / 生化常规) 项目骗取医保基金\".\n按医保政策, 临床检验应有对应检验报告 (检验单号 + 报告日期 + 检测数值). 收费但无检验报告 = 虚构.\n\n【裁决基准 (举证责任, M5 虚构类通则 — 优先于下列步骤)】\n- 治疗/手术类收费项目存在 = 医院已就该操作向基金收费, 举证\"该操作确实开展\"的责任在收费方。\n- 文书找不到该操作的执行证据时, 默认下限为 INCONCLUSIVE (证据缺失待人工核查);\n  MUST NOT 因\"文书未提及 / 未检索到执行描述\"就判 CLEAN。\n- 仅当文书**正面反证**该操作确实执行 (操作记录 / 治疗单 / 麻醉记录 / 执行记载, 含操作名+时间+过程)\n  → CLEAN。\n- 若文书正面显示该操作实际**未执行** (记录为其它操作 / 明确未做 / 诊断无支持且执行痕迹全缺)\n  → VIOLATION。\n- 名称警示: 收费项目名与文书术式名常不一致 (如「肘关节截骨术」↔「尺骨截骨术」),\n  MUST NOT 仅因名称不同就断言\"未收费\"或\"未执行\"; 用解剖部位与操作类别交叉核对。\n\n审计步骤:\n1. 用 search_fees 查 fee 是否命中. 检索关键词: \"血常规\" / \"尿常规\" / \"大便常规\" / \"肝肾功能\" / \"电解质\"\n2. 若 fee 无命中 → CLEAN (规则不适用, 患者未被收取该费用).\n3. 用 search_notes 检查文书是否有该服务的执行记录:\n   - 重点检查 section: \"辅助检查\" / \"检验报告\"\n   - 执行证据关键词: \"检验报告\" / \"检验单号\" / \"报告日期\" / \"检测数值\"\n4. 若文书有任一执行证据命中 → CLEAN (服务实际开展).\n5. 若 fee 有 + 文书无执行证据 → VIOLATION,\n   evidence: 引 fee 项目名 + 价格 + \"在 辅助检查 等 section 中未检索到 检验报告 等执行描述\".\n6. 文书 section 不完整 (例如手术记录缺失) / 描述模糊 → INCONCLUSIVE.\n\n特殊注意:\n- 医院对所有患者一律收某项检验但部分患者实际无该样本 (如无尿患者收尿常规), 强支持 VIOLATION.\n\n"
trigger_keywords:
  - 血常规
  - 尿常规
  - 大便常规
  - 肝肾功能
  - 电解质
  - 检验报告
trigger_codes: []
exam_keywords: []
suggested_tools:
  - search_fees
  - search_notes
expected_signal: "典型违规: 费用列'尿常规 × 3', 文书检验报告段只有 1 份尿常规.\n典型 CLEAN: 每项检验都有对应报告 + 数值.\n典型 INCONCLUSIVE: 报告日期缺失或检测数值模糊.\n"
notes: ''
