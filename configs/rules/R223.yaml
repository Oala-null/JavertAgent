rule_id: R223
domain: 麻醉
violation_type: 串换项目
question: 开展气管插管术，但按照特殊方法气管插管术收费。
example: 示例：医院为患者实施的项目为气管插管术，但按照价格更高的"特殊方法气管插管术"收费，属于串换项目。
status: ready
priority: P2
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「特殊方法气管插管术 (高价)」实际开展的是「普通气管插管术 (低价)」, 即项目身份串换.

  按诊疗规范:
  - "普通气管插管术": 直接喉镜下经口/经鼻气管插管, 常规喉镜暴露声门
  - "特殊方法气管插管术": 困难气道处理, 需特殊设备 (纤支镜引导 / 可视喉镜 / 光棒 / 喉罩 / 环甲膜穿刺 / 逆行引导)

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "特殊方法气管插管" / "困难气道" / "纤支镜插管" / "可视喉镜插管"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="麻醉记录" / "手术信息" / keyword=...) 提取插管过程描述.
  4. 检查文书是否含「特殊方法插管」独有特征 (多数命中 → CLEAN):
     - "困难气道" / "Mallampati III/IV 级"
     - "纤支镜引导" / "光导纤维"
     - "可视喉镜" / "Glidescope" / "McGrath"
     - "光棒"
     - "环甲膜穿刺" / "逆行引导"
     - "声门暴露困难" / "麻醉医师呼叫"
  5. 检查文书操作描述是否吻合「普通气管插管」(若命中 + 无 Y 独有特征 → V):
     - "直接喉镜下"
     - "声门暴露良好" / "Mallampati I/II 级"
     - "插管顺利, 一次成功"
     - "气管插管深度 N cm"
  6. 检查排除指征 (命中 → CLEAN):
     - 颌面外伤 / 颈椎外伤 / 强直性脊柱炎 / 颞颌关节强直
     - 肥胖 BMI ≥ 35
     - 急救场景 (插管前 SpO2 < 80%)
  7. 文书无插管过程描述 → INCONCLUSIVE.
     麻醉记录 section 缺失但有交叉引用 → INCONCLUSIVE conf 0.5 + etl_warning (这是 R203 同款 ETL 问题).

  特殊注意:
  - 关键证据是 "插管方法" + "特殊设备": 普通插管无设备记录, 特殊插管必带设备型号.
  - 若 fee 含特殊方法 + 麻醉记录仅 "直接喉镜插管" → 强 V.

  关键判定逻辑: fee 收特殊方法 + 文书无困难气道 / 特殊设备 = 串换 V.

  注意: 麻醉记录数字化常缺失 (ETL 问题), 大概率 INCONCLUSIVE + etl_warning.
trigger_keywords:
  - 特殊方法气管插管
  - 困难气道
  - 纤支镜引导
  - 可视喉镜
  - 光棒
  - 环甲膜穿刺
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: fee 收特殊方法气管插管, 麻醉记录写 "直接喉镜 1 次成功".
  典型 CLEAN: 困难气道 + 纤支镜引导 + Glidescope 等明确特殊设备记录.
  典型 INCONCLUSIVE: 麻醉记录单未数字化, ETL 缺失.
notes: ''
