rule_id: R250
domain: 口腔
violation_type: 超标准收费
question: 开展各种口腔检查或治疗项目，未按照计价单位收费。
example: '示例1：如将按“次”计费的口腔项目按“牙”收费；将按“牙”计费的口腔项目按“根管”或“洞”收费。

  示例2：某省《诊疗目录》规定，开髓引流术计价单位为“每牙”，某医院一次治疗过程中实际开展3颗牙，但按照每根管共收取10次费用，多收取7次费用属于超标准收费。

  示例3：《口腔类医疗服务价格项目立项指南（试行）》中，口腔牵引钉取出费计价说明：“本项目所称“次”：以3枚牵引钉为基础收费，每增加1枚加收，以10枚牵引钉费用封顶”。某医院为患者开展口腔牵引钉取出15枚，按计价说明应收取10枚费用，超出5枚属于超标准收费。'
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否未按诊疗目录规定的计价标准收取「口腔检查/治疗项目 (开髓引流术 / 根管充填术 / 龋齿修复 / 牙体修复 等)」费用.

  📖 诊疗目录条款 (来源: 截至 2026-04-01 全量诊疗项目库):
    项目名: 口腔检查/治疗项目 (开髓引流术 / 根管充填术 / 龋齿修复 / 牙体修复 等)
    基础价: ¥5 (开髓引流/牙) / 60 (根管充填/根管) / 牙 (开髓引流) / 根管 (根管充填) / 洞 (龋齿修复 / 牙体充填)
    加成规则: 各口腔项目有专属计价单位, 不可串换. 开髓引流按'每牙'收费, 根管充填按'每根管'收费, 龋齿修复按'每洞'收费.

  ⚠️ 典型违规模式: 按'次'收费替代'牙/根管/洞' (1 颗牙 3 根管 = 收 10 次根管充填)

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中, 记录出现次数 count + 实收金额合计. 检索关键词: "开髓引流" / "根管充填" / "龋齿修复" / "牙体修复" / "口腔检查"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该项目).
  3. 用 search_notes(section="口腔治疗记录") 或 search_notes(keyword=...) 提取实际事件量化值 N.
     量化关键词: "牙数" / "根管数" / "洞数" / "治疗牙位" / "上颌左 6" / "下颌右 7"
  4. 按目录规则计算应收次数 expected:
     开髓引流: 治疗 N 颗牙 = 收 N 次; 根管充填: 治疗 N 颗牙 (每牙平均 1-4 根管) → 按根管数收. 若 1 颗牙 3 根管 应收 3 次, 收 10 次 = V.
  5. 比对 count vs expected:
     - count 显著大于 expected → VIOLATION (超标准多收),
       evidence: 引 fee 项目名 × count + 实际事件 N + 目录单位 "牙 (开髓引流) / 根管 (根管充填) / 洞 (龋齿修复 / 牙体充填)" + 应收 expected + 多收金额.
     - count 等于 expected → CLEAN (按目录正确收).
     - count 小于 expected → CLEAN (未足量收, 不属本规则).
  6. 文书未提供量化信息 (切口数/治疗时长/牙数/血管数/疗程数 等) → INCONCLUSIVE.

  特殊注意:
  - 判定关键: 口腔治疗记录中牙数/根管数/洞数; fee 命中次数 vs 实际治疗数量
  - 口腔项目计价单位错乱是医院常见违规模式

  注意: J66252 是甲状腺癌, 非口腔患者, fee 不会命中 → CLEAN. 该规则在口腔科患者高命中.
trigger_keywords:
  - 开髓引流
  - 根管充填
  - 龋齿修复
  - 牙体修复
  - 口腔检查
  - 牙数
  - 根管数
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 1 颗牙 3 根管充填, 收 10 次费用.
  典型 CLEAN: 计价单位与实际数量匹配.
  典型 INCONCLUSIVE: 口腔记录未明示牙数/根管数.
