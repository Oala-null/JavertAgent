rule_id: R323
domain: 眼科
violation_type: 分解收费
question: 翼状胬肉切除伴移植等眼科手术中，另收眼球粘连分离、结膜囊成形或内外眦成形费用，是否有独立操作和当地价格依据。
example: 实际记录为翼状胬肉切除伴自体移植，另收粘连分离、结膜囊成形和内外眦成形费，但术中操作及独立计费依据待核实。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |
  本规则逐项核对眼球粘连分离、结膜囊成形、内外眦成形收费。翼状胬肉切除伴自体干细胞/角膜缘干细胞/结膜移植是重点场景，不是唯一适用条件。费用名与临床术式可有合法映射，不得仅因术名不同认定虚构或分解。
  1. 用 search_fees 分别搜“粘连分离”“结膜囊成形”“结膜囊成型”“眦成形”“眦成型”，核实眼科部位、原始项目名/编码、收费日期、净数量和金额。排除非眼科粘连分离；全部无目标净正收费才 CLEAN。加收、扩展项不能自动算成另一主项。
  2. 用 search_orders 和 search_notes 检索“翼状胬肉”“干细胞”“移植”“粘连”“结膜囊”“眦”，核对入院专科查体、术前讨论、手术记录和术后记录，逐项列出所需操作是否实际记载及眼别。眼球运动自如只是间接线索，不能单独证明无粘连；无相关诊断也不能单独证明未做。
  3. 对每个收费编码用 catalog_lookup(item_code=实际编码, item_name=实际名称, service_date=服务日期) 核对有效内涵、映射和包含关系。须核实目录地区适用于该院；无地区依据、条款不全/被截断、版本冲突时列为证据缺口，不能用外省或未来目录替代。
  4. 净正收费存在，实际术中记录明确未开展该项或记载取消且无替代执行，支持该项 VIOLATION；或者已核实当地有效价格内涵把该操作包含在已收费主术式内、实际同一次同一部位却又独立收费，支持分解收费 VIOLATION。证据需逐项对应收费行、操作反证或价格条文。
  5. 只有病历未提、只有“运动自如”、术式映射不清或价格依据不全，判 INCONCLUSIVE conf 0.50，明确分别需补哪项手术记录/计价依据；不得因主术式确实实施就把所有附加收费 CLEAN。
  6. 所有目标项目均有明确实际操作、侧别和可独立收费依据，且数量一致时 CLEAN。若有一项明确违规应指出该项；没有明确违规但任一项目待核，整体 INCONCLUSIVE。
  同切口折价是另一个政策问题，本规则不预设第二术式折扣，不因同切口自动减价或推算违规金额。
