expected_signal: |
  违规：同次操作的附属步骤已被有效目录包含，仍单列收费；或明确未实施却未退费。
  待核：主术式存在，三项附加收费中的执行记录或独立计价依据不全。
  合规：独立病变、独立执行及当地独立计价依据均可定位。
