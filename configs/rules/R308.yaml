rule_id: R308
domain: 精神医学
violation_type: 串换项目
question: 将应用录音录像设备开展的治疗，串换为心理治疗收费。
example: 示例：《精神治疗类医疗服务价格项目立项指南（试行）》中明确"心理治疗"指线下或运用线上实时视频交互手段实现的治疗，录音录像等不得按此收费。某医院应用录音录像设备为患者开展治疗，按"心理治疗"进行收费，属于串换项目。
status: ready
priority: P2
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「心理治疗 (高价医保项目)」实际开展的是「录音录像设备治疗」(单向音视频, 非交互), 即项目身份串换.

  按诊疗规范, "心理治疗" 项目内涵 (精神治疗类医疗服务价格项目立项指南):
  - 线下面对面治疗, 或
  - 运用线上实时视频交互手段 (远程视频)
  - **录音录像设备开展的治疗 (单向播放, 非实时交互) 不得按心理治疗收费**

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "心理治疗" / "心理咨询" / "认知行为治疗" / "CBT"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="心理治疗记录" / "病程记录" / keyword=...) 提取治疗形式描述.
  4. 检查文书是否含「合规心理治疗」独有特征 (多数命中 → CLEAN):
     - "心理治疗师" + 签名 / 工号
     - "面对面治疗" / "1 对 1 治疗"
     - "认知行为治疗 CBT" / "精神动力学治疗" / "森田疗法" / "暴露治疗" 等具体疗法
     - "治疗时长 50 分钟" / "标准治疗时段"
     - "远程视频交互" (合规, 若有)
  5. 检查文书是否仅吻合「录音录像设备治疗」(若命中 + 无 Y 独有特征 → V):
     - "录音录像" / "音视频播放"
     - "VR 治疗" 但无治疗师交互
     - "听音乐 N 分钟" / "观看视频 N 分钟"
     - 无心理治疗师参与记录
  6. 文书无治疗形式描述 → INCONCLUSIVE.

  特殊注意:
  - 关键证据是 "心理治疗师参与" + "1 对 1 交互". 单向音视频播放不符合 "心理治疗" 内涵.
  - VR 暴露治疗若有治疗师实时交互引导 → 合规心理治疗; 若仅 VR 自助播放 → V.

  关键判定逻辑: fee 收心理治疗 + 文书仅描述录音录像播放 + 无治疗师交互 = 串换 V.

  注意: 黄色难度 — 文书结构依赖. 多见于精神病专科 / 心理科.
trigger_keywords:
  - 心理治疗
  - 心理咨询
  - 录音录像
  - 音视频治疗
  - 心理治疗师
  - CBT
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: fee 收 "心理治疗" 多次, 病程仅 "观看心理教育视频 30 分钟".
  典型 CLEAN: 心理治疗师面对面 CBT 治疗, 时长 50 分钟, 治疗师签名.
  典型 INCONCLUSIVE: 病程仅 "行心理治疗" 无具体形式.
