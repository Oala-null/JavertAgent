rule_id: R018
domain: 心血管内科
violation_type: 重复收费
question: 开展冠脉内局部放射治疗，重复收取同位素放射源及放疗装置的使用费用。
example: 示例：某省《诊疗目录》规定，冠脉内局部放射治疗术项目内涵：含冠脉造影、同位素放射源及放疗装置的使用。某医院为动脉粥样硬化患者开展冠脉内局部放射治疗，已收取“冠脉内局部放射治疗术”费用，重复收取同位素放射源费用，属于重复收费。
status: ready
priority: P1
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「冠脉内局部放射治疗」项目 + 独立的「同位素放射源 / 放疗装置使用费」.
  按各省《医疗服务诊疗目录》, 冠脉内局部放射治疗术项目内涵已包含冠脉造影 + 同位素放射源 + 放疗装置使用, 单独再收即重复收费.

  审计步骤:
  1. 用 search_fees(category="手术类") 或 search_fees(keyword=...) 查是否同时存在以下两类:
     A 类 (主项手术): "冠脉内局部放射治疗" / "冠脉内放射治疗" / "冠状动脉内放射治疗术"
     B 类 (附属耗材/使用费, 应被内涵): "同位素放射源" / "放射源使用费" / "放疗装置使用" / "近距离放射源" / "β射线源"
  2. 若 A 类无命中 → CLEAN (规则不适用, 患者未做冠脉内放射治疗).
  3. 若 A 类命中但 B 类无命中 → CLEAN (主项收费单一, 未重复).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="手术记录") 无独立放射源植入指征描述 → VIOLATION,
     evidence: 引两笔费用项目名 + 价格 + 手术记录原文.
  5. 信息模糊 (B 类项目名歧义, 可能是其他放射治疗) → INCONCLUSIVE.

  注意: 患者基础诊断需含冠心病 / 动脉粥样硬化 / 冠脉狭窄 (note_diagnosis 命中); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - 冠脉内局部放射治疗
  - 同位素放射源
  - 放疗装置使用
  - 冠脉造影
  - 近距离放射源
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 同次住院同时存在 "冠脉内局部放射治疗术" + "同位素放射源使用费" 两笔.
  典型 CLEAN: 仅冠脉内放射治疗术单项费用.
  典型 INCONCLUSIVE: 放射源项目名歧义, 无法判断是冠脉内放射源还是其他放射治疗.
notes: ''
derived_from_template: M1
precheck:
  a_items:
    - 冠脉内局部放射治疗
    - 冠脉内放射治疗
    - 冠状动脉内放射治疗术
  b_items:
    - 同位素放射源
    - 放射源使用费
    - 放疗装置使用
    - 近距离放射源
    - β射线源
