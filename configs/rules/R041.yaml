rule_id: R041
domain: 骨科
violation_type: 串换项目
question: 不同的中医骨科手法整复术之间串换收费。
example: 示例：某医院中医师对脊柱骨折患者，通过牵引过伸按压法进行复位，应收取"骨折手法整复术"（单价210元）费用，但实际收取"麻醉下腰椎间盘突出症大手法治疗"（单价700元）费用，属于串换项目。
status: ready
priority: P2
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「高价中医骨科手法 (麻醉下大手法)」实际开展的是「普通手法整复」, 即中医手法之间串换.

  按诊疗规范, 中医骨科手法术式分级:
  - "骨折手法整复术" (¥210): 普通手法复位, 无麻醉
  - "麻醉下腰椎间盘突出症大手法治疗" (¥700): 麻醉 + 大手法 (麻醉条件下复位)
  - 其他中医手法 (推拿 / 正骨 / 牵引等)

  审计步骤:
  1. 用 search_fees(keyword=...) 查命中.
     检索关键词: "麻醉下大手法" / "大手法治疗" / "骨折手法整复" / "中医骨科手法" / "正骨手法"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="手术记录" / "中医治疗记录" / keyword=...) 提取治疗过程描述.
  4. 检查文书是否含「麻醉下大手法」独有特征 (多数命中 → CLEAN):
     - "全身麻醉" / "椎管内麻醉" / "局部麻醉" + 中医手法
     - "腰椎间盘突出症 + 麻醉下复位"
     - "大手法" 直接描述
     - 麻醉师签名 / 麻醉记录
  5. 检查文书操作描述是否仅吻合「普通手法整复」(若命中 + 无 Y 独有特征 → V):
     - "牵引" / "过伸按压" / "提按手法"
     - 无麻醉描述
     - 操作时长 ≤ 15 分钟
  6. 检查患者诊断 (note_diagnosis) 是否支持麻醉下大手法:
     - 重度腰椎间盘突出 (神经根压迫 + 严重疼痛, 普通手法不可耐受)
     - 急性脊柱骨折需麻醉下复位
     若有支持指征 + 麻醉记录 → CLEAN.
  7. 文书无操作过程描述 → INCONCLUSIVE.

  特殊注意:
  - 关键证据是 "麻醉" 描述. 麻醉下大手法必须有麻醉记录, 普通手法没有.
  - 红色难度 - 部分原因是手法操作记录文书细节常不完整.

  关键判定逻辑: fee 收麻醉下大手法 + 文书无麻醉记录 = V.

  注意: 红色难度. 多见于中医院 / 中医骨伤科.
trigger_keywords:
  - 麻醉下大手法
  - 大手法治疗
  - 骨折手法整复
  - 中医骨科手法
  - 正骨手法
  - 椎间盘
suggested_tools:
  - search_fees
  - search_notes
  - note_diagnosis
expected_signal: |
  典型违规: 脊柱骨折 fee 收 "麻醉下大手法 ¥700", 文书仅"牵引过伸按压".
  典型 CLEAN: 重度椎间盘突出 + 麻醉下大手法 + 麻醉师签名.
  典型 INCONCLUSIVE: 文书仅"行手法整复治疗"无细节.
notes: ''
