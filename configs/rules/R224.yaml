expected_signal: "典型违规: ICU 无尿患者诊断含'急性肾衰无尿'还收尿常规 ¥10/天 × 7 天.\n典型 CLEAN: ICU 患者多次尿常规监测有对应检验报告.\n典型 INCONCLUSIVE: ICU 监测记录简略, 无明确检验数值.\n"
