rule_id: R317
domain: 神经内科
violation_type: 虚构医药服务项目
question: 未开展相关诊疗项目，但收取对应诊疗费用。
example: 示例：某医院收取「经皮穿刺脑血管腔内溶栓术」费用，但手术记录实为机械取栓、无溶栓操作，全费用单无任何溶栓药物。
status: ready
priority: P0
prompt_addon: |+
  本规则关注: 患者本次住院里, 费用中有「经皮穿刺脑血管腔内溶栓术」, 但文书中没有对应的
  执行记录, 即 "虚构 经皮穿刺脑血管腔内溶栓术 项目骗取医保基金".
  按诊疗规范, 脑血管腔内溶栓术须经导管注入溶栓药物 (尿激酶/阿替普酶/rt-PA/替奈普酶/瑞替普酶) 溶解血栓, 手术记录应明确记载溶栓药名+剂量+注入过程. 系统 companion 预检已确认: 收取溶栓术但全费用单无任何溶栓药 = 强虚构信号 (溶栓术无法在不用溶栓药的情况下完成). 若实际操作为机械取栓 (Solitaire 支架/抽吸导管), 属串换/虚构溶栓项目.

  【裁决基准 (举证责任, M5 虚构类通则 — 优先于下列步骤)】
  - 治疗/手术类收费项目存在 = 医院已就该操作向基金收费, 举证"该操作确实开展"的责任在收费方。
  - 文书找不到该操作的执行证据时, 默认下限为 INCONCLUSIVE (证据缺失待人工核查);
    MUST NOT 因"文书未提及 / 未检索到执行描述"就判 CLEAN。
  - 仅当文书**正面反证**该操作确实执行 (操作记录 / 治疗单 / 麻醉记录 / 执行记载, 含操作名+时间+过程)
    → CLEAN。
  - 若文书正面显示该操作实际**未执行** (记录为其它操作 / 明确未做 / 诊断无支持且执行痕迹全缺)
    → VIOLATION。
  - 名称警示: 收费项目名与文书术式名常不一致 (如「肘关节截骨术」↔「尺骨截骨术」),
    MUST NOT 仅因名称不同就断言"未收费"或"未执行"; 用解剖部位与操作类别交叉核对。

  审计步骤:
  1. 用 search_fees 查 fee 是否命中. 检索关键词: "溶栓术" / "脑血管腔内溶栓" / "动脉溶栓" / "经皮穿刺脑血管"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未被收取该费用).
  3. 用 search_notes 检查文书是否有该服务的执行记录:
     - 重点检查 section: "手术记录" / "神经介入记录" / "介入治疗记录"
     - 执行证据关键词: "溶栓药" / "尿激酶" / "阿替普酶" / "rt-PA" / "溶栓过程" / "药物注入"
  4. 若文书有任一执行证据命中 → CLEAN (服务实际开展).
  5. 若 fee 有 + 文书无执行证据 → VIOLATION,
     evidence: 引 fee 项目名 + 价格 + "在 手术记录 等 section 中未检索到 溶栓药 等执行描述".
  6. 文书 section 不完整 (例如手术记录缺失) / 描述模糊 → INCONCLUSIVE.

  特殊注意:
  - 溶栓术须用溶栓药; 若手术记录为机械取栓 (Solitaire/抽吸导管) 而非药物溶栓, 系串换/虚构溶栓项目, 强支持 VIOLATION.
  - 系统 companion 预检已注入'收溶栓术无溶栓药'确定性事实块, 优先据手术记录核实实际操作类型 (溶栓 vs 取栓).

trigger_keywords:
  - 溶栓术
  - 脑血管腔内溶栓
  - 动脉溶栓
  - 尿激酶
  - 阿替普酶
  - 取栓
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 收「经皮穿刺脑血管腔内溶栓术」¥1100, 手术记录为机械取栓无溶栓药.
  典型 CLEAN: 手术记录明确记载 rt-PA 经导管溶栓 + 剂量.
  典型 INCONCLUSIVE: 收溶栓术, 手术记录缺失/含糊无法判断实际操作.
