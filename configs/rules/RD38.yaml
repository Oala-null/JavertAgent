rule_id: RD38
domain: 药品
violation_type: 过度诊疗
question: 多种抗青光眼滴眼液同期使用，是否有与患者病情和眼压控制相符的联合必要性，是否存在无依据的重复成分用药。
example: 费用出现毛果芸香碱、卡替洛尔、布林佐胺及溴莫尼定滴眼液，需核实是否同期同眼使用以及联合治疗理由。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |
  本规则关注多种降眼压滴眼液联合必要性，不能因为都属于抗青光眼药、出现四种药或仅有青光眼诊断就自动定性。不同机制联合可有合理指征；缺联合理由是待复核线索，不等于已证明过度用药。
  1. search_fees 按“毛果芸香碱/匹罗卡品”“卡替洛尔”“布林佐胺”“溴莫尼定”分别搜索，并补查实际处方其他降眼压滴眼剂。记录原始名称、成分、规格、净数量、日期，排除退净/未执行、非滴眼剂和仅出院备用情形。不要依赖药品类别过滤，避免滴眼液分类别名漏检；支/瓶的收费量不能当每天滴药次数。
  2. search_orders 按实际药名查用法、频次、起止/停药/换药、眼别和执行；search_notes 查“眼压”“青光眼”“高眼压”“联合”“停用”“调整”“术前”“术后”等。依次换药、不同侧用药、跨时段处方不能当作同期同眼联用；收费日期相同只证明费用共存，不证明用药重叠。
  3. 核查联合当时的眼压记录/目标、控制不佳或病情变化、既往单药疗效、急性高眼压或围手术期处理等具体理由；控制后的正常眼压不能反推联合前无必要。不限于某一个诊断关键词，也不设未经来源确认的药物数目或眼压阈值。
  4. 复方滴眼液按真实活性成分核对，不能把一个复方名称中的两成分拆成两笔收费；若另有相同单方，核实实际重叠、剂量和是否有调整理由。两种不同机制药物不能仅因同为降眼压药视为重复成分。
  5. 至少两种候选药费用存在但起止/眼别/实际用药或联合理由不清，判 INCONCLUSIVE conf 0.50，明确需补处方执行、眼压趋势及联合说明；不得因未见理由直接 VIOLATION，也不得因有青光眼诊断直接 CLEAN。
  6. 只有一项实际药物且无联用候选、已证实为序贯换药/不同眼独立治疗，或同期联合有完整临床与调整依据且无不合理成分重叠，判 CLEAN。完整证据明确已停药仍重复执行并收费、误重复处方已被确认无治疗目的等支持 VIOLATION，引用具体时间、药品、眼别及明确不合理证据。缺记录仍只复核，不把一般经验当法定限制。
  本规则不接管肿瘤资格，也不重写通用限适应症、禁忌或限二线支付结论；仅审本次联合/重复用药必要性。
trigger_keywords: [毛果芸香碱, 匹罗卡品, 卡替洛尔, 布林佐胺, 溴莫尼定]
trigger_codes: []
exam_keywords: [毛果芸香碱, 匹罗卡品, 卡替洛尔, 布林佐胺, 溴莫尼定]
suggested_tools: [search_fees, search_orders, search_notes]
expected_signal: |
  待核：四种候选滴眼液均有费用，但用药重叠及联合理由不明。
  合规：眼压控制不佳有联合理由；或明确先停一种再换另一种。
  违规：有明确已确认误重复/无治疗目的的执行和未退净收费证据。
notes: 2026-09-06 专家线索手工扩展，非国家0325清单原始条目。联合用药不等于过度用药；复方药公开资料仅用于边界校准，不作全部病例指征证据。ready仅表示编写完成，未跑测试或病例、未经临床验证、未部署。见 docs/expert_ophthalmology_rules.md。
