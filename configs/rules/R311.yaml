rule_id: R311
domain: 精神医学
violation_type: 过度诊疗
question: 违反项目内涵及适应证规定，为非重性精神病急性发作期、或无急性发作指征的患者常规化、全程化开展精神科监护并收费。
example: 示例：《全国医疗服务项目技术规范》明确，精神科监护是指由经过训练的专业人员对存在急性、冲动、自杀、伤人、毁物及有外走、妄想、幻觉和木僵的患者实施监护。《精神治疗类医疗服务价格项目立项指南（试行）》明确，精神科监护的服务产出为“为处于重性精神病急性发作期的患者提供严密监护服务”，计价说明限定适用对象为“出现急性、冲动、自杀、伤人、毁物及有外走、妄想、幻觉和木僵等症状的患者”。某医院为非重性精神病急性发作期或无相关指征的住院患者，常规、全程开展“精神科监护”并收费，属于违反诊疗规范过度诊疗。
status: ready
priority: P0
prompt_addon: |+
  本规则关注: 患者本次住院里, 是否被无指征收取了「精神科监护 (常规化全程化)」治疗/干预.
  按医保政策, 精神科监护仅适用于重性精神病急性发作期 / 自伤自杀风险 / 严重激越等场景. 慢性稳定期患者长期收取属过度诊疗.

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中. 检索关键词: "精神科监护" / "精神监护"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该治疗).
  3. 用 note_diagnosis 列出全部诊断, 用 search_notes(section="精神状况评估") 查文书证据.
  4. 检查是否含任一指征:
     - 精神分裂症急性发作
     - 双相情感障碍躁狂期
     - 重度抑郁伴自杀风险
     - 急性精神病性障碍
     - 自伤
     - 自杀风险
     - 木僵
     - 拒食拒治
     - 严重激越
     - 兴奋躁动
     - 谵妄
     
     若有任一指征 → CLEAN (有指征).
  5. 检查是否含任一明确排除指征 (硬证据 V):
     - 康复期精神分裂症
     - 稳定期精神病
     - 配合治疗 (文书明示)
     - 已稳定 (文书明示)
     
     若有任一排除指征命中 + treatment 命中 → VIOLATION (强证据, 治疗与诊断硬冲突).
  6. 若指征不命中 + 排除指征也不命中 + treatment 命中 → VIOLATION (无指征过度).
     evidence: 引诊断完整列表 + 该治疗项目名 + 价格.
  7. 文书简略 / 诊断为"待查"/"疑似"等中间状态 → INCONCLUSIVE.

  特殊条件: 用 search_notes 查关键执行证据: "精神状况" / "BPRS" / "PANSS" / "兴奋评分" / "自伤风险"; 缺失加分判 V.

  特殊注意:
  - 即使诊断含精神病, 若文书描述 '配合治疗 / 慢性期 / 已稳定' 仍是 V.

trigger_keywords:
  - 精神科监护
  - 精神监护
  - 精神分裂症急性发作
  - 稳定期
  - 康复期
suggested_tools:
  - search_fees
  - note_diagnosis
  - search_notes
expected_signal: |
  典型违规: 诊断 '康复期精神分裂症', 长期收 '精神科监护 ¥150/天'.
  典型 CLEAN: 急性发作期患者监护 1-2 周.
  典型 INCONCLUSIVE: 精神状态描述模糊.
