expected_signal: |
  典型待复核：A/B 超各1次且有 AB 报告，但只有白内障术前常规描述，未分别说明 B 超后节指征。
  典型违规：完整证据明确无需某项检查，仍执行无临床目的的套餐收费。
  典型合规：A 超用于人工晶体计算，B 超因眼底窥不清评估视网膜，目的和侧别均明确。
notes: 专家扩展规则，非0325原始条目；报告存在与临床必要性分开判断。2026-09-06手工补强AB合并候选和时段/指征边界，清空M2来源以避免多次检查单次闸误用；本次ready修订未跑测试或病例、未经临床验证、未部署。见 docs/expert_ophthalmology_rules.md。
