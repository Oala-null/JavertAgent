rule_id: R322
domain: 眼科
violation_type: 过度检查
question: 同时开展眼部 A 型和 B 型超声检查时，未分别记录两类检查的独立临床目的或指征。
example: 患者同时收取 A 型、B 型超声费用并有 AB 超报告，但病历只记录一般术前检查，没有人工晶体生物测量目的和后节评估指征的分别说明。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |
  本规则在同次住院存在眼部A型/B型超声净正收费，或同一个AB组合收费明确包含两种检查时审计。AB报告存在只能证明执行，不能自动证明联合必要性；组合收费不能虚构成两笔费用。

  A 型超声通常用于眼轴/生物测量、人工晶体度数计算等量化目的；B 型超声通常用于屈光介质不透明时观察玻璃体、视网膜和眼后节，或评估占位、脱离、出血等。必须分别找到与患者实际病情相符的临床目的，不能用“术前常规”一词同时替代两类指征。

  审计步骤：
  1. coexist_review 预检只给出名称候选。search_fees 分别搜“A型”“A 型”“A超”“A超声”“B型”“B 型”“B超”“B超声”“AB”及实际命中名，核对编码、部位、服务日期和净数量；排除非眼科超声。确认只有一类时 CLEAN；合并名称需 catalog_lookup 按实际编码/名称/服务日期核实内涵，AB含义不清则 INCONCLUSIVE。
  2. 调 search_examinations(keyword="AB型超声") 或分别检索 A/B 超，确认报告内容和检查部位。若结构化表无记录但返回“非结构化报告候选”，只把它作为执行线索。
  3. 调 search_notes 检索“眼轴”“人工晶体”“生物测量”“玻璃体”“视网膜”“眼底窥不清”“屈光介质混浊”“后节”等，分别归入 A 型目的与 B 型指征；同时核对左右眼。
  4. 分别核对实际检查时段，两类目的均明确、与侧别和当时病情相符时 CLEAN。不同日期有不同临床问题不能当作固定联查；出院时好转或术后眼底清晰不能反推检查当日无指征。
  5. 报告存在但只找到一类目的，或病历没有说明两项分别解决什么临床问题，判 INCONCLUSIVE conf 0.50，明确“需核查同时开具 A/B 超的临床指征”；不得沿用虚构检查规则的“报告存在即合规”。
  6. 只有完整临床与可核实的适用专业依据共同证明该次额外检查无临床目的（例如明确记载无须该检查却按固定套餐执行收费），才支持 VIOLATION；不能只凭眼底清晰、未记载或收费并存定性，更不能从一名患者推断全院固定套餐。依据不足时 INCONCLUSIVE，指明需核查哪一种检查的目的。

  注意：白内障手术本身可能支持 A 型生物测量，但不当然支持 B 型检查；反之亦然。
  “眼轴测量”只用于候选召回，须确认实际技术；不能把光学生物测量直接认作A型超声。若实为光学测量+B超，本规则不据此推定A/B超联查。
