expected_signal: |
  典型待复核：A/B 超各1次且有 AB 报告，但只有白内障术前常规描述，未分别说明 B 超后节指征。
  典型违规：无后节病变/介质混浊，仍把 A/B 超固定打包收费。
  典型合规：A 超用于人工晶体计算，B 超因眼底窥不清评估视网膜，目的和侧别均明确。
notes: 专家扩展规则，非 0325 原始条目；报告存在与临床必要性分开判断。
