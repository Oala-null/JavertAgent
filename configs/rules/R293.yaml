rule_id: R293
domain: 精神医学
violation_type: 超标准收费
question: 开展心理治疗、精神康复治疗等时，未按照加收标准收费。
example: 示例：《精神治疗类医疗服务价格项目立项指南》中精神康复治疗（个人）加收项为“每增加10分钟加收”。某医院为患者治疗时，未按实际增加时间加收，收取多笔“精神康复治疗”基础费用，属于超标准收费。
status: ready
priority: P0
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否未按诊疗目录规定的计价标准收取「心理治疗 (个体/家庭/团体) / 精神康复治疗」费用.

  📖 诊疗目录条款 (来源: 截至 2026-04-01 全量诊疗项目库):
    项目名: 心理治疗 (个体/家庭/团体) / 精神康复治疗
    基础价: ¥67 (心理治疗个体半小时) / 20 (每 10min 加收) / 48 (精神康复个人半小时) / 14 (每 10min 加收) / 半小时 (基础) + 每增加 10 分钟 (加收)
    加成规则: 心理治疗 (个体) 基础: ¥67/半小时; 超时按 ¥20/10min 加收, 不超过 30%. 精神康复治疗 (个人) 基础: ¥48/半小时; 超时 ¥14/10min, ≤30%. 不与心理咨询同时收取.

  ⚠️ 典型违规模式: 超时未按加收 ¥20/10min, 而收多笔基础费 ¥67 替代 / 加收超 30% 上限

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中, 记录出现次数 count + 实收金额合计. 检索关键词: "心理治疗" / "精神康复治疗"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该项目).
  3. 用 search_notes(section="心理治疗记录") 或 search_notes(keyword=...) 提取实际事件量化值 N.
     量化关键词: "治疗时长" / "心理治疗时长" / "康复治疗时长" / "实际时长" / "加收时长"
  4. 按目录规则计算应收次数 expected:
     1 次 60min 心理治疗应收 = ¥67 (半小时) + ¥20 × 3 (每 10min 加收) = ¥127. 若收 2 笔基础 ¥67 × 2 = ¥134 → V (违反加收规则). 加收 ≤ 30% 上限 = ¥67 × 30% = ¥20 (最多 1 个 10min, 实际可多达 3 个 10min, 看具体省定).
  5. 比对 count vs expected:
     - count 显著大于 expected → VIOLATION (超标准多收),
       evidence: 引 fee 项目名 × count + 实际事件 N + 目录单位 "半小时 (基础) + 每增加 10 分钟 (加收)" + 应收 expected + 多收金额.
     - count 等于 expected → CLEAN (按目录正确收).
     - count 小于 expected → CLEAN (未足量收, 不属本规则).
  6. 文书未提供量化信息 (切口数/治疗时长/牙数/血管数/疗程数 等) → INCONCLUSIVE.

  特殊注意:
  - 判定关键: 心理治疗记录'治疗时长'描述 + fee 命中模式 (基础 × N 次 vs 基础 + 加收 × N 次)
  - 正确模式: 1 次 60min = 1 笔基础 + 3 笔加收 (而非 2 笔基础)
  - fee 命中'心理治疗' × ≥2 次同日 + 文书 1 次治疗 → 强支持 V

  注意: J66252 非精神科, fee 不命中 → CLEAN. 该规则在精神科/心理科患者高命中.
trigger_keywords:
