rule_id: R038
domain: 骨科
violation_type: 串换项目
question: 将椎间盘消融治疗操作串换为心脏电生理诊疗项目分类下的射频消融术收费。
example: 示例：某省《诊疗目录》规定，"射频消融术"属于心脏电生理诊疗类；椎间盘微创消融术有单独对应的诊疗项目，按射频、臭氧、离子等消融方式分别计价，单价介于2200元—3200元/每间盘之间。某医院为腰椎间盘突出症患者行腰椎间盘射频消融术，应收取"腰椎间盘射频消融术"费用（单价：2500元），但医院实际收取心脏电生理诊疗项目下的"射频消融术"（单价：4200元），属于串换项目。
status: ready
priority: P2
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「心脏电生理射频消融术 (¥4200/次)」实际开展的是「椎间盘射频消融术 (骨科 ¥2500/间盘)」, 即跨科室项目身份串换.

  按诊疗规范:
  - "心脏电生理射频消融术": 心内科介入手术, 治疗心律失常 (房颤 / 房扑 / 室上速 / 室速), 用心内电生理仪 + 心腔内导管
  - "椎间盘射频消融术": 骨科 / 疼痛科微创手术, 治疗椎间盘突出, 用椎间盘射频仪 + 椎间盘穿刺针

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "射频消融术" + 区分是否带"椎间盘"前缀
     - 若 fee 为 "射频消融术" 无 "椎间盘" 前缀 → 进入审计
     - 若 fee 为 "椎间盘射频消融术" → CLEAN (项目身份一致)
  2. 用 note_diagnosis 列出诊断, 判断是否心内/骨科:
     - 心内诊断 (房颤 / 房扑 / 室上速 / 室速 / WPW / 心律失常) → 走心内 CLEAN 流程, 不构成本规则违规
     - 骨科诊断 (腰椎间盘突出 / 颈椎间盘突出 / 椎间盘脱出) + fee "射频消融术" → 强 V 嫌疑
  3. 用 search_notes(section="手术记录" / "操作记录" / keyword=...) 提取操作描述.
  4. 检查文书是否含「心脏电生理射频消融」独有特征 (命中 → CLEAN):
     - "心内电生理仪"
     - "心房 / 心室 / 三尖瓣 / 二尖瓣"
     - "肺静脉隔离" (房颤) / "希氏束消融"
     - "心腔内导管"
     - 心电图记录贴单
  5. 检查文书是否吻合「椎间盘消融」(若命中 + 心内诊断 0 命中 + 骨科诊断命中 → V):
     - "椎间盘" / "腰椎 L4-5 / L5-S1"
     - "椎间盘穿刺"
     - "影像引导" (CT / X 线引导)
     - 操作部位 = 腰背部 (非胸部)
  6. 文书无操作部位 → INCONCLUSIVE.

  特殊注意:
  - 关键判定: 跨科室身份不符. 骨科患者 fee 含心内电生理项目是强 V.
  - 这是医保审计高发问题之一 (科室代码错放).

  关键判定逻辑: fee = 心电生理射频消融 + 骨科诊断 + 文书操作椎间盘 = 强 V (跨科串换).

  注意: 注意区分 fee 项目名 (是否带"椎间盘" 前缀). 多见于骨科 / 疼痛科.
trigger_keywords:
  - 射频消融术
  - 椎间盘消融
  - 心脏电生理
  - 椎间盘突出
  - 房颤
  - 室上速
suggested_tools:
  - search_fees
  - search_notes
  - note_diagnosis
expected_signal: |
  典型违规: 腰椎间盘突出患者 fee 含 "射频消融术" (心电生理类), 文书椎间盘操作.
  典型 CLEAN: 房颤患者心脏电生理射频消融, 心电图 + 心腔内导管描述.
  典型 INCONCLUSIVE: 文书无操作部位描述.
