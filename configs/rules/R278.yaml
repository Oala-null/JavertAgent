expected_signal: '典型违规: 骨科 / 普外患者 fee 同次含 ACTH + 性激素 + 生长激素 + TGAb + TMAb 五项套餐.

  典型 CLEAN: 桥本甲状腺炎患者单查 TGAb + TMAb.

  典型 INCONCLUSIVE: 仅 1-2 类命中且诊断模糊.

  '
