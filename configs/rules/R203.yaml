rule_id: R203
domain: 麻醉
violation_type: 虚构医药服务项目
question: 未开展相关诊疗项目，但收取对应诊疗费用。
example: 示例：某医院实际开展全身麻醉操作1000多例，但同时间段内，收取全身麻醉费用2万多次，存在虚构全身麻醉项目的情况。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: "本规则关注: 患者本次住院里, 费用中有「全身麻醉 (含气管插管全麻 / 静脉全麻)」, 但文书中没有对应的\n执行记录, 即 \"虚构 全身麻醉 (含气管插管全麻 / 静脉全麻) 项目骗取医保基金\".\n按医保政策, 全身麻醉必须有麻醉记录单 (诱导药物 + 维持药物 + 气管插管时间 + 苏醒过程). 实际开展数与收费数偏差大 = 虚构 (统计学异常需个案审核).\n\n专家共识 (v0.7 校准): 当 case_notes 缺\"麻醉记录\"段时, **必须先回退到「手术记录」「术后首次病程记录」**\n这两个 section 查\"麻醉方法\"字段 — 这些术后文书会标记麻醉方式 (如\"全麻气管插管\"/\"静脉麻醉\").\n若术后文书提到全麻方式 + fee 有手术耗材 → 麻醉真实存在, 麻醉记录单只是 ETL 未数字化 → CLEAN\n(而非 INCONCLUSIVE 或 VIOLATION).\n\n【裁决基准 (举证责任, M5 虚构类通则 — 优先于下列步骤)】\n- 治疗/手术类收费项目存在 = 医院已就该操作向基金收费, 举证\"该操作确实开展\"的责任在收费方。\n- 文书找不到该操作的执行证据时, 默认下限为 INCONCLUSIVE (证据缺失待人工核查);\n  MUST NOT 因\"文书未提及 / 未检索到执行描述\"就判 CLEAN。\n- 仅当文书**正面反证**该操作确实执行 (操作记录 / 治疗单 / 麻醉记录 / 执行记载, 含操作名+时间+过程)\n  → CLEAN。\n- 若文书正面显示该操作实际**未执行** (记录为其它操作 / 明确未做 / 诊断无支持且执行痕迹全缺)\n  → VIOLATION。\n- 名称警示: 收费项目名与文书术式名常不一致 (如「肘关节截骨术」↔「尺骨截骨术」),\n  MUST NOT 仅因名称不同就断言\"未收费\"或\"未执行\"; 用解剖部位与操作类别交叉核对。\n\n审计步骤:\n1. 用 search_fees 查 fee 是否命中. 检索关键词: \"全身麻醉\" / \"气管插管全麻\" / \"静脉全麻\" / \"全麻费用\"\n2. 若 fee 无命中 → CLEAN (规则不适用, 患者未被收取该费用).\n3. 用 search_notes 检查文书是否有该服务的执行记录:\n   - 重点检查 section: \"麻醉记录\" / \"手术记录\" / \"术后首次病程记录\"\n   - 执行证据关键词: \"麻醉记录\" / \"诱导药物\" / \"维持药物\" / \"气管插管\" / \"苏醒过程\"\n4. **v0.7 新增** 若 \"麻醉记录\" section 缺失或 ETL_GAP, **必须**再调:\n   a. search_notes(section=\"手术记录\") — 看末尾的麻醉医师签名 + 麻醉方式描述\n   b. search_notes(section=\"术后首次病程记录\") — 看\"麻醉方法\"字段 (常见: 全麻/全身麻醉/气管插管/静脉麻醉)\n   c. search_notes(keyword=\"麻醉方法\") — 跨 section 检索\n   d. search_notes(keyword=\"全麻\") 或 search_notes(keyword=\"气管插管\") — 直接查关键词\n   若 a-d 任一命中具体麻醉方式 → CLEAN (服务实际开展, 麻醉记录单 ETL 未数字化).\n5. 若文书有任一执行证据命中 → CLEAN (服务实际开展).\n6. 若 fee 有 + 上述 4 项全部无证据 → VIOLATION,\n   evidence: 引 fee 项目名 + 价格 + \"麻醉记录/手术记录/术后首次病程记录/全麻关键词 均无执行描述\".\n7. 文书所有 section 全部 ETL_GAP / 描述完全模糊 → INCONCLUSIVE conf 0.5 + etl_warning evidence.\n若 search_fees(keyword='异丙酚'或'七氟烷'等麻醉药) 命中具体麻醉药但麻醉记录段空 → INCONCLUSIVE (用了药但记录不全, 不算完全虚构).\n\n特殊条件: 若文书无 麻醉科 科室介入痕迹 (例: 该科记录段为空 / 该科入院记录未生成) + 步骤 4 全部无证据, 强支持 VIOLATION.\n\n特殊注意:\n- 全麻必有麻醉医师签名 + 时长; 文书完全无麻醉记录是强 VIOLATION 证据 — 但要确认步骤 4 也无证据.\n- 甲状腺手术 / 脑部手术 / 骨科四级手术等大型手术几乎必有全麻 — 麻醉记录缺失大概率 ETL gap, 不是虚构.\n\n注意: 甲状腺手术多为全麻气管插管, 麻醉记录应完整; 若文书麻醉记录缺失需走步骤 4 复核.\n\n📌 专家共识触发器 (v0.7, wangxin/zhoulihong 加权 9C/4V/0I, wangxin: \"胡扯\" 强烈反对):\n\nCLEAN 触发器 (强支持):\n- 患者有手术记录 (search_notes section=\"手术记录\" 任一命中) + 文书任意位置出现\"全麻\"/\"气管插管\"/\"麻醉医师\"/\"麻醉时间\"/\"麻醉方法\"任一关键词\n  → zhoulihong: \"目前所有涉及全身麻醉的都被检出, 原因是未检索到麻醉记录文书. 可根据【手术记录】及【术后首次病程记录】中\"麻醉方法\"判断收费真实性. 因这两份文书是术后记录, 一定程度上可反映术中情况\"\n  → wangxin: \"胡扯\" (反对仅凭无麻醉记录就判 V)\n- search_fees 命中具体麻醉药 (异丙酚/七氟烷/瑞芬太尼等) 或耗材 (气管导管/喉镜片) → CLEAN\n\nINCONCLUSIVE 触发器 (回退仍无):\n- 全部回退 section (手术记录/术后首次病程记录/查 keyword=\"全麻\"/\"气管插管\"等) 0 命中 + 有手术耗材费 → INCONCLUSIVE conf 0.5 + etl_warning. **不要 V**.\n\n反例 (V): 无任何手术 + 无任何麻醉药费 + 仅有全麻费 (极罕见, 真\"虚构服务\").\n"
