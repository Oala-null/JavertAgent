rule_id: R117
domain: 医学影像
violation_type: 重复收费
question: 开展床旁检查（如X线透视检查、超声检查等）并收费，同时重复收取同类常规检查费用。
example: 示例：某地《诊疗目录》规定：床旁透视与透视常规检查不能同时收取费用。某医院对重症患者开展床旁透视，收取"床旁透视""透视常规检查"费用。其中，"透视常规检查"属于重复收费。类似的还有床旁B超检查、床旁彩色多普勒超声检查、床旁超声心动图等。
status: ready
priority: P1
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「床旁 X 检查」+ 同类的「常规检查」.
  按诊疗目录, 床旁检查 (床旁透视 / 床旁 B 超 / 床旁彩超 / 床旁超声心动图) 与同类常规检查不能同时收取, 床旁版项目内涵已含常规检查内容.

  审计步骤:
  1. 用 search_fees(category="检查类") 取检查类明细; 关注是否同时存在以下两类匹配对:
     A 类 (床旁): "床旁透视" / "床旁 B 超" / "床旁彩色多普勒超声" / "床旁超声心动图" / "床旁 X 线"
     B 类 (对应常规): "透视常规检查" / "B 超常规检查" / "彩色多普勒超声常规检查" / "超声心动图常规检查"
  2. 若 A 类全无命中 → CLEAN (患者未做床旁检查, 规则不适用).
  3. 若 A 类某项命中, 同次住院同名常规检查 B 类也命中 → VIOLATION,
     evidence: 引床旁项目名 + 常规项目名 + 价格 + 同时收费.
  4. 若 A 类命中但同次无对应 B 类 → CLEAN.
  5. 多次床旁检查叠加多次常规检查, 计算同名重复对数 → 多对 V.

  特殊注意:
  - 重点是 "同名" 对应; 床旁透视 vs B超常规检查不算重复 (不同类).
  - 床旁检查通常用于 ICU / 不能搬动患者, 重症监护场景, 这是 A 类合理使用, 不构成本规则违规.
trigger_keywords:
  - 床旁透视
  - 床旁B超
  - 床旁彩色多普勒
  - 床旁超声心动图
  - 透视常规检查
  - 超声常规检查
suggested_tools:
  - search_fees
expected_signal: |
  典型违规: fee 同次同时含 "床旁透视" + "透视常规检查" 两笔.
  典型 CLEAN: 仅床旁项目无对应常规; 或常规无对应床旁版.
  典型 INCONCLUSIVE: 项目名简写无法判断是床旁还是常规.
notes: ''
derived_from_template: M1
