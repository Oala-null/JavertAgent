rule_id: R100
domain: 康复
violation_type: 将不属于医保支付范围的纳入医保基金结算
question: |
  开展日常生活动作训练，医保支付存在下述问题：
  1.不符合医保限定支付适应症；
  2.不符合医保限定支付天数；
  3.不符合医保继续支付的限定条件。
example: 示例：某省《诊疗目录》中，日常生活动作训练限支付日常生活活动能力障碍（ADL）患者，重度患者支付不超过90天，中度患者支付不超过60天，轻度患者支付不超过30天，每14天训练经功能量表评定后取得明确功能进步才可继续支付。某患者可以正常生活并能自理，但医院在其住院期间，每日开展日常生活动作训练，费用由医保支付，不符合医保限定支付适应症。
status: ready
priority: P2
prompt_addon: |
  本规则关注: 患者本次住院的「日常生活动作训练 (ADL)」是否符合医保限定支付 (适应症 / 天数 / 继续支付条件).
  按各省诊疗目录:
    1) 适应症: 限 ADL 障碍患者; 可自理 / 无 ADL 障碍患者不应收费
    2) 天数限制: 重度 ADL 障碍 ≤ 90 天, 中度 ≤ 60 天, 轻度 ≤ 30 天
    3) 继续支付条件: 每 14 天训练后经功能量表评定取得"明确功能进步"才可继续

  审计步骤:
  1. 用 search_fees(keyword=...) 查命中次数 count.
     检索关键词: "日常生活动作训练" / "ADL 训练" / "日常生活活动训练"
  2. 若 count == 0 → CLEAN.
  3. 用 note_diagnosis 提取诊断, 判断 ADL 障碍程度:
     A) 重度 ADL 障碍硬证据: "脊髓损伤截瘫" / "重度脑卒中后遗症" / "脑外伤昏迷恢复期" / "全瘫"
     B) 中度: "偏瘫" / "肢体功能障碍" / "Barthel 40-60 分" / "脑梗后遗症"
     C) 轻度: "局部肢体无力" / "Barthel 60-80 分" / "轻度肌力下降"
     D) 无 ADL 障碍硬证据: "生活完全自理" / "Barthel 90+ 分" / "无明显功能障碍" / "意识清楚活动自如"
  4. 判定:
     - D 类硬证据命中 + count >= 1 → VIOLATION (适应症不符, 强硬证据),
       evidence: 引"生活自理"文书原文 + 训练项目费.
     - A 类 + count > 90 → V (超天数);  B 类 + count > 60 → V;  C 类 + count > 30 → V.
     - 文书 search_notes(keyword="功能量表" / "Barthel" / "FIM" / "评定") 在 14 天间隔点看是否有量表进步评定; 缺评定 + count > 14 → V (无评定继续支付).
  5. 诊断仅"康复治疗" 等模糊描述 + 无量表 → INCONCLUSIVE.

  特殊注意:
  - 文书 search_notes(keyword="Barthel" / "FIM" / "ADL 评分") 是关键证据.
  - 即使 ADL 障碍指征明确, 若超 14 天无功能量表进步评定继续支付 → V (硬证据).
trigger_keywords:
  - 日常生活动作训练
  - ADL训练
  - Barthel
  - FIM
  - 偏瘫
  - 截瘫
  - 生活自理
suggested_tools:
  - search_fees
  - note_diagnosis
  - search_notes
expected_signal: |
  典型违规: 可自理患者 (Barthel 90 分) 每日 ADL 训练; 或脑梗中度患者 > 60 天.
  典型 CLEAN: 重度截瘫患者训练 60 天 + 量表评定有进步.
  典型 INCONCLUSIVE: 无量表分数 / 诊断模糊.
notes: ''
