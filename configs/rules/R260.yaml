rule_id: R260
domain: 口腔
violation_type: 重复收费
question: 开展牙龈翻瓣术，重复收取根面平整术费用。
example: 示例：某省《诊疗目录》中，牙龈翻瓣术项目内涵：“含牙龈切开、翻瓣、刮治及根面平整、瓣的复位缝合”。某医院为患者行牙龈翻瓣术时收费，同时收取“根面平整术”费用，属于重复收费。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「牙龈翻瓣术 / 牙周翻瓣手术」项目 + 独立的「根面平整术 / 龈下刮治」费用.
  按各省《医疗服务诊疗目录》, 牙龈翻瓣术项目内涵已含牙龈切开、翻瓣、刮治及根面平整、瓣的复位缝合, 单独再收根面平整术 = 重复收费.

  审计步骤:
  1. 用 search_fees(category="手术类") 取手术类全部明细; 关注是否同时存在以下两类:
     A 类 (翻瓣术): "牙龈翻瓣术" / "翻瓣术" / "牙周翻瓣手术"
     B 类 (根面平整): "根面平整术" / "根面平整" / "龈下刮治"
  2. 若 A 类无命中 → CLEAN (该患者根本没做牙龈翻瓣术, 规则不适用).
  3. 若 A 类有命中且 B 类无命中 → CLEAN (翻瓣术费用单一, 未重复收根面平整费).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="口腔诊治记录"/"手术记录") 没有提到该报告由
     分次进行 / 不同象限分别处理 (有独立诊次与象限记录) → VIOLATION, evidence 引翻瓣术笔数 + 根面平整笔数 + 价格 + 口腔记录象限 / 诊次描述.
  5. 信息明确不足 (例如费用项目仅写 '牙周治疗 ¥250', 无法判断是否包含独立刮治步骤) → INCONCLUSIVE.

  注意: 患者基础诊断必须含牙周炎 (note_diagnosis 命中"牙周炎"/"慢性牙周炎"/"重度牙周炎"/"牙龈炎"/"侵袭性牙周炎"); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - 牙龈翻瓣术
  - 翻瓣术
  - 牙周翻瓣
  - 根面平整术
  - 根面平整
  - 龈下刮治
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 同次诊治 "牙龈翻瓣术 ¥250" + "根面平整术 ¥120" 同一象限同一日, 口腔记录未分次叙述.
  典型 CLEAN: 仅有翻瓣术单笔; 或口腔记录明确不同象限 / 不同诊次分别开展独立计费.
