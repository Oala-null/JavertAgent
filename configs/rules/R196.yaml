rule_id: R196
domain: 肿瘤
violation_type: 超标准收费
question: 高强度超声聚焦刀治疗，未按计价标准收费。
example: 示例：某省《诊疗目录》规定，高强度超声聚焦刀治疗的收费标准为，肿瘤直径≤3cm收8000元；肿瘤直径>5cm或≤8cm加收3000元；肿瘤直径>8cm加收6000元。某医院对所有接受高强度超声聚焦刀治疗，全部按照17000元/次的标准收费，未根据实际肿瘤瘤体直径进行收费，属于超标准收费。
status: ready
priority: P0
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否未按诊疗目录规定的计价标准收取「高强度聚焦超声热消融肿瘤治疗 (HIFU)」费用.

  📖 诊疗目录条款 (来源: 截至 2026-04-01 全量诊疗项目库):
    项目名: 高强度聚焦超声热消融肿瘤治疗 (HIFU)
    基础价: ¥2000 (小: 瘤径 ≤3cm) / 10000 (大: 瘤径 >3cm) / 次 (同一病灶按一次计收)
    加成规则: 同一病灶 (大) 治疗按一次计收; 同一病灶 (小) 按实际治疗次数计收, 超过 5 次的最高按 5 次计收.

  ⚠️ 典型违规模式: 同一病灶按多次重复收费 (大病灶) / 全按 ¥17000+ 收 (混淆档位)

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中, 记录出现次数 count + 实收金额合计. 检索关键词: "高强度聚焦超声" / "HIFU" / "聚焦超声消融" / "热消融"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该项目).
  3. 用 search_notes(section="手术记录") 或 search_notes(keyword=...) 提取实际事件量化值 N.
     量化关键词: "肿瘤直径" / "瘤径" / "瘤体大小" / "病灶数" / "病灶位置"
  4. 按目录规则计算应收次数 expected:
     瘤径 ≤3cm 按小档 ¥2000; >3cm 按大档 ¥10000; 大病灶 1 次治疗 = 1 次费用, 不能多次收.
  5. 比对 count vs expected:
     - count 显著大于 expected → VIOLATION (超标准多收),
       evidence: 引 fee 项目名 × count + 实际事件 N + 目录单位 "次 (同一病灶按一次计收)" + 应收 expected + 多收金额.
     - count 等于 expected → CLEAN (按目录正确收).
     - count 小于 expected → CLEAN (未足量收, 不属本规则).
  6. 文书未提供量化信息 (切口数/治疗时长/牙数/血管数/疗程数 等) → INCONCLUSIVE.

  特殊注意:
  - 判定关键: 手术记录瘤体直径; 与 fee 收费档位匹配
  - fee 命中 (大) × 多次 + 文书描述单病灶, 强支持 V

  注意: J66252 甲状腺癌做的是根治手术, 非 HIFU, fee 不会命中 → CLEAN.
trigger_keywords:
  - 高强度聚焦超声
  - HIFU
  - 聚焦超声消融
  - 热消融
  - 瘤径
  - 病灶
trigger_codes:
  - S240700004
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 子宫肌瘤患者 1 个病灶 HIFU 治疗, 收大档 ¥10000 × 3 次.
  典型 CLEAN: 单病灶 1 次治疗 = 1 次费用; 多病灶按目录分档.
  典型 INCONCLUSIVE: 手术记录未明示瘤体直径.
