rule_id: R076
domain: 血液净化
violation_type: 串换项目
question: 开展血液净化类诊疗项目时，将费用较低的项目串换成费用较高的项目进行收费。
example: 示例：某省《诊疗目录》规定，血液透析滤过单价600元/次，血液透析单价300元/次。某医院使用血液透析滤过机，对患者进行血液透析治疗，应收取"血液透析"费用300元，但实际收取"血液透析滤过"费用600元，属于串换项目。
status: ready
priority: P2
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「血液透析滤过 / CRRT / 血浆置换 / 血液灌流 等高价血液净化项目」实际开展的是「普通血液透析 (低价)」, 即项目身份串换骗保模式.

  按各省《诊疗目录》:
  - "血液透析" (单价 ~300 元/次): 弥散原理清除小分子毒素 (尿素 / 肌酐 / 钾), 用普通透析器
  - "血液透析滤过" (单价 ~600 元/次): 弥散 + 对流原理, 清除小分子 + 中大分子毒素, 需置换液
  - "CRRT 连续性肾脏替代治疗" (单价 ~1500-2000 元/次): 24h 连续治疗, 用 CRRT 专机
  - "血浆置换术" (单价 ~1500 元/次): 分离血浆 + 置换新鲜血浆 / 白蛋白
  - "血液灌流" (单价 ~400-600 元/次): 用灌流器吸附中大分子毒素

  审计步骤:
  1. 用 search_fees(category="其他类") 或 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "血液透析滤过" / "CRRT" / "连续性肾脏替代" / "血浆置换" / "血液灌流"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="病程记录" / "透析记录" / "操作记录" / keyword=...) 提取实际操作过程描述.
  4. 检查文书是否含被收费项目的独有特征 (多数命中 → CLEAN):
     - 血液透析滤过: "置换液 N L" / "在线生成置换液" / "HDF"
     - CRRT: "CRRT 机型" / "24 小时连续" / "Prismaflex" / "Aquarius"
     - 血浆置换术: "血浆分离器" / "置换血浆 N ml" / "新鲜血浆 / 白蛋白替换"
     - 血液灌流: "灌流器型号" / "树脂吸附" / "活性炭"
  5. 检查文书操作描述是否仅吻合普通血液透析 (若命中 + 无 Y 独有特征 → V):
     - "血液透析" 单独词
     - "透析器型号" 是普通透析器 (非滤过器)
     - "透析时长 3-4 小时" (非连续)
     - "无置换液" / "无血浆分离"
  6. 检查排除指征:
     - 急性肾损伤需 CRRT (24h 连续) 的明确指征
     - 药物中毒 / 重症肝衰竭血浆置换指征
  7. 文书无操作过程描述 / 无设备型号 → INCONCLUSIVE.
     section 缺失有交叉引用 → INCONCLUSIVE conf 0.5 + etl_warning.

  特殊注意:
  - 关键证据是 "设备型号" + "置换液量": 高价项目都有专门设备和耗材记录, 普通透析没有.
  - 若 fee 含 "血液透析滤过" + 透析记录仅描述 "血液透析" 无置换液 → 强 V.

  关键判定逻辑: fee 命中高价 Y + 文书无 Y 独有特征 + 文书描述吻合普通血透 = 串换 V.

  注意: 多见于肾内 / 重症 / 急诊科住院患者; 甲状腺 / 骨科 pilot 患者通常无血液净化, fee 不命中 → CLEAN.
trigger_keywords:
  - 血液透析
  - 血液透析滤过
  - CRRT
  - 血浆置换
  - 血液灌流
  - 置换液
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: fee 含 "血液透析滤过" ¥600, 透析记录仅描述普通血液透析, 无置换液.
  典型 CLEAN: CRRT 机型 + 24h 连续治疗的急性肾损伤患者.
  典型 INCONCLUSIVE: 文书仅"血液净化治疗"无具体设备.
notes: ''
