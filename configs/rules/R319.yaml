rule_id: R319
domain: 眼科
violation_type: 超标准收费
question: 眼科按次或按侧收费项目的实际收费数量，大于独立医嘱、实际执行次数或诊疗目录允许数量。
example: 同一左眼手术仅有一次结膜囊冲洗医嘱和一次执行记录，却收取两次；或眼压检查按次计价，两个独立检查事件收取四次。
status: ready
priority: P0
handling_level: 违规（阻断）
prompt_addon: |
  本规则只核对「结膜囊冲洗」和「眼压检查」的收费数量、计价单位、独立医嘱/执行事件与侧别，不因为项目确实做过一次就把全部数量判合规。

  审计步骤：
  1. 分别调用 search_fees 检索“结膜囊冲洗”“冲洗结膜囊”“眼压检查”“眼压测定”“眼压测量”“眼压日曲线”，记录净数量、原始单位、日期、项目编码和金额；核销关联退费，区分主项与合法加收项。全部无目标净正费用时 CLEAN。
  2. 对每个命中项目调用 catalog_lookup(item_code=实际编码, item_name=实际名称, service_date=收费日期)，核对服务当日当地适用的单位、价格内涵及备注；未来版本不得覆盖历史收费。目录地区未确认、无匹配、备注截断或存在歧义时 INCONCLUSIVE，不凭收费单位或专家摘要猜条款。
  3. 调 search_orders(keyword=项目核心名) 核查医嘱类型、数量、下达与执行时间；再用 search_notes(keyword=项目核心名) 查操作/治疗/病程中的实际执行和眼别。结构化医嘱优先；“非结构化医嘱候选”的文本命中次数不能直接当独立医嘱次数。
  4. 只有有效当地目录和完整执行记录共同确定允许数量，净收费仍超过允许数量，才判 VIOLATION；证据同时列条款、净数量、独立事件和侧别。ST仅是医嘱频次，一条医嘱可有合法双眼或分次执行，不把医嘱条数、费用行数、复制病程次数直接当上限。
  5. 单位为“次”也须阅读双眼计价及项目内涵，不能自动推定双眼必收一次或必收两次。仅左眼手术、右眼未记录不等于右眼绝无独立诊疗；无法排除右眼合法执行时待核。眼压日曲线作为候选单独核对内涵，不能按普通单次眼压检查计量；同时存在日曲线和普通眼压时查其包含关系。
  6. 只有全文候选、目录缺失、医嘱时间不清或无法确认独立事件数时，判 INCONCLUSIVE conf 0.50，并写明需核对原始医嘱单/执行单/当地物价版本；不得凭缺失判 V 或 C。
  7. 费用数量与独立医嘱、执行记录和当日目录计价完全一致时 CLEAN。

  专家校准：收费存在 + 一次同侧ST/执行 + 数量2是核查信号；目录明确允许1且全部执行核实才确认超量1。数量与允许次数一致时合规，目录或执行缺口不能判V或直接放过。
