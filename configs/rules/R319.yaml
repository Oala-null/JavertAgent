rule_id: R319
domain: 眼科
violation_type: 超标准收费
question: 眼科按次或按侧收费项目的实际收费数量，大于独立医嘱、实际执行次数或诊疗目录允许数量。
example: 同一左眼手术仅有一次结膜囊冲洗医嘱和一次执行记录，却收取两次；或眼压检查按次计价，两个独立检查事件收取四次。
status: ready
priority: P0
handling_level: 违规（阻断）
prompt_addon: |
  本规则只核对「结膜囊冲洗」和「眼压检查」的收费数量、计价单位、独立医嘱/执行事件与侧别，不因为项目确实做过一次就把全部数量判合规。

  审计步骤：
  1. 分别调用 search_fees(keyword="结膜囊冲洗")、search_fees(keyword="眼压检查")，记录净数量、原始单位、日期、项目编码和金额。两项均无费用时 CLEAN。
  2. 对每个命中项目调用 catalog_lookup(item_code=..., item_name=..., service_date=收费日期)，必须使用服务当日有效条目；未来版本不得覆盖历史收费。目录无匹配或存在歧义时保留证据，不自行猜条款。
  3. 调 search_orders(keyword=项目核心名) 核查医嘱类型、数量、下达与执行时间；再用 search_notes(keyword=项目核心名) 查操作/治疗/病程中的实际执行和眼别。结构化医嘱优先；“非结构化医嘱候选”的文本命中次数不能直接当独立医嘱次数。
  4. 若原始单位为「次」，费用净数量显著大于可确认的独立执行事件，且文书明确同一日、同一侧、同一次操作，判 VIOLATION；证据必须同时列费用数量、执行事件和侧别。
  5. 若收费名称带“/单侧”但原始单位或当日目录为「次」，不得仅凭名称后缀把左右眼自动拆成两次。手术部位明确只有左眼且右眼无独立治疗记录时，右眼不能作为第二次收费理由。
  6. 只有全文候选、目录缺失、医嘱时间不清或无法确认独立事件数时，判 INCONCLUSIVE conf 0.50，并写明需核对原始医嘱单/执行单/当地物价版本；不得凭缺失判 V 或 C。
  7. 费用数量与独立医嘱、执行记录和当日目录计价完全一致时 CLEAN。

  专家校准：收费存在 + 一次同侧 ST 医嘱/一次执行 + 数量为 2，是超量收费强信号；眼压两个独立日期事件而单位为「次」、数量为 4，不得按双眼直接放过。
