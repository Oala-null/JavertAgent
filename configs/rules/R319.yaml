expected_signal: |
  典型违规：费用单位为次、数量2，结构化医嘱和左眼执行记录均只有1次。
  典型待复核：OCR 全文只有一处 ST 候选但无结构化医嘱表，需查原始医嘱/执行单。
  典型合规：左右眼分别有独立医嘱和执行，目录按单侧且费用数量与两侧一致。
notes: 专家扩展规则，非 0325 原始条目；2026-08-18 根据 OCR 病例漏检补充。目录版本冲突时只降为人工复核。
