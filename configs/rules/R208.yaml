rule_id: R208
domain: 麻醉
violation_type: 重复收费
question: 开展基础麻醉，重复收取强化麻醉费用。
example: 示例：某省《诊疗目录》规定，基础麻醉含强化麻醉。某医院已收取基础麻醉费用，在同一个麻醉周期中又额外收取“强化麻醉”费用，属于重复收费。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「基础麻醉」项目 + 独立的「强化麻醉」费用.
  按各省《医疗服务诊疗目录》, 基础麻醉项目本身已含强化镇静药物费用, 单独再收强化麻醉费 = 重复收费.

  审计步骤:
  1. 用 search_fees(category="其他类") 取其他类全部明细; 关注是否同时存在以下两类:
     A 类 (基础): "基础麻醉" / "小儿基础麻醉" / "不能配合基础麻醉" / "镇静镇痛麻醉"
     B 类 (强化): "强化麻醉" / "MAC 麻醉" / "监护麻醉" / "强化镇静"
  2. 若 A 类无命中 → CLEAN (该患者根本没做基础麻醉, 规则不适用).
  3. 若 A 类有命中且 B 类无命中 → CLEAN (基础费用单一, 未重复收强化麻醉费).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="麻醉记录"/"手术记录") 没有提到该报告由
     两次麻醉间隔超过 24 小时分次实施 → VIOLATION, evidence 引两笔麻醉费用项目名 + 价格 + 麻醉记录时间窗.
  5. 信息明确不足 (例如麻醉记录中仅一笔麻醉名称模糊, 无法判断属基础还是强化) → INCONCLUSIVE.

  注意: 患者基础诊断必须含需要麻醉的临床场景 (note_diagnosis 命中"手术"/"小儿"/"不能配合"/"焦虑"); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - 基础麻醉
  - 小儿基础麻醉
  - 强化麻醉
  - MAC 麻醉
  - 监护麻醉
  - 强化镇静
  - 麻醉记录
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 同次手术周期同时存在 "基础麻醉 ¥200" 与 "强化麻醉 ¥150" 两笔费用, 麻醉记录无分次执行说明.
  典型 CLEAN: 仅有基础麻醉单笔; 或麻醉记录明确两次麻醉间隔 >24h 独立实施.
notes: ''
