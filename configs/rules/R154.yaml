rule_id: R154
domain: 临床检验
violation_type: 过度检查
question: 将癌胚抗原、糖类抗原作为入院患者的常规检查，对大量无相关疾病指征的患者开展检验并收费。
example: "示例：癌胚抗原、糖类抗原系肿瘤标志物，不同抗原对不同类型肿瘤具有辅助诊断意义。\n示例1：某医院为住院患者普遍无指征开展癌胚抗原、糖类抗原等测定，属于过度检查。\n示例2：某医院肿瘤蛋白芯片（男）、肿瘤蛋白芯片（女）包括几十种肿瘤标志物检测，涉及肺癌、肝癌、乳腺、前列腺、卵巢等多癌种。该院为已经明确具体癌种的患者开具多癌种肿瘤标志物检测，如对肝癌患者开展妇科肿瘤、肺部肿瘤等标志物检测，属于过度检查。"
status: ready
priority: P1
handling_level: 可疑（警告）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被无指征收取了「糖类抗原 / 癌胚抗原系列 (CEA, CA199, CA125, CA153, CA724, CA50, CA242)」检查/检验.
  按诊疗规范, 糖类抗原 / CEA 用于肿瘤筛查 (高危人群) 或既往肿瘤治疗后随访, 不应作为普通入院常规.

  审计步骤:
  1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  2. 用 search_fees(category="检查类") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.
     检索关键词: "癌胚抗原" / "CEA" / "糖类抗原" / "CA199" / "CA125"
  3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).
  4. 检查 note_diagnosis 中是否含以下指征任一:
     - 癌 / 肿瘤 / 恶性肿瘤
     - 占位性病变 / 结节待排
     - 既往肿瘤病史 / 肿瘤治疗后随访
     - 直系亲属肿瘤史 / 肿瘤家族史
     - 肝硬化 / 慢性炎症高危人群
     - 异常出血 / 不明原因消瘦
     - 影像学示肿块待定性
     
  5. 若有任一指征命中 → CLEAN (有指征).
  6. 若无任一指征命中, 且 count >= 1 → VIOLATION,
     evidence: 引诊断完整列表 + 该检查项目名 × count.
  7. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.

  特殊注意:
  - CEA 对甲状腺髓样癌有意义; 患者诊断含 '髓样癌' 则有指征 → CLEAN.

  注意: 甲状腺癌患者部分有指征 (CEA 对甲状腺髓样癌随访), 判 V 前先看诊断是否明确髓样型.
trigger_keywords:
  - 癌胚抗原
  - CEA
  - 糖类抗原
  - CA199
  - CA125
  - CA153
  - CA724
  - 肿瘤标志物
suggested_tools:
  - note_diagnosis
  - search_fees
expected_signal: |
  典型违规: 阑尾炎手术患者收 CA199 × 1, 无肿瘤/家族史/高危指征.
  典型 CLEAN: 甲状腺髓样癌患者随访 CEA, 或胃癌术后随访 CA199 + CEA.
  典型 INCONCLUSIVE: 诊断 "占位待查" / "消瘦待查" 等中间状态.
notes: ''
