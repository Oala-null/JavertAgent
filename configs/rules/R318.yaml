rule_id: R318
domain: 消化内科
violation_type: 虚构医药服务项目
question: 未开展相关诊疗项目，但收取对应诊疗费用。
example: 示例：某医院收取「经胃镜特殊治疗」费用，但操作记录仅见胃镜检查+色素染色，抬举征阴性后未实施任何治疗操作。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |+
  本规则关注: 患者本次住院里, 费用中有「经胃镜特殊治疗 (内镜下治疗)」, 但文书中没有对应的
  执行记录, 即 "虚构 经胃镜特殊治疗 (内镜下治疗) 项目骗取医保基金".
  内镜特殊治疗 (如黏膜切除 EMR / 黏膜下剥离 ESD / 内镜下止血 / 息肉电切) 指在诊断性内镜基础上实施的治疗性操作, 操作记录应明确记载治疗方式 + 器械 (圈套器/切开刀/止血夹/注射针) + 切除物/处置. 仅做胃镜检查 + 色素染色 (抬举征观察) 而未实施任何治疗操作, 却收取治疗费 = 虚构治疗项目.

  【裁决基准 (举证责任, M5 虚构类通则 — 优先于下列步骤)】
  - 治疗/手术类收费项目存在 = 医院已就该操作向基金收费, 举证"该操作确实开展"的责任在收费方。
  - 文书找不到该操作的执行证据时, 默认下限为 INCONCLUSIVE (证据缺失待人工核查);
    MUST NOT 因"文书未提及 / 未检索到执行描述"就判 CLEAN。
  - 仅当文书**正面反证**该操作确实执行 (操作记录 / 治疗单 / 麻醉记录 / 执行记载, 含操作名+时间+过程)
    → CLEAN。
  - 若文书正面显示该操作实际**未执行** (记录为其它操作 / 明确未做 / 诊断无支持且执行痕迹全缺)
    → VIOLATION。
  - 名称警示: 收费项目名与文书术式名常不一致 (如「肘关节截骨术」↔「尺骨截骨术」),
    MUST NOT 仅因名称不同就断言"未收费"或"未执行"; 用解剖部位与操作类别交叉核对。

  审计步骤:
  1. 用 search_fees 查 fee 是否命中. 检索关键词: "经胃镜特殊治疗" / "内镜下治疗" / "内镜特殊治疗" / "胃镜治疗"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未被收取该费用).
  3. 用 search_notes 检查文书是否有该服务的执行记录:
     - 重点检查 section: "内镜操作记录" / "胃镜检查报告" / "手术记录"
     - 执行证据关键词: "黏膜切除" / "黏膜下剥离" / "圈套器" / "止血夹" / "电切" / "切除标本"
  4. 若文书有任一执行证据命中 → CLEAN (服务实际开展).
  5. 若 fee 有 + 文书无执行证据 → VIOLATION,
     evidence: 引 fee 项目名 + 价格 + "在 内镜操作记录 等 section 中未检索到 黏膜切除 等执行描述".
  6. 文书 section 不完整 (例如手术记录缺失) / 描述模糊 → INCONCLUSIVE.

  特殊注意:
  - 经胃镜特殊治疗须有实际治疗操作记录; 若操作记录仅见检查 + 色素染色 (如抬举征观察), 抬举征阴性后未实施治疗即收治疗费, 强支持 VIOLATION.
  - 区分诊断性内镜 (检查, 另有检查费) 与治疗性内镜 (治疗费): 只做检查不做治疗却收治疗费即虚构.

trigger_keywords:
  - 经胃镜特殊治疗
  - 内镜下治疗
  - 黏膜切除
  - 黏膜下剥离
  - 色素
  - 抬举征
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 收「经胃镜特殊治疗」¥400, 操作记录仅胃镜检查+色素染色, 抬举征阴性后未治疗.
  典型 CLEAN: 操作记录载 EMR 圈套器切除息肉 + 标本送检.
  典型 INCONCLUSIVE: 收治疗费, 内镜操作记录缺失/含糊.
