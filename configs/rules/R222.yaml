rule_id: R222
domain: 麻醉
violation_type: 过度诊疗
question: 医院无指征普遍开展特殊方法气管插管术。
example: 示例：特殊气管插管术一般用于困难气道。某医院对所有气管插管患者，无论气道状况，普遍采取特殊方法气管插管术并收费，属于过度诊疗。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被无指征收取了「特殊方法气管插管术 (纤支镜引导 / 视频喉镜 / 经鼻气管插管)」治疗/干预.
  按医保政策, 特殊方法气管插管术 (纤支镜/视频喉镜) 仅适用于困难气道 / Mallampati Ⅲ-Ⅳ / 颈椎不稳定 / 巨大甲状腺肿压迫气道等. 无指征普遍开展属过度诊疗.

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中. 检索关键词: "特殊方法气管插管" / "困难气道插管" / "纤支镜引导插管" / "视频喉镜插管" / "经鼻气管插管"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该治疗).
  3. 用 note_diagnosis 列出全部诊断, 用 search_notes(section="麻醉记录") 查文书证据.
  4. 检查是否含任一指征:
     - 困难气道
     - 困难插管
     - Mallampati Ⅲ-Ⅳ
     - 张口受限
     - 颈椎不稳定
     - 头颈手术
     - 颌面外伤
     - 喉部肿瘤
     - 巨大甲状腺肿压迫气道
     
     若有任一指征 → CLEAN (有指征).
  5. 检查是否含任一明确排除指征 (硬证据 V):
     
     若有任一排除指征命中 + treatment 命中 → VIOLATION (强证据, 治疗与诊断硬冲突).
  6. 若指征不命中 + 排除指征也不命中 + treatment 命中 → VIOLATION (无指征过度).
     evidence: 引诊断完整列表 + 该治疗项目名 + 价格.
  7. 文书简略 / 诊断为"待查"/"疑似"等中间状态 → INCONCLUSIVE.

  特殊条件: 用 search_notes 查关键执行证据: "插管方式" / "气道评估" / "Mallampati" / "插管难度"; 缺失加分判 V.

  特殊注意:
  - 普通甲状腺手术若无气道压迫描述, 一般用普通气管插管即可.

  注意: 甲状腺癌患者如有 '巨大甲状腺肿' 或 '气管受压' 描述, 是 CLEAN; 否则疑 V.
trigger_keywords:
  - 特殊方法气管插管
  - 困难气道
  - 纤支镜引导插管
  - 视频喉镜
  - 经鼻气管插管
  - Mallampati
trigger_codes:
  - S330100014
suggested_tools:
  - search_fees
  - note_diagnosis
  - search_notes
expected_signal: |
  典型违规: 普通甲状腺癌患者无气道压迫描述, 收特殊插管费.
  典型 CLEAN: 患者诊断含 '巨大甲状腺肿伴气管受压', 特殊插管有指征.
  典型 INCONCLUSIVE: 文书未明示气道评估细节.
notes: ''
