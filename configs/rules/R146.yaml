rule_id: R146
domain: 临床检验
violation_type: 过度检查
question: 医院部分科室将B型钠尿肽、B型钠尿肽前体等测定作为入院患者的常规检查，对大量无相关疾病指征的患者开展检验。
example: 示例：B型纳尿肽定量（BNP)、B型钠尿肽前体（proBNP）一般用于心衰诊断、危险分级、疗效监测和预后评估，常适用于心血管疾病，肺部疾病，其他肾病、肺病等疾病。医院为住院患者普遍无指征开展BNP、pro-BNP测定，属于过度检查。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |+
  本规则关注: 患者本次住院里, 是否被无指征收取了「BNP / NT-proBNP (B 型钠尿肽 / N 端 B 型钠尿肽前体)」检查/检验.
  按诊疗规范, BNP / NT-proBNP 用于心衰诊断 / 分级 / 监测疗效, 不应作为普通入院常规.

  审计步骤:
  1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  2. 用 search_fees(category="检查类") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.
     检索关键词: "BNP" / "NT-proBNP" / "B 型钠尿肽" / "B 型尿钠肽"
  3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).
  4. 检查 note_diagnosis 中是否含以下指征任一:
     - 心力衰竭 / 心衰 / 心功能不全
     - 急性失代偿性心衰
     - 肺水肿
     - 急性冠脉综合征 / ACS
     - 心肌病 / 扩张型心肌病 / 肥厚型心肌病
     - 呼吸困难待查 / 胸闷待查
     - 肾衰竭伴心衰
     - 瓣膜性心脏病
     
  5. 若有任一指征命中 → CLEAN (有指征).
  6. 【判「无指征」前 MUST 执行】用 scan_progress_indications(patient_id, symptom_kw_list=["胸闷", "气短", "喘", "憋", "胸痛", "下肢水肿", "发热", "咳嗽", "心悸"]) 扫病程/查房 section 族的症状指征.
     - 若命中**阳性**症状 (无 [否认段]/[选项框] 标注) → CLEAN (病程记录有指征, 不只看诊断).
     - 仅当诊断无指征 **且** 病程症状 0 阳性命中时, 才可继续向 VIOLATION 推进.
  7. 若无任一诊断指征命中 且病程症状 0 阳性命中, 且 count >= 1 → VIOLATION,
     evidence: 引诊断完整列表 + 该检查项目名 × count.
  8. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.

trigger_keywords:
  - BNP
  - NT-proBNP
  - B 型钠尿肽
  - N 端 B 型钠尿肽前体
  - 心衰
  - 心功能不全
  - 心衰标志物
trigger_codes:
  - S250306012
  - S250306013
suggested_tools:
  - note_diagnosis
  - search_fees
expected_signal: |
  典型违规: 患者诊断只有 "甲状腺结节", 收 NT-proBNP × 2 次.
  典型 CLEAN: 心衰患者多次 BNP 监测疗效.
  典型 INCONCLUSIVE: 诊断 "胸闷待查" / "呼吸困难待查" 等中间状态.
notes: ''
