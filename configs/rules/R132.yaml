rule_id: R132
domain: 医学影像
violation_type: 过度检查
question: 将内镜色素检查作为入院患者的常规检查，普遍为无相关指征的患者开展检验并收费。
example: 示例：内镜色素检查是在常规内镜检查基础上，通过喷洒色素染料提高早期肿瘤等病变检出率的技术，适用于特定高危人群或可疑病变的进一步筛查。某医院违反诊疗规范，为患者开展消化道内镜检查时，将内镜色素检查与电子胃十二指肠镜检查设置为检查套餐，强制捆绑，对大量无相关指征的患者打包收取内镜色素检查费用，属于过度检查。
status: ready
priority: P1
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被无指征收取了「内镜色素检查」(常规内镜套餐式打包).
  按诊疗规范, 内镜色素检查 (喷洒染料提高早癌检出率) 适用于特定高危人群 / 可疑病变进一步筛查, 不应作为内镜常规套餐.

  审计步骤:
  1. 用 search_fees(keyword=...) 查内镜色素检查是否做过, 记录出现次数 count.
     检索关键词: "内镜色素" / "色素内镜" / "色素染色" / "亚甲蓝" / "靛胭脂" / "刚果红"
  2. 若 count == 0 → CLEAN (规则不适用).
  3. 用 note_diagnosis 列出该患者诊断, 检查是否含以下指征任一:
     - 早期食管癌 / 早期胃癌 / 早期结肠癌 (可疑或已知)
     - 食管 / 胃 / 肠道癌前病变 (Barrett 食管 / 萎缩性胃炎 / 肠化 / 异型增生 / 腺瘤性息肉)
     - 家族性腺瘤性息肉病 (FAP)
     - 林奇综合征 / 遗传性结直肠癌
     - 长期消化道症状 (黑便 / 便血 / 长期上腹痛 + 报警症状)
     - 内镜下发现可疑病变 (描述为"小结节 / 颜色异常 / 黏膜苍白") 需进一步染色

  4. 若有任一指征命中 → CLEAN (有指征).
  5. 若无任一指征命中 + count >= 1 → VIOLATION (套餐式打包),
     evidence: 引诊断完整列表 + 内镜色素项目名 × count + 价格.
  6. 诊断为"消化道不适待查"/"普通胃炎" 等中间状态 → INCONCLUSIVE.

  特殊注意:
  - 重点防范: 无消化道高危因素患者 (体检 / 一般筛查), 内镜套餐含色素染色.
  - 文书 search_notes(keyword="色素染色") 若提到"喷洒后见特殊染色区" 强支持有指征.
trigger_keywords:
  - 内镜色素
  - 色素内镜
  - 亚甲蓝
  - 靛胭脂
  - 早期食管癌
  - 早期胃癌
  - Barrett食管
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 普通体检患者 fee 同次含 "胃镜检查" + "内镜色素检查" 套餐.
  典型 CLEAN: Barrett 食管随访 / 早癌可疑患者做色素染色.
  典型 INCONCLUSIVE: 诊断"消化道症状待查", 适应症模糊.
notes: ''
