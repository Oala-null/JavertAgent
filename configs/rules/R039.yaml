rule_id: R039
domain: 骨科
violation_type: 串换项目
question: 开展椎间盘突出症治疗，将热凝治疗串换为椎间盘消融术进行收费。
example: 示例：医院对诊断为腰椎间盘突出的患者，使用"射频控温热凝器"进行椎间盘热凝治疗，不属于椎间盘消融，但按照椎间盘微创消融术收费，属于串换项目。
status: ready
priority: P2
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「椎间盘微创消融术 (~2500 元/间盘)」实际开展的是「椎间盘热凝治疗」, 即项目身份串换.

  按诊疗规范:
  - "椎间盘热凝治疗": 用射频控温热凝器 (温度 60-80℃), 仅使纤维环胶原蛋白皱缩, 不破坏髓核组织, 治疗机制为蛋白变性 + 减轻髓核压力
  - "椎间盘微创消融术": 用射频消融针 (温度 95-100℃ 或更高), 髓核组织真消融汽化, 破坏髓核组织, 治疗机制为减压

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "椎间盘消融" / "椎间盘射频消融" / "腰椎间盘消融" / "微创消融"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="手术记录" / "操作记录" / keyword=...) 提取操作参数描述.
  4. 检查文书是否含「椎间盘消融术」独有特征:
     - "温度 95-100℃" / "温度 ≥ 90℃"
     - "消融功率" / "消融时长"
     - "髓核汽化" / "髓核组织消融"
     - "消融范围 N mm"
     - "射频消融针" (不是 "射频控温热凝器")
  5. 检查文书操作描述是否吻合「热凝治疗」(若命中 + 无 Y 独有特征 → V):
     - "射频控温热凝器" / "热凝器型号"
     - "温度 60-80℃" / "温度 ≤ 90℃"
     - "纤维环热凝" / "胶原蛋白皱缩"
     - "无髓核破坏" / "无组织汽化"
  6. 文书无操作温度参数 → INCONCLUSIVE.

  特殊注意:
  - 关键证据是温度参数: 90℃ 以上是消融, 80℃ 以下是热凝.
  - 设备型号也是关键: "射频控温热凝器" 是热凝, "射频消融仪" 是消融.

  关键判定逻辑: fee 收椎间盘消融 + 文书温度 ≤ 80℃ / 设备型号"热凝器" = V.

  注意: 多见于骨科 / 疼痛科 / 神经外科; 甲状腺患者基本不命中.
trigger_keywords:
  - 椎间盘消融
  - 椎间盘射频消融
  - 椎间盘热凝
  - 射频控温热凝器
  - 微创消融
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 腰椎间盘突出患者 fee 收 "椎间盘射频消融术", 手术记录显示温度 70℃ 热凝.
  典型 CLEAN: 操作温度 95℃ + 消融功率 + 髓核汽化描述.
  典型 INCONCLUSIVE: 手术记录无温度参数.
notes: ''
