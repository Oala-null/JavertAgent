rule_id: R153
domain: 临床检验
violation_type: 过度检查
question: 将甲胎蛋白测定作为入院患者的常规检查，对大量无相关疾病指征的患者开展检验并收费。
example: 示例：甲胎蛋白测定主要用于原发性肝癌及其他恶性肿瘤的辅助诊断。某医院为住院患者普遍无指征开展甲胎蛋白测定（AFP)，属于过度检查。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: "本规则关注: 患者本次住院里, 是否被无指征收取了「甲胎蛋白 (AFP, 甲胎蛋白测定, 甲胎蛋白异质体)」检查/检验.\n按诊疗规范, AFP 用于肝癌 / 睾丸生殖细胞肿瘤筛查 + 孕妇产前筛查, 不应作为普通入院常规.\n专家共识 (v0.7 校准): **任何已确诊恶性肿瘤患者查 AFP / CEA 等肿瘤标志物以排查肝转移亦视为合理指征**\n(适用于胃癌、肠癌、肺癌、乳腺癌、淋巴瘤等胸腹腔内恶性肿瘤, 非仅肝癌患者).\n\n审计步骤:\n1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).\n2. 用 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.\n   检索关键词: \"甲胎蛋白\" / \"AFP\" / \"AFP 异质体\"\n3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).\n4. **v0.7 新增** 用 search_lab_results(item_keyword=\"甲胎\" 或 \"AFP\") 拉实际检验, 关注:\n   - rpt_itemname / rpt_itemcode 确认确实做了\n   - **diagnosisOpinion (临床印象)**: 申请医生在检验单上写的诊断/目的, 往往直接说明指征\n     (如\"肝癌随访\"\"恶性肿瘤排转移\"\"淋巴瘤分期\"\"孕期筛查\").\n   若 diagnosisOpinion 含任一合理指征 → CLEAN, evidence 中引 lab 项 + diagnosisOpinion.\n5. 检查 note_diagnosis 中是否含以下指征任一:\n   - 肝癌 / 肝细胞癌 / 原发性肝癌\n   - 肝硬化 / 慢性肝病高危人群\n   - 肝炎 / 病毒性肝炎\n   - 睾丸癌 / 卵黄囊瘤 / 生殖细胞肿瘤\n   - 孕妇 / 妊娠\n   - 产前筛查 / 唐氏筛查 / 神经管缺陷筛查\n   - 肿瘤标志物随访\n   - 肝移植后随访\n   - 胰腺癌 / 胃癌 (部分 AFP 阳性肿瘤随访)\n   - **(扩大) 任何已确诊恶性肿瘤 (含淋巴瘤/胃癌/肠癌/肺癌/乳腺癌)**\
  \ — 排肝转移合理\n   - **(扩大) 继发恶性肿瘤 / 转移性恶性肿瘤** — 排其他器官转移合理\n6. 若有任一指征命中 (诊断或 diagnosisOpinion) → CLEAN.\n7. 若无任一指征命中, 且 count >= 1 → VIOLATION,\n   evidence: 引诊断完整列表 + 该检查项目名 × count + diagnosisOpinion (无指征也要展示证明专家可复核).\n8. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.\n\n注意: 甲状腺癌患者查 AFP 排肝转移属合理指征 → CLEAN.\n注意: 良性肿瘤 / 健康体检 / 无任何肿瘤诊断 + 无 diagnosisOpinion 排转移意图 → VIOLATION.\n\n\U0001F4CC 专家共识触发器 (v0.7, 来自 wangxin/jiweihui/zhoulihong 3 位专家 J61556 批注, 加权 13C/0V/0I):\n\nCLEAN 触发器 (命中任一 → CLEAN 不再判 V):\n- note_diagnosis 含任何恶性肿瘤 (淋巴瘤/胃肠癌/肺癌/乳癌/甲状腺癌/中枢神经系统肿瘤/转移癌/继发肿瘤等任何癌种) + AFP/甲胎蛋白收费 ≤ 2 次\n  → wangxin: \"肿瘤病人查肿瘤标志物属于正常诊疗行为, 不予认定\"\n  → jiweihui: \"疑似肿瘤的, 检查一次不被认定为过度\"\n  → zhoulihong: \"建议包括胸腹腔内器官的恶性肿瘤诊断, 如肺/胃癌等, 用以排查肝转移\"\n- search_lab_results(item_keyword=\"甲胎\"或\"AFP\") diagnosisOpinion 含 \"排查\"/\"随访\"/\"鉴别\"/\"恶性\"\n\n**重要**: 不要纠结 \"癌种跟 AFP 字面关联强弱\" — 中枢神经系统淋巴瘤查 AFP 仍属合理排转移. 这是 wangxin 明确表态.\n\n反例 (仍 V): 完全无肿瘤诊断 + 健康体检 / 反复查 ≥3 次 + 无随访指征.\n"
trigger_keywords:
