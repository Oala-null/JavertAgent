rule_id: RD37
domain: 药品
violation_type: 超医保限定二线用药
question: 申请医保支付的「艾普拉唑肠溶片」，无一线药失败/不耐受证据即作二线使用。
example: ''
status: ready
priority: P1
prompt_addon: |+
  本规则关注: 艾普拉唑肠溶片 (限二线) 是否存在超出适应症 / 医保限定支付范围的用药.
  本规则聚焦单一药品「艾普拉唑肠溶片」.

  ⚠️ on-label 误报闸 (本规则成败关键, 必须遵守):
  命中知识库**不代表违规**. drug_audit_lookup 只做「该药在监管知识库」的确定性字典命中;
  是否违规**取决于患者诊断是否落在依据范围内**:
  - 诊断**在**适应症内 **且** 文书有一线药失败/不耐受证据 → CLEAN; 诊断在适应症内但**无**一线失败证据 → VIOLATION.


  诊断源 (重要): **优先采用 drug_audit_lookup 返回的「患者病案首页诊断 (shi_zd ground truth)」** (含主诊);
  若该工具未返回病案首页诊断, 再用 note_diagnosis 取文书诊断兜底.

  审计步骤:
  1. drug_audit_lookup(patient_id, rule_type="限二线") 取该患者命中本类型的药品 + 各自依据原文 + 病案首页诊断.
     重点确认「艾普拉唑肠溶片」是否在命中列表; 若不在 → 患者没用该药 → CLEAN.
  2. 若命中列表为空 → CLEAN (患者无该类型命中药, 规则不适用, 不必再调其他工具).
  3. 逐条命中药做「诊断 × 依据」比对:
       - 诊断是否在适应症内? 不在 → INCONCLUSIVE (可能系他用, 单病历看不清).
       - 在适应症内: 用 note_diagnosis / search_notes 找「一线药无效 / 不耐受 / 治疗失败 / 既往用过 X 无效」证据. 有 → CLEAN; 无任何线索 → VIOLATION.
       - (注: 文书常无结构化一线用药史, 拿不准时判 INCONCLUSIVE, 不硬判 V.)
  4. **同名异药 / 剂型复核** (防 stem 误命中): 看 drug_audit_lookup 回传的「原始 fee 名」.
     若其剂型 / 给药途径与依据所指药品明显不同 (例: 依据写"口服肠溶胶囊限 IgA 肾病", fee 却是"吸入用混悬液"),
     极可能是同名异药被 stem 匹配误纳 → 判 INCONCLUSIVE, **不判 VIOLATION**.
  5. 诊断为「待查 / 疑似 / 排除」中间状态, 或病案首页 + 文书均无相关诊断 → INCONCLUSIVE.

  ⏱ 收敛: drug_audit_lookup + note_diagnosis (或工具带出的病案首页诊断) 两步通常即可判定 —— 诊断与依据明确相关 → CLEAN, 明确无关 → V. 仅当诊断真模糊时再补 1-2 次 search_notes; **不要为"找不到逐字证据"反复检索**, 临床相关性已足够裁决.

  verdict 输出:
  - VIOLATION: evidence **聚焦最明确的 1-3 条违规药** (不罗列全部命中药), 每条三者对照 —— (a) 命中药通用名 + 原始 fee 名 (b) 相关诊断 (c) 该药依据原文,
    说明「诊断不在依据内」; 其余违规药可在 reasoning 一句话概述.
  - CLEAN: evidence 引用支持性诊断 (诊断落在依据内) 或一线失败证据.
  - INCONCLUSIVE: 诊断缺失 / 中间状态 / 剂型存疑.

trigger_keywords:
  - 艾普拉唑肠溶片
  - 艾普拉唑
suggested_tools:
  - drug_audit_lookup
  - note_diagnosis
  - search_notes
expected_signal: |+
  典型违规: 诊断在适应症内但文书无任何一线药失败/不耐受证据. 典型 CLEAN: 文书有一线失败记录. 典型 INCONCLUSIVE: 文书无一线用药史 (单病历看不清).

notes: 精选药品规则 (M8 限二线); 通用名「艾普拉唑肠溶片」, router 触发词 ['艾普拉唑肠溶片', '艾普拉唑'].
