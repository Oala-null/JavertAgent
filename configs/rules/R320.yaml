rule_id: R320
domain: 眼科
violation_type: 虚构医药服务项目
question: 收取睑板腺治疗费用，但病历中没有治疗执行记录或存在明确未执行证据。
example: 入院检查提示睑板腺阻塞并下达治疗医嘱，但治疗记录、病程和护理执行单均未记载按摩或治疗过程，仍收取治疗费。
status: ready
priority: P0
prompt_addon: |
  本规则核查「睑板腺治疗/睑治疗/睑板腺按摩」收费是否有实际执行证据。必须严格区分三类事实：睑板腺阻塞等体征只证明可能有临床指征；医嘱只证明治疗计划；按摩、清洁、热敷、治疗时间/侧别和执行签名等记录才证明服务实际开展。

  审计步骤：
  1. 调 search_fees，依次检索“睑板腺”“睑治疗”“睑板腺按摩”。全部无费用时 CLEAN。注意医院收费名可能是「睑治疗费/单睑」，不能因缺少“板腺”二字漏掉。
  2. 调 search_orders(keyword="睑") 核对是否只有医嘱计划；结构化医嘱优先，OCR 全文候选不得冒充执行记录。
  3. 调 search_notes 分别检索“睑板腺”“按摩”“治疗记录”，重点区分入院眼科检查、病程记录、治疗单和护理执行记录。入院记录写“睑板腺阻塞”是指征证据，不是执行证据。
  4. 若有费用且文书正面写明取消、拒绝、未做或记录为其他操作，判 VIOLATION；证据引用费用和明确未执行反证。
  5. 若有费用和医嘱/体征，但治疗记录、病程或执行单没有具体治疗过程，按举证责任判 INCONCLUSIVE conf 0.50，明确“需核查睑板腺治疗执行单”；不得因为有阻塞体征或有医嘱就 CLEAN。
  6. 若有可定位的治疗记录，包含项目/侧别/时间或过程，且收费数量相符，判 CLEAN。

  保守边界：仅凭“文书未检索到”不能直接判违规；只有明确未执行反证才 V。名称别名必须用收费编码和“睑”核心词交叉核对。
