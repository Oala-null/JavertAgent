expected_signal: |
  典型待复核：有「睑治疗费/单睑」和睑板腺治疗医嘱，入院记录有阻塞体征，但病程/治疗单无执行过程。
  典型违规：医嘱明确取消或患者拒绝，仍有收费。
  典型合规：治疗单记录按摩侧别、时间和执行人，数量与收费一致。
notes: 专家扩展规则，非 0325 原始条目；体征与医嘱不能替代执行举证。
