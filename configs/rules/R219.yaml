rule_id: R219
domain: 麻醉
violation_type: 过度诊疗
question: 对未使用肌肉松弛药物的全身麻醉患者，开展麻醉中肌松监测并收费。
example: 示例：某省《诊疗目录》规定，麻醉中肌松监测：手术中在肌松监测仪指导下间断或持续给予肌松药，术后拔管时残余肌松药作用监测。某医院对未使用肌松药物的患者，收取“麻醉中肌松监测”费用，属于过度诊疗。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |+
  本规则关注: 患者本次住院里, 是否被无指征收取了「麻醉中肌松监测 (TOF 监测 / 肌松监测)」检查/检验.
  按诊疗规范, 麻醉中肌松监测仅在使用肌松药物时有意义, 用于评估肌松残余 / 拮抗时机. 未用肌松药患者收取该监测属于无适应症加收.

  审计步骤:
  1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  2. 用 search_fees(category="检查类") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.
     检索关键词: "麻醉中肌松监测" / "肌松监测" / "TOF 监测"
  3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).
  4. 检查 note_diagnosis 中是否含以下指征任一:
     - 全身麻醉
     - 气管插管全麻
     - 大手术麻醉 (≥2 小时)
     - 重症患者麻醉
     - 需深度肌松手术 (腹腔镜 / 神经外科 / 骨科)
     
  5. 若有任一指征命中 → CLEAN (有指征).
  6. 若无任一指征命中, 且 count >= 1 且 search_fees(keyword 任一为 "罗库溴铵"/"维库溴铵"/"顺阿曲库铵"/"阿曲库铵"/"琥珀胆碱"/"米库氯铵"/"泮库溴铵") 无命中 → VIOLATION,
     evidence: 引诊断完整列表 + 该检查项目名 × count + 用药列表.
  7. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.
  若诊断含全麻 + 麻醉时长长但 search_fees 未明示肌松药费用, 退 INCONCLUSIVE (可能药品命名不在搜索范围).

  特殊条件: 若 search_fees(keyword 任一为 "罗库溴铵"/"维库溴铵"/"顺阿曲库铵"/"阿曲库铵"/"琥珀胆碱"/"米库氯铵"/"泮库溴铵") 命中, 说明患者实际用了肌松药, 即使诊断未明说也支持开展 麻醉中肌松监测 (TOF 监测 / 肌松监测), 应判 CLEAN.

  特殊注意:
  - 麻醉中肌松监测的判定关键是 "实际用了肌松药", 不是 "诊断有指征". 因此优先用 search_fees 查肌松药费用, 而非 note_diagnosis.

trigger_keywords:
  - 麻醉中肌松监测
  - 肌松监测
  - TOF 监测
  - 罗库溴铵
  - 维库溴铵
  - 顺阿曲库铵
trigger_codes:
  - XM03AC
suggested_tools:
  - note_diagnosis
  - search_fees
expected_signal: |
  典型违规: 患者用药里无肌松药 (search_fees 查 "罗库溴铵" / "维库溴铵" 等全空), 费用列肌松监测.
  典型 CLEAN: 全麻气管插管手术患者用了罗库溴铵, 收肌松监测.
  典型 INCONCLUSIVE: 全麻短小手术, 文书未明示用药细节.
notes: ''
