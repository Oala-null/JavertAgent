rule_id: R079
domain: 血液净化
violation_type: 串换项目
question: 实际开展项目为人工肝治疗，但按照价格更高的血浆置换术进行收费。
example: 示例：某省《诊疗目录》规定，血浆置换术1500元/次，人工肝治疗单价1200元/次。某医院开展人工肝治疗，应收取1200元/次，但是按照血浆置换术进行收取，属于串换收费。
status: ready
priority: P2
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「血浆置换术 (1500 元/次)」实际开展的是「人工肝治疗 (1200 元/次)」, 即项目身份串换.

  按各省《诊疗目录》:
  - "人工肝治疗" (单价 ~1200 元/次): 综合性肝衰竭治疗, 含多种模式 (血浆吸附 / 双重血浆滤过 / 血浆透析滤过 等); 一般用 LSD / DPMAS 模式
  - "血浆置换术" (单价 ~1500 元/次): 单一血浆分离 + 置换新鲜血浆或白蛋白; 用血浆分离器

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "血浆置换术" / "血浆置换"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="病程记录" / "操作记录" / keyword=...) 提取实际操作描述.
  4. 检查文书是否含「血浆置换术」独有特征:
     - "血浆分离器型号"
     - "新鲜血浆 ¥置换 N ml" 或 "白蛋白替换"
     - "PE 治疗" / "Plasma Exchange"
     - 单次置换, 无组合模式
  5. 检查文书操作描述是否吻合「人工肝治疗」(若命中 + 无 Y 独有特征 → V):
     - "人工肝" / "ALSS" / "Artificial Liver Support System"
     - "DPMAS" (双重血浆吸附) / "LSD" (低分子血浆透析滤过)
     - "血浆吸附 + 滤过组合"
     - "胆红素吸附"
  6. 检查排除指征 (命中 → CLEAN):
     - 自身免疫病 / 重症肌无力 / 吉兰巴雷综合征 需血浆置换
     - 中毒急救血浆置换
  7. 文书无操作过程描述 → INCONCLUSIVE.

  特殊注意:
  - 肝衰竭患者文书有 "肝衰竭" / "肝性脑病" / "胆红素 N μmol/L 高" → 强支持是人工肝治疗 (而非单纯血浆置换), 若 fee 收血浆置换 → 强 V.
  - 神经系统疾病 (重症肌无力 / GBS) 患者文书有相应诊断 → 血浆置换合理, CLEAN.

  关键判定逻辑: fee 命中血浆置换 + 文书描述吻合人工肝 (DPMAS/LSD/胆红素吸附) = 强 V.

  注意: 多见于消化内科 / 重症 / 感染科肝衰竭患者; 其他科室命中需特别核查.
trigger_keywords:
  - 血浆置换
  - 血浆置换术
  - 人工肝
  - ALSS
  - DPMAS
  - 胆红素吸附
suggested_tools:
  - search_fees
  - search_notes
  - note_diagnosis
expected_signal: |
  典型违规: 肝衰竭患者 fee 收 "血浆置换术" ¥1500, 操作记录显示是 DPMAS 人工肝治疗.
  典型 CLEAN: 重症肌无力患者血浆置换, 文书无人工肝描述.
  典型 INCONCLUSIVE: 操作记录简略, 仅 "血液净化治疗".
notes: ''
