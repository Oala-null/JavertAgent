rule_id: R015
domain: 心血管内科
violation_type: 虚构医药服务项目
question: 未开展相关诊疗项目，但收取对应诊疗费用。
example: 示例：某医院未对患者开展有创性血流动力学监测（床旁），收取对应诊疗项目费用。
status: ready
priority: P0
prompt_addon: "\U0001F525 v1.6 STEP 0 (修 v1.5 关键词太严):\n**search_fees 必须搜多个别名**, 任一命中即继续 (不要凭一个关键词 0 命中就 CLEAN):\n- \"有创性血流动力学\"  \"动脉测压\"  \"中心静脉压\"  \"漂浮导管\"  \"PiCCO\"  \"Swan-Ganz\"  \"PA\"  \"CVP\"  \"BP 监测\"\n\n若任一命中 + 文书无医嘱单 + 无操作记录 + 病程无对应描述 → **INCONCLUSIVE conf 0.50 + etl_warning** (wangxin: \"未见医嘱单/检查报告单/病程记录无描述\").\n\n唯一 CLEAN 路径: search_fees 全部别名都 0 命中 (规则不适用).\n\n\U0001F6A8 v1.5 INCONCLUSIVE 硬规则 (wangxin 共识 I=5 + jiweihui/zhoulihong V=8 → 加权分歧, 走中位 I):\n- fee 命中 + 主 section 0 命中 + search_examinations 也无对应报告 → **INCONCLUSIVE conf 0.50 + etl_warning**\n- 不要凭 \"找不到 = CLEAN\" — wangxin 明确: \"未见医嘱单/检查报告单/病程记录无相关描述\" 应 I 不是 C 不是 V\n\n本规则关注: 患者本次住院里, 费用中有「有创性血流动力学监测 (床旁)」, 但文书中没有对应的\n执行记录, 即 \"虚构 有创性血流动力学监测 (床旁) 项目骗取医保基金\".\n按医保政策, 有创性血流动力学监测 (床旁) 适用于心源性休克 / 严重心衰 / 大型心血管手术等高危患者, 文书应明确记录导管置入 + 数值监测时间序列. 未实际开展但收取该费用 = 虚构服务.\n\n审计步骤:\n1. 用 search_fees 查 fee 是否命中. 检索关键词: \"有创性血流动力学监测\" / \"床旁血流动力学\" / \"Swan-Ganz\" / \"漂浮导管\" / \"中心静脉压监测\"\n2. 若 fee 无命中 → CLEAN (规则不适用, 患者未被收取该费用).\n3.\
  \ 用 search_notes 检查文书是否有该服务的执行记录:\n   - 重点检查 section: \"重症监护记录\" / \"麻醉记录\" / \"手术记录\"\n   - 执行证据关键词: \"漂浮导管置入\" / \"中心静脉穿刺\" / \"CVP\" / \"PCWP\" / \"心输出量监测\"\n4. 若文书有任一执行证据命中 → CLEAN (服务实际开展).\n4a. 用 note_diagnosis 检查是否有支持该服务开展的诊断:\n   - 心源性休克\n   - 严重心衰\n   - 大型心血管手术\n   - 围术期高危心脏\n   \n   若诊断有支持但文书无执行证据 → INCONCLUSIVE (有指征但记录可能缺失).\n5. 若 fee 有 + 文书无执行证据 + 诊断无支持 → VIOLATION,\n   evidence: 引 fee 项目名 + 价格 + \"在 重症监护记录 等 section 中未检索到 漂浮导管置入 等执行描述\".\n6. 文书 section 不完整 (例如手术记录缺失) / 描述模糊 → INCONCLUSIVE.\n\n特殊条件: 若文书无 重症医学科 科室介入痕迹 (例: 该科记录段为空 / 该科入院记录未生成), 强支持 VIOLATION.\n\n注意: 甲状腺手术患者一般无血流动力学监测指征, 若 fee 命中需特别关注.\n\n\U0001F4CC 专家共识触发器 (v0.7, wangxin/jiweihui/zhoulihong 加权 8V/5I/0C, wangxin I 优先):\n\nINCONCLUSIVE 触发器 (wangxin 标准):\n- fee 命中具体项目 + 文书无医嘱单 + 无检查报告单 + 病程记录无相关描述 → **INCONCLUSIVE conf 0.5 + etl_warning**\n  → wangxin: \"未见医嘱单, 未见检查报告单, 病程记录无相关描述\"\n\nV 触发器 (强证据):\n- 多次反复收费 + 完全无任何手术/检查痕迹 + 无任何相关诊断 → V (jiweihui 标准: \"提供不必要医药服务\")\n\n不要 V 仅基于\"找不到记录\" — wangxin 明确 I 倾向.\n"
trigger_keywords:
- 有创性血流动力学监测
- 床旁血流动力学
- Swan-Ganz
- 中心静脉压
- PCWP
- 心输出量监测
suggested_tools:
- search_fees
- search_notes
- note_diagnosis
expected_signal: '典型违规: 患者未做心导管, 费用列''有创性血流动力学监测'', 重症监护记录无对应数值.

  典型 CLEAN: 心源性休克患者床旁 Swan-Ganz 监测, 重症记录有 CVP/PCWP 数值时间序列.

  典型 INCONCLUSIVE: 心衰患者有指征但重症记录段空.

  '
