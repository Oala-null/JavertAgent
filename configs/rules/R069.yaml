rule_id: R069
domain: 血液净化
violation_type: 重复收费
question: 将血液透析、血液灌流、血液滤过等项目中不能单独收费的一次性耗材进行额外收费。
example: 示例：某省《诊疗目录》规定，血液滤过治疗操作所需的一次性耗材均不可单独收费。某医院对慢性肾功能衰竭患者开展血液滤过治疗，将不能单独收费的一次性管路、废液袋进行收费，属于重复收费。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「血液净化类项目 (血液透析 / 灌流 / 滤过 / CRRT)」项目 + 独立的「不能单独收费的一次性耗材 (透析器 / 滤器 / 管路 / 透析液)」费用.
  按各省《医疗服务诊疗目录》, 血液净化操作所需的一次性耗材均不可单独收费, 单独再收 = 重复收费.

  审计步骤:
  1. 用 search_fees(category="耗材类") 取耗材类全部明细; 关注是否同时存在以下两类:
     A 类 (血液净化): "血液透析" / "血液灌流" / "血液滤过" / "血液透析滤过" / "CRRT" / "连续性肾脏替代治疗"
     B 类 (一次性耗材): "透析器" / "滤器" / "管路" / "透析液" / "抗凝剂" / "一次性血路" / "废液袋"
  2. 若 A 类无命中 → CLEAN (该患者根本没做血液净化, 规则不适用).
  3. 若 A 类有命中且 B 类无命中 → CLEAN (血液净化费用单一, 未重复收一次性耗材费).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="透析记录"/"护理记录"/"医嘱") 没有提到该报告由
     患者自费购买特殊定制耗材 (文书有独立采购记录) → VIOLATION, evidence 引血液净化笔数 + 耗材项目名 + 价格 + 文书无独立采购说明.
  5. 信息明确不足 (例如费用项目命名混合 (如 '血液透析含耗材 ¥530'), 无法分清是套餐还是单收) → INCONCLUSIVE.

  注意: 患者基础诊断必须含需要血液净化的肾功能损害 (note_diagnosis 命中"慢性肾衰"/"急性肾衰"/"尿毒症"/"肾功能不全"/"ESRD"); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - 血液透析
  - 血液灌流
  - 血液滤过
  - CRRT
  - 透析器
  - 滤器
  - 管路
  - 透析液
  - 一次性血路
  - 废液袋
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: "血液透析 ¥350/次 × 10" + "一次性透析器 ¥180 × 10" 同日并存, 医嘱无独立耗材采购说明.
  典型 CLEAN: 仅有血液净化项目单笔; 或患者自费购买的耗材在文书中有独立采购单据.
notes: ''
