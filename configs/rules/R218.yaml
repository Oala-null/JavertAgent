rule_id: R218
domain: 麻醉
violation_type: 过度诊疗
question: 向非全身麻醉状态的患者，收取麻醉深度电生理监测费用。
example: 示例：某省《诊疗目录》规定，麻醉深度电生理监测是在麻醉状态开展。某医院对非全身麻醉状态的患者，收取“麻醉深度电生理监测”费用，属于过度诊疗。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被无指征收取了「麻醉深度电生理监测 (镇静深度监测)」治疗/干预.
  按医保政策, 麻醉深度电生理监测仅适用于全身麻醉患者, 用于监测麻醉深度. 非全麻 (局麻/椎管内麻醉/区域麻醉) 患者收取该费用属过度诊疗.

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中. 检索关键词: "麻醉深度电生理监测" / "麻醉深度监测" / "镇静深度监测"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该治疗).
  3. 用 note_diagnosis 列出全部诊断, 用 search_notes(section="麻醉记录") 查文书证据.
  4. 检查是否含任一指征:
     - 全身麻醉
     - 气管插管全麻
     - 静脉全麻
     - 需深度肌松手术
     
     若有任一指征 → CLEAN (有指征).
  5. 检查是否含任一明确排除指征 (硬证据 V):
     - 局部麻醉 (单独)
     - 椎管内麻醉 (单独)
     - 硬膜外麻醉 (单独)
     - 神经阻滞麻醉 (单独)
     
     若有任一排除指征命中 + treatment 命中 → VIOLATION (强证据, 治疗与诊断硬冲突).
  6. 若指征不命中 + 排除指征也不命中 + treatment 命中 → VIOLATION (无指征过度).
     evidence: 引诊断完整列表 + 该治疗项目名 + 价格.
  7. 文书简略 / 诊断为"待查"/"疑似"等中间状态 → INCONCLUSIVE.

  特殊条件: 用 search_notes 查关键执行证据: "麻醉方式" / "诱导药物" / "维持药物"; 缺失加分判 V.

  特殊注意:
  - 查麻醉记录段判定麻醉方式; 若只见 '椎管内麻醉' / '硬膜外' 等非全麻方式 + 收监测费 → V.

  注意: 甲状腺手术多为全麻, 应 CLEAN (有指征).
trigger_keywords:
  - 麻醉深度电生理监测
  - 麻醉深度监测
  - 镇静深度监测
  - 全身麻醉
  - 局麻
  - 椎管内麻醉
trigger_codes:
  - S330100003
  - S330100005a
  - S330100005b
suggested_tools:
  - search_fees
  - note_diagnosis
  - search_notes
expected_signal: |
  典型违规: 患者只做局麻手术, 费用列麻醉深度监测.
  典型 CLEAN: 全麻气管插管手术患者收监测.
  典型 INCONCLUSIVE: 麻醉方式描述模糊.
notes: ''
