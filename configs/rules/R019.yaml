rule_id: R019
domain: 心血管内科
violation_type: 串换项目
question: 将冠脉介入项目，如冠脉内支架置入术，串换为费用更高的冠脉腔内激光成形术、冠脉内膜旋磨术、定向冠脉内膜旋磨术等收费。
example: 示例：某医院为急性心梗患者置入支架，应收取"经皮冠状动脉内支架置入术(STENT)"（单价：4200元/次）费用，但医院实际按照"高速冠状动脉内膜旋磨术"（单价：5200/次）收取费用，属于串换项目。
status: ready
priority: P2
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「冠脉腔内激光成形 / 冠脉内膜旋磨 / 定向旋磨 (¥5200+/次)」实际开展的是「冠脉支架置入术 (¥4200/次)」, 即项目身份串换.

  按诊疗规范:
  - "经皮冠脉支架置入术 (PCI)": 普通 PCI, 用导丝 + 球囊 + 支架, 不需特殊耗材
  - "冠脉内膜旋磨术": 用旋磨头 (Rotablator), 特殊耗材
  - "高速冠脉内膜旋磨术": 同上, 高速旋磨头
  - "定向冠脉内膜旋磨术 (DCA)": 定向旋切器
  - "冠脉腔内激光成形术": 激光导管 (CVX-300 Excimer Laser)

  审计步骤:
  1. 用 search_fees(keyword=...) 查命中.
     检索关键词: "冠脉内膜旋磨" / "高速旋磨" / "定向旋磨" / "DCA" / "冠脉激光" / "Excimer"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="手术记录" / "导管室记录" / keyword=...) 提取操作描述.
  4. 检查文书是否含「特殊术式」独有特征 (多数命中 → CLEAN):
     - "旋磨头" / "Rotablator" / "旋磨直径 N mm"
     - "高速旋磨" + "转速 N rpm"
     - "定向旋切器" / "DCA 装置"
     - "激光导管" / "Excimer 准分子激光" / "CVX-300"
     - 特殊设备名 + 参数
  5. 检查文书操作描述是否仅吻合「普通 PCI」(若命中 + 无 Y 独有特征 → V):
     - "经皮冠状动脉介入" / "PCI"
     - "支架置入" 但无旋磨 / 激光描述
     - 仅 "导丝 + 球囊扩张 + 支架"
  6. **文书无设备型号 / 操作参数 → INCONCLUSIVE** (建议核实导管室操作日志).

  特殊注意:
  - 关键证据是 "特殊术式设备型号" + "操作参数" (旋磨头 / 激光准分子等).
  - 高度钙化病变 + 旋磨指征 → 旋磨术合理.
  - 文书描述完整 (有设备名) → CLEAN; 仅"PCI 支架" → 强 V (若 fee 收旋磨).

  关键判定逻辑: fee 收特殊术式 + 文书无旋磨/激光设备记录 = V 嫌疑; 文书简略 → INCONCLUSIVE.

  注意: 红色难度 — 依赖手术记录设备描述详细度. 多见于心内介入. 当前 4 工具可部分审 (若文书完整).
trigger_keywords:
  - 冠脉内膜旋磨
  - 高速旋磨
  - 定向旋磨
  - DCA
  - 冠脉激光
  - Rotablator
  - Excimer
  - 冠脉支架
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 急性心梗 fee 收 "高速冠脉内膜旋磨术", 手术记录仅 "支架置入".
  典型 CLEAN: 文书明确 "Rotablator 旋磨头 1.5mm + 转速 180,000 rpm".
  典型 INCONCLUSIVE: 手术记录简略, 无特殊设备描述.
notes: |
  红色难度, 依赖手术记录详细度. 完全 V 需结合导管室操作日志.
