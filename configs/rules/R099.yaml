rule_id: R099
domain: 康复
violation_type: 将不属于医保支付范围的纳入医保基金结算
question: |
  开展精神障碍作业疗法训练，申请医保支付存在下述问题：
  1.不符合医保限定支付适应症；
  2.不符合人员资质限制；
  3.不符合医保限定支付天数及频次。
example: 示例：某省《诊疗目录》中，精神障碍作业疗法训练限支付精神障碍康复期患者，在精神卫生机构或康复医疗机构，由具有资格的精神卫生专业人员或在其指导下的社工操作，且每年支付不超过90天，每天支付不超过一次。某精神病医院对精神分裂症急性期患者（非康复期）开展精神障碍作业疗法训练10日，费用由医保支付，不符合医保限支付精神障碍康复期患者的限制。
status: ready
priority: P2
prompt_addon: |
  本规则关注: 患者本次住院的「精神障碍作业疗法训练」是否符合医保限定支付条件 (适应症 / 资质 / 天数频次).
  按各省诊疗目录, 精神障碍作业疗法训练医保限制:
    1) 适应症: 限精神障碍 **康复期** 患者 (非急性期 / 非发病期)
    2) 资质: 精神卫生机构 / 康复医疗机构 由具资格的精神卫生专业人员或其指导下的社工操作
    3) 天数频次: 每年支付 ≤ 90 天, 每天 ≤ 1 次

  审计步骤:
  1. 用 search_fees(keyword=...) 查命中次数 count.
     检索关键词: "精神障碍作业疗法" / "精神障碍作业疗法训练"
  2. 若 count == 0 → CLEAN (规则不适用).
  3. 用 note_diagnosis 提取诊断, 判断病期:
     A) 急性期 / 发病期硬证据: 诊断含"急性期" / "急性发作" / "首次发病" / "复发期" / "活动期" / "兴奋躁动" / "拒治拒食"
     B) 康复期硬证据: 诊断含"恢复期" / "稳定期" / "缓解期" / "维持期" / "巩固期"
  4. 比对 count 与限定:
     - count > 90 (天) 同年内 → VIOLATION (超天数),
       evidence: 引项目名 × count + 价格合计 + 推算超出 90 天部分.
     - 同一天 count > 1 (每日多于 1 次) → VIOLATION (超频次).
     - A) 急性期诊断命中 + count >= 1 → VIOLATION (适应症不符),
       evidence: 引"急性发作"诊断 + 训练项目费.
     - B) 康复期诊断命中 + count 在限内 → CLEAN.
  5. 资质核查 (人员是否合规) 当前 4 工具不可见, 暂不审, 输出 INCONCLUSIVE 建议线下核实.
  6. 诊断模糊不能判断病期 → INCONCLUSIVE.

  特殊注意:
  - 多维度判定 (适应症 + 资质 + 天数频次), 命中任一维度即 V.
  - 当前主要审 1) 适应症 + 3) 天数频次, 资质需医院级核实.
  - 文书 search_notes(section="入院评估" / keyword="量表") 可辅助判病期 (BPRS / HAMD 等量表分数).
trigger_keywords:
  - 精神障碍作业疗法
  - 精神障碍作业疗法训练
  - 急性发作
  - 康复期
  - 稳定期
suggested_tools:
  - search_fees
  - note_diagnosis
  - search_notes
expected_signal: |
  典型违规: 精神分裂症急性发作期患者 fee 含精神障碍作业疗法 (适应症不符), 或同年 > 90 天.
  典型 CLEAN: 康复期患者训练 ≤ 90 天 / 年.
  典型 INCONCLUSIVE: 诊断无明确病期描述, 或仅能审天数/频次的资质维度.
notes: ''
