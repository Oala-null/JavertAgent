rule_id: R115
domain: 医学影像
violation_type: 重复收费
question: 开展非超声检查项目并收费，重复收取属于超声检查项目类别下的图象记录费用。
example: 示例：某地《诊疗目录》规定：计算机图文报告、彩色胶片报告属于超声检查分类下的图象记录附加收费项目。某医院将磁共振检查出具的报告，按照"计算机图文报告"收取费用，属于重复收费。
status: ready
priority: P1
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否在做非超声检查 (CT/MR/X线 等) 时, 错误收取了属于「超声分类下的图象记录附加费」.
  按诊疗目录, "计算机图文报告 / 彩色胶片报告" 等是超声检查的附加收费项, 非超声项目自带的报告费已包含在主项目内, 不能再收图象记录附加费.

  审计步骤:
  1. 用 search_fees(category="检查类") 取检查类全部明细; 关注是否同时存在以下两类:
     A 类 (非超声主项): "CT" / "MRI" / "MR" / "X线" / "DR" / "CR" / "PET" / 任何非超声影像
     B 类 (超声附加费): "计算机图文报告" / "彩色胶片报告" / "超声图象记录" / "图象记录附加" / "超声胶片"
  2. 若 A 类无命中 → CLEAN (患者只做了超声, 附加费合规).
  3. 若 A 类命中, 且 B 类未命中 → CLEAN (无重复).
  4. 若 A 类与 B 类都命中, 且患者本次住院 search_fees(keyword="超声") 无命中 (即 B 类不是超声本身的附加费) → VIOLATION,
     evidence: 引 A 类非超声主项 + B 类图象记录项目名 + 价格.
  5. 若同次住院既有超声又有 CT/MR, 无法区分附加费归属哪个 → INCONCLUSIVE.

  特殊注意:
  - 重点是 "B 类图象记录 是否对应超声检查存在". 若 B 类附加项目数 > 超声项目数, 多出的部分强支持 V.
trigger_keywords:
  - 计算机图文报告
  - 彩色胶片报告
  - 超声图象记录
  - 图象记录附加
  - CT
  - MR
suggested_tools:
  - search_fees
expected_signal: |
  典型违规: fee 含 MR 检查 + "计算机图文报告" 附加费, 但本次无超声项目.
  典型 CLEAN: fee 仅含超声 + 图象记录附加 (合规); 或非超声项目不带图象记录附加.
  典型 INCONCLUSIVE: 同次既有超声又有 CT/MR, 附加费归属模糊.
notes: ''
derived_from_template: M1
precheck:
  a_items:
    - CT
    - MRI
    - MR
    - X线
    - DR
    - CR
    - PET
  b_items:
    - 计算机图文报告
    - 彩色胶片报告
    - 超声图象记录
    - 图象记录附加
    - 超声胶片
