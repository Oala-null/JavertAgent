rule_id: R129
domain: 医学影像
violation_type: 过度检查
question: 为住院患者开展彩色腹部多普勒超声常规检查时，普遍无指征开展妇科、泌尿系多普勒超声常规检查并收取费用。
example: 示例：某医院骨科，将妇科多普勒超声常规检查、泌尿系多普勒超声常规检查，作为所有女性住院患者入院的常规检查，属于过度检查。
status: ready
priority: P0
prompt_addon: |+
  本规则关注: 患者本次住院里, 是否被无指征收取了「妇科 / 泌尿系多普勒超声 (彩超)」检查/检验.
  按诊疗规范, 妇科彩超 / 泌尿系彩超应有相关脏器或症状指征, 不应作为入院常规.

  审计步骤:
  1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  2. 用 search_fees(category="检查类") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.
     检索关键词: "妇科彩超" / "妇科多普勒超声" / "泌尿系彩超" / "泌尿系多普勒超声"
  3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).
  4. 检查 note_diagnosis 中是否含以下指征任一:
     - 妇科疾病 / 子宫疾病 / 卵巢疾病 / 附件疾病
     - 月经异常 / 阴道流血 / 痛经
     - 不孕 / 妊娠 / 早孕
     - 盆腔包块 / 盆腔积液
     - 宫颈病变 / 子宫肌瘤 / 卵巢囊肿
     - 泌尿系疾病 / 肾疾病 / 输尿管疾病 / 膀胱疾病 / 前列腺疾病
     - 血尿 / 尿频 / 排尿困难
     - 肾结石 / 输尿管结石 / 泌尿系梗阻
     - 肾占位 / 膀胱占位
     - 肾移植后随访
     - 腰腹部肿块待查
     
  5. 若有任一指征命中 → CLEAN (有指征).
  6. 若无任一指征命中, 且 count >= 1 → VIOLATION,
     evidence: 引诊断完整列表 + 该检查项目名 × count.
  7. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.

trigger_keywords:
  - 妇科彩超
  - 妇科多普勒超声
  - 泌尿系彩超
  - 泌尿系多普勒超声
  - 盆腔超声
  - 肾超声
suggested_tools:
  - note_diagnosis
  - search_fees
expected_signal: |
  典型违规: 患者诊断为甲状腺癌, 同时收妇科彩超 + 泌尿系彩超 (无任何相关指征).
  典型 CLEAN: 子宫肌瘤患者妇科彩超随访, 或肾结石患者泌尿系彩超.
  典型 INCONCLUSIVE: 诊断 "腹痛待查" / "盆腔包块待查" 等中间状态.
notes: ''
