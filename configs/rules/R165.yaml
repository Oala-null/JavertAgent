rule_id: R165
domain: 临床检验（组织学检查）
violation_type: 超标准收费
question: 开展全器官大切片检查与诊断、手术标本检查与诊断，未按计价单位收费。
example: '示例1：某省《诊疗目录》中，全器官大切片检查与诊断计费单位为“例”。某医院为患者开展全器官大切片检查与诊断时，“全器官大切片检查与诊断”未按“例”收费，实际按照每个标本分别进行计费，属于超标准收费。

  示例2：某省《诊疗目录》中，手术标本检查与诊断的计价单位为“例”，以两个蜡块为基价，超过两个者，每个加收20元。某院在收取手术标本检查与诊断时，对超出基价部分的标本按全价收费，属于超标准收费。'
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否未按诊疗目录规定的计价标准收取「全器官大切片检查与诊断 / 手术标本检查与诊断」费用.

  📖 诊疗目录条款 (来源: 截至 2026-04-01 全量诊疗项目库):
    项目名: 全器官大切片检查与诊断 / 手术标本检查与诊断
    基础价: ¥330 (全器官大切片) / 190 (小标本) / 310 (中标本) / 470 (大标本) / 例 (一次手术送检 = 一例)
    加成规则: 计价单位为 '例', 同次手术送检的多个组织块/蜡块按 1 例计收, 不按蜡块分别计费.

  ⚠️ 典型违规模式: 按蜡块/组织块分别计费 (1 例手术标本 5 蜡块 = 收 5 次)

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中, 记录出现次数 count + 实收金额合计. 检索关键词: "全器官大切片" / "手术标本检查" / "病理检查"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该项目).
  3. 用 search_notes(section="病理报告") 或 search_notes(keyword=...) 提取实际事件量化值 N.
     量化关键词: "蜡块数" / "组织块" / "送检件" / "病理蜡块" / "送检标本"
  4. 按目录规则计算应收次数 expected:
     1 次手术送检 (无论多少蜡块) = 1 例. 若收 5 次 = V (超 4 例).
  5. 比对 count vs expected:
     - count 显著大于 expected → VIOLATION (超标准多收),
       evidence: 引 fee 项目名 × count + 实际事件 N + 目录单位 "例 (一次手术送检 = 一例)" + 应收 expected + 多收金额.
     - count 等于 expected → CLEAN (按目录正确收).
     - count 小于 expected → CLEAN (未足量收, 不属本规则).
  6. 文书未提供量化信息 (切口数/治疗时长/牙数/血管数/疗程数 等) → INCONCLUSIVE.

  特殊注意:
  - 判定关键: 病理报告/手术记录中'送检' 描述应为 1 例; fee 命中次数 > 送检次数 → V
  - 标本分类 (小/中/大) 不算违规, 是目录内分档

  注意: J66252 应只有 1 次甲状腺癌根治标本送检, 应 CLEAN. 该规则在外科/病理科高命中.
trigger_keywords:
  - 全器官大切片
  - 手术标本检查
  - 病理检查
  - 蜡块
  - 组织块
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 1 例甲状腺癌根治送检, 收手术标本检查 × 5 次 (按蜡块).
  典型 CLEAN: 1 次手术送检 = 1 次费用.
  典型 INCONCLUSIVE: 病理报告未明示蜡块/送检件数.
