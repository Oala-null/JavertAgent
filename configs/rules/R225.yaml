rule_id: R225
domain: 重症医学
violation_type: 过度诊疗或虚构医药服务项目
question: 对不符合康复治疗适应症范围的患者开展康复治疗项目，或未开展康复治疗但收取相应费用。
example: '示例1：某医院在重症监护患者生命体征不稳定的情况下行运动疗法。

  示例2：某医院在重症监护患者生命体征不稳定、经康复科会诊明确不宜开展康复治疗、且未实际开展任何康复治疗的情况下，每日收取日常生活动作训练、运动疗法等费用。'
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被无指征收取了「康复治疗 (早期康复 / ICU 康复 / 床旁康复)」治疗/干预.
  按医保政策, ICU/重症康复治疗应针对可康复的神经/运动功能障碍患者 (脑卒中/脑外伤/脊髓损伤/截瘫等). 短暂术后 ICU 无神经/运动障碍患者收康复属过度诊疗.

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中. 检索关键词: "康复治疗" / "早期康复" / "ICU 康复" / "床旁康复"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该治疗).
  3. 用 note_diagnosis 列出全部诊断, 用 search_notes(section="康复评定记录") 查文书证据.
  4. 检查是否含任一指征:
     - 脑卒中
     - 脑梗
     - 脑出血
     - 脑外伤
     - 脊髓损伤
     - 偏瘫
     - 截瘫
     - 周围神经损伤
     - 长期卧床
     - 制动后
     - 重症监护后综合征
     - ICU 获得性虚弱
     
     若有任一指征 → CLEAN (有指征).
  5. 检查是否含任一明确排除指征 (硬证据 V):
     
     若有任一排除指征命中 + treatment 命中 → VIOLATION (强证据, 治疗与诊断硬冲突).
  6. 若指征不命中 + 排除指征也不命中 + treatment 命中 → VIOLATION (无指征过度).
     evidence: 引诊断完整列表 + 该治疗项目名 + 价格.
  7. 文书简略 / 诊断为"待查"/"疑似"等中间状态 → INCONCLUSIVE.

  特殊条件: 用 search_notes 查关键执行证据: "评定量表" / "Barthel" / "FIM" / "康复计划"; 缺失加分判 V.

  特殊注意:
  - 术后短暂 ICU 无神经/运动障碍 + 收康复治疗多次, 强支持 V.

  注意: 甲状腺手术患者通常无 ICU 康复需求, 命中即关注.
trigger_keywords:
  - 康复治疗
  - 早期康复
  - ICU 康复
  - 床旁康复
  - 脑卒中
  - 脊髓损伤
suggested_tools:
  - search_fees
  - note_diagnosis
  - search_notes
expected_signal: |
  典型违规: 患者只是术后短暂 ICU, 无神经/运动障碍诊断, 收康复治疗.
  典型 CLEAN: 脑梗后偏瘫患者早期康复有评定量表 + 计划.
  典型 INCONCLUSIVE: 康复记录简略.
notes: ''
