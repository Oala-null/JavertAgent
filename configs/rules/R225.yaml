rule_id: R225
domain: 重症医学
violation_type: 过度诊疗或虚构医药服务项目
question: 对不符合康复治疗适应症范围的患者开展康复治疗项目，或未开展康复治疗但收取相应费用。
example: '示例1：某医院在重症监护患者生命体征不稳定的情况下行运动疗法。

  示例2：某医院在重症监护患者生命体征不稳定、经康复科会诊明确不宜开展康复治疗、且未实际开展任何康复治疗的情况下，每日收取日常生活动作训练、运动疗法等费用。

  示例3：某医院对气管插管、昏迷的重症患者，每日按部位并列收取关节松动训练（颈椎、胸椎、腰椎、肩关节、踝关节）共 5 项，连续收取一个月。插管期间颈椎/胸椎被动松动属禁忌操作，且文书无任何康复执行记录。'
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |
  本规则关注: 重症/危重状态患者 (气管插管 / 机械通气 / 昏迷 / 深镇静) 是否被收取了不合理的康复治疗费用.
  按医保政策, ICU/重症康复应针对可康复的神经/运动功能障碍患者, 且以患者实际耐受/可执行为前提.

  三层判定 (逐层独立, 互相不豁免 — 有指征 ≠ 实际可执行 ≠ 已执行):
  ① 禁忌冲突 (最强信号): 气管插管 / 气管切开 / 机械通气期间, 收取「关节松动训练(颈椎)」或「关节松动训练(胸椎)」
     — 插管患者颈椎/胸椎被动松动属禁忌操作, 临床不可能真实执行, 时间窗重叠即 VIOLATION.
  ② 执行能力冲突: 昏迷 / 深镇静 / 病程记录"不配合"的患者, 收取需要主动参与或体位配合的训练类项目
     (运动疗法 / 作业疗法 / 日常生活动作训练 / 关节松动训练), 且文书无具体执行记录 → VIOLATION.
  ③ 套餐堆叠特征 (加分项, 不独立判 V): 同日按部位并列收取 ≥3 项「关节松动训练(XX)」且逐日重复
     → 模板化打包计费特征, 强支持 V.

  审计步骤:
  1. 用 search_fees 锚定危重状态时间窗. 检索关键词: "呼吸机" / "重症监护" / "气管插管" / "气管切开"
     记录这些费用的日期范围 = 危重时间窗.
  2. 用 search_fees 查康复类费用. 检索关键词: "关节松动" / "运动疗法" / "作业疗法" / "日常生活动作训练" / "康复"
     记录每个项目的完整名称 (含部位) / 出现次数 / 日期范围 / 金额合计.
  3. 若康复类费用无命中 → CLEAN (规则不适用).
  4. 比对时间窗: 康复费用日期是否落在危重时间窗内 (费用日期直接比对, 不依赖文书).
  5. 用 note_diagnosis 列诊断, 用 search_notes 查患者状态与执行证据:
     状态关键词: "气管插管" / "昏迷" / "镇静" / "不配合"
     执行证据关键词: "康复评定" / "关节活动度" / "评定量表" / "Barthel" / "康复计划" / "治疗单"
     注意: "不配合" 是反向证据 (无法执行), 不是豁免.
  6. 判定:
     - ①命中 (插管/机械通气窗内收颈椎或胸椎关节松动) → VIOLATION.
       evidence: 引费用行 (项目名+次数+日期范围+金额) + 插管/呼吸机证据 (费用或文书).
     - ②命中 (昏迷/不配合 + 训练类费用 + 无执行记录) → VIOLATION.
     - 康复费用在脱机 / 转出 ICU / 意识恢复之后, 且有评定记录 → CLEAN.
     - 文书不足以确定危重时间窗或患者状态 → INCONCLUSIVE.

  特殊注意:
  - "长期卧床" / "ICU 获得性虚弱" 是康复的可能指征, 但只豁免"是否该做康复"这一问,
    不豁免①禁忌部位 (插管期颈椎/胸椎), 也不豁免②执行证据要求.
  - 被动关节活动对卧床患者的四肢关节确有预防挛缩价值 (肩/肘/髋/膝/踝可有指征),
    但插管期间颈椎/胸椎除外, 且真实执行应有康复科执行记录或治疗单.
  - 气压治疗对卧床患者通常有 DVT 预防指征, 不作为本规则的违规信号.
  - 术后短暂 ICU 无神经/运动障碍 + 收康复治疗多次, 强支持 V.
trigger_keywords:
  - 康复治疗
  - 早期康复
  - ICU 康复
  - 床旁康复
  - 关节松动训练
  - 关节松动
  - 运动疗法
  - 作业疗法
  - 日常生活动作训练
  - 脑卒中
  - 脊髓损伤
suggested_tools:
  - search_fees
  - note_diagnosis
  - search_notes
expected_signal: |
  典型违规: 气管插管/昏迷患者, 危重时间窗内每日按部位堆叠收取关节松动训练 (含颈椎/胸椎), 文书无执行记录.
  典型 CLEAN: 脑梗后偏瘫患者意识清楚, 早期康复有评定量表 + 计划; 或康复费用在脱机转出 ICU 之后.
  典型 INCONCLUSIVE: 文书不足以确定危重时间窗或患者配合状态.
notes: '2026-07-08 细化 (专家案例 211318013): 插管昏迷患者收 5 部位关节松动训练×31天 (含颈椎/胸椎禁忌部位, ¥12k+).
  加危重时间窗比对 (费用×费用, 不依赖文书) + 三层判定 (禁忌/执行/堆叠) + 堵"长期卧床"指征豁免漏洞.'
