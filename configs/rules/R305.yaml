rule_id: R305
domain: 精神医学
violation_type: 重复收费
question: 开展康复治疗，收取身体功能障碍、辅助器具等各种作业疗法训练费用，同时重复收取日常生活动作训练费用。
example: 示例：《某省医疗服务项目价格目录》，作业疗法项目内涵已包含日常生活动作训练（含膀胱功能训练、尿失禁治疗）。某医院精神病科对患者开展康复治疗时，在收取作业疗法训练费用的同时，又额外收取日常生活动作训练费用，属于重复收费。
status: ready
priority: P1
prompt_addon: |
  本规则关注: 患者本次住院 (精神病科康复治疗) 里, 是否同时被收取了「身体功能障碍 / 辅助器具作业疗法训练」+ 独立的「日常生活动作训练」(含膀胱功能 / 尿失禁治疗).
  按各省《医疗服务项目价格目录》, 作业疗法项目内涵已包含日常生活动作训练 (含膀胱功能训练、尿失禁治疗), 单独再收即重复收费.

  审计步骤:
  1. 用 search_fees(keyword=...) 查是否同时存在以下两类:
     A 类 (主项): "身体功能障碍作业疗法" / "辅助器具作业疗法" / "作业疗法训练"
     B 类 (附属, 应被内涵): "日常生活动作训练" / "膀胱功能训练" / "尿失禁治疗" / "ADL 训练"
  2. 若 A 类无命中 → CLEAN.
  3. 若 A 类命中且 B 类无命中 → CLEAN.
  4. 若 A 类与 B 类都命中, 且患者在精神病科 / 康复科住院 → VIOLATION,
     evidence: 引 A 类项目名 + 价格 + B 类项目名 + 价格 + 患者所在科室.
  5. 患者所在科室明确为非康复 / 非精神科 → 规则适用性弱, INCONCLUSIVE.

  特殊注意:
  - 与 R303/R304 区别: R305 强调"精神病科康复治疗"场景下的重复收费, 关注 B 类包含的膀胱功能/尿失禁等特殊子项.
  - 文书 search_notes(keyword="尿失禁治疗" / "膀胱功能训练") 出现 → 强支持 B 类是 ADL 子项.
trigger_keywords:
  - 身体功能障碍作业疗法
  - 辅助器具作业疗法
  - 日常生活动作训练
  - 膀胱功能训练
  - 尿失禁治疗
  - ADL 训练
suggested_tools:
  - search_fees
  - note_diagnosis
expected_signal: |
  典型违规: 精神病科患者 fee 同次含 "身体功能障碍作业疗法" + "尿失禁治疗".
  典型 CLEAN: 仅作业疗法单项; 或仅 ADL 单项.
  典型 INCONCLUSIVE: 患者非精神/康复科, 适用性存疑.
notes: ''
