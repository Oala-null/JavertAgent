expected_signal: |
  典型待复核：床头心电图收费和医嘱均存在，但系统无设备资产数据，输出现场核查清单。
  典型违规：现场证实收费期无设备或设备停用且无外借记录。
  典型合规：机构台账、校准维护和具体使用记录完整。
notes: 专家扩展规则，非0325原始条目；当前无机构设备工具，目标收费存在时固定人工复核。2026-09-06手工补齐预检别名和共享设备核查边界，本次ready修订未跑测试或病例、未经临床验证、未部署。见 docs/expert_ophthalmology_rules.md。
