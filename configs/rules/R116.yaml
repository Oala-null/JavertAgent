rule_id: R116
domain: 医学影像
violation_type: 重复收费
question: 收取超声计算机图文报告同时收取彩色打印照片、彩色胶片照相费用
example: 示例：某省《诊疗目录》规定，超声计算机图文报告项目内涵：“含计算机图文处理、储存及彩色图文报告”。某医院为患者开展超声检查收取超声计算机图文报告同时收取彩色打印照片、彩色胶片照相属于重复收费。
status: ready
priority: P0
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「超声计算机图文报告」项目 + 独立的「彩色打印照片 / 彩色胶片照相」费用.
  按各省《医疗服务诊疗目录》, 超声计算机图文报告项目内涵已含计算机图文处理、储存及彩色图文报告, 单独再收彩色打印照片 / 彩色胶片照相 = 重复收费.

  审计步骤:
  1. 用 search_fees(category="检查类") 取检查类全部明细; 关注是否同时存在以下两类:
     A 类 (图文报告): "超声计算机图文报告" / "超声图文报告" / "彩超图文报告"
     B 类 (打印/胶片): "彩色打印照片" / "彩色胶片照相" / "超声胶片" / "超声照相" / "超声打印"
  2. 若 A 类无命中 → CLEAN (该患者根本没做超声计算机图文报告, 规则不适用).
  3. 若 A 类有命中且 B 类无命中 → CLEAN (图文报告费用单一, 未重复收彩色打印 / 胶片费).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="超声报告"/"辅助检查") 没有提到该报告由
     患者要求额外打印 / 院外读片自费 (文书有独立申请记录) → VIOLATION, evidence 引图文报告笔数 + 打印 / 胶片笔数 + 价格 + 文书无独立申请说明.
  5. 信息明确不足 (例如费用项目命名混合 (如 '超声检查含报告 ¥110'), 无法分清是套餐还是单收) → INCONCLUSIVE.

  注意: 患者基础诊断必须含需要超声检查的临床指征 (note_diagnosis 命中"肿瘤"/"甲状腺"/"腹部"/"妇科"/"心脏"/"血管"); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - 超声计算机图文报告
  - 超声图文报告
  - 彩超图文报告
  - 彩色打印照片
  - 彩色胶片照相
  - 超声胶片
  - 超声照相
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 同次超声检查 "超声计算机图文报告 ¥80" + "彩色打印照片 ¥30" 并存, 超声报告无独立打印申请说明.
  典型 CLEAN: 仅有图文报告单笔; 或文书有患者额外打印 / 院外读片独立申请记录.
notes: ''
derived_from_template: M1
precheck:
  a_items:
    - 超声计算机图文报告
    - 超声图文报告
    - 彩超图文报告
  b_items:
    - 彩色打印照片
    - 彩色胶片照相
    - 超声胶片
    - 超声照相
    - 超声打印
