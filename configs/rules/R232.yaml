rule_id: R232
domain: 重症医学
violation_type: 串换项目
question: 将普通病房床位，串换为层流洁净病房床位进行收费。
example: 示例：医院将普通病房床位，串换为层流洁净病房床位进行收费。
status: ready
priority: P2
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「层流洁净病房床位 / 百级病房」实际入住的是「普通病房 / 普通三级病房」, 即项目身份串换.

  按诊疗规范:
  - "层流洁净病房" (单价较高, 通常 ¥500-1500/天): 百级 / 千级洁净度, 用于造血干细胞移植 / 重症感染免疫缺陷 / 大面积烧伤等需要无菌环境的患者
  - 普通病房 / 三级病房 (单价较低, 通常 ¥30-200/天)

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "层流洁净病房" / "层流床位" / "百级病房" / "无菌病房" / "洁净病房"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="病程记录" / "入院记录" / keyword=...) 提取病房入住情况.
  4. 检查文书是否含「层流洁净病房」独有特征 (多数命中 → CLEAN):
     - "造血干细胞移植" / "骨髓移植"
     - "化疗后骨髓抑制 / 粒缺"
     - "中性粒细胞 < 0.5"
     - "免疫缺陷" / "重度免疫抑制"
     - "大面积烧伤" / "全身皮肤损伤"
     - "无菌病房" / "百级洁净" 直接描述
     - "正压通风" / "HEPA 过滤"
  5. 检查文书入住情况是否仅吻合「普通病房」(若命中 + 无 Y 独有特征 → V):
     - "三级病房" / "标准病房"
     - "三人间" / "四人间" 普通配置
     - 无任何免疫缺陷 / 移植 / 烧伤 描述
  6. 检查患者诊断 note_diagnosis 是否含支持指征:
     - 急性白血病 / 骨髓移植 / 造血干细胞移植
     - 重症感染 + 粒细胞缺乏
     - 大面积烧伤 (≥ 30% TBSA)
     若有 → CLEAN.
  7. 患者诊断不支持层流病房适用 + fee 命中 → V (硬证据),
     evidence: 引层流床位 fee + 价格 + 诊断完整列表 + 文书普通病房描述.

  特殊注意:
  - 关键证据是诊断: 不是血液科 / 移植科 / 烧伤科 / 重症感染 患者用层流床位 = 强 V.
  - 注意 "重症监护病房" (ICU) 不同于"层流洁净病房" — ICU 用 R224 等规则审, 不在本规则范围.

  关键判定逻辑: fee 收层流床位 + 诊断无血液病/移植/烧伤指征 = 强 V.

  注意: 甲状腺 pilot 患者基本不命中. 多见于血液科 / 烧伤科 / 移植科.
trigger_keywords:
  - 层流洁净病房
  - 层流床位
  - 百级病房
  - 无菌病房
  - 造血干细胞移植
  - 粒细胞缺乏
suggested_tools:
  - search_fees
  - search_notes
  - note_diagnosis
expected_signal: |
  典型违规: 甲状腺患者 fee 含 "层流洁净病房", 诊断仅甲状腺癌.
  典型 CLEAN: 急性白血病化疗后粒缺患者层流病房.
  典型 INCONCLUSIVE: 诊断含血液病但文书无粒缺记录.
notes: ''
