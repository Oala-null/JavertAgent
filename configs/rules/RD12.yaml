rule_id: RD12
domain: 药品
violation_type: 超医保限定支付适应症用药
question: 申请医保支付的「果糖注射液」，超出医保限定支付适应症范围。
example: ''
status: abandoned
priority: P1
prompt_addon: |+
  本规则关注: 果糖注射液 (限适应症) 是否存在超出适应症 / 医保限定支付范围的用药.
  本规则聚焦单一药品「果糖注射液」.

  肿瘤药依据优先级已在知识库构建时确定: 有医保限定时只采用医保限定；未提取到医保限定时，采用《新型抗肿瘤药物临床应用指导原则（2025年版）》的「适应证」作为说明书侧兜底。同一产品不会同时进入医保限定与指导原则兜底两条规则；医保目录状态未知时会显式标注待核对，不得把它表述为已确认医保无限定。指导原则是说明书侧参考，不等同于具体厂家的法定药品说明书。

  ⚠️ on-label 误报闸 (本规则成败关键, 必须遵守):
  命中知识库**不代表违规**. drug_audit_lookup 只做「该药在监管知识库」的确定性字典命中;
  是否违规**取决于患者诊断是否落在依据范围内**:
  - 患者诊断**落在**依据 (限定支付 / 说明书) 适应症内, **或属其合理临床外延** → CLEAN; 诊断与依据**完全无关** → VIOLATION; 诊断模糊/缺失 → INCONCLUSIVE.
    (合理外延示例: 甲状腺切除/甲状腺癌 → 甲状腺功能减退替代; 大手术/重症/活动性出血/低白蛋白血症/肝硬化/肿瘤胸腹水 → 人血白蛋白; 恶性肿瘤化疗 → 止吐/升白/升板.
     **不要因病案首页未逐字写出依据病名就判 V** —— 诊断与依据临床相关即视为落在范围内.)


  ⚠️ 示踪剂 / 术中标记类专项 (防假阳性, 命中示踪剂时必读):
  若命中药是**示踪剂** (fee 名或通用名含「示踪」, 或限定原文形如「限…淋巴结…的示踪」, 如示踪用盐酸米托蒽醌), 其医保适应症**绑定手术而非诊断**: 限定所指是「做了对应手术并在术中用于淋巴结示踪」.
  - 患者有对应手术 (甲状腺手术 / 乳腺癌手术) → 开示踪剂即为限定所指的正当示踪用途 → **CLEAN**. **不要**因文书未逐字记录「示踪」「前哨淋巴结」操作、或未见淋巴结活检病理就判 V —— fee 名「示踪用」+ 对应手术存在, 已足以认定 on-label.
  - 仅当患者**既无甲状腺手术也无乳腺手术** (示踪剂用于完全无关场景) 才考虑 VIOLATION.

  ⚠️ 数据盲区 (本项目数据缺口, 判 V 前必须过一遍):
  本项目费用数据**无自付比例明细** (selfpay_prop 等列全空), 病理文书也常缺失. 因此:
  - **自费药排查 (前置硬门, 早于适应症比对)**: 判某药 V 前, 先用 search_notes 查该药有无「自费药品使用同意书」(该药名出现在同意书的自费药品名称里). 命中 → 该药走**自费**、不占用医保基金 → **直接判该药合规, 不再对它做适应症比对** (即使诊断不符也**不得**判该药 V). 若患者**全部**命中药都因自费被剔除 → 整体 **CLEAN**; 尚有未自费的命中药 → 聚焦其余药判定.
  - **病理/自费不确定提醒**: 若判 V 的依据涉及病理亚型区分 (如 B细胞 vs 弥漫大B、鳞癌 vs 腺癌、NSCLC 具体亚型)、分期 / 线数、或无法确认该药是否自费, 则**必须在 reasoning 末尾附一句**「建议复查病理文书及该项目是否自费后再最终定性」. 这是数据受限下的诚实标注, 不改变 verdict 本身, 但让专家知道该 V 需人工补证.

  诊断源 (重要): **优先采用 drug_audit_lookup 返回的「患者病案首页诊断 (shi_zd ground truth)」** (含主诊);
  若该工具未返回病案首页诊断, 再用 note_diagnosis 取文书诊断兜底.

  审计步骤:
  1. drug_audit_lookup(patient_id, rule_type="限适应症") 取该患者命中本类型的药品 + 各自依据原文 + 病案首页诊断.
     重点确认「果糖注射液」是否在命中列表; 若不在 → 患者没用该药 → CLEAN.
  2. 若命中列表为空 → CLEAN (患者无该类型命中药, 规则不适用, 不必再调其他工具).
  3. 逐条命中药, **先过自费门 (a) 再比适应症 (b)**:
     (a) **自费门 (必做)**: `search_notes(keyword="自费")` 查有无「自费药品使用同意书」, 看返回的「自费药品名称：…」里是否含该药名 (**关键词就用「自费」二字, 勿用整句或带空格多词, 否则 miss**). 该药名在自费清单里 → 走自费、不占医保基金, **判该药合规并出局, 不再对它比 (b)**; 否则 → 进 (b).
     (b) 「诊断 × 依据」比对:
       - 患者诊断是否落在该药「限定支付 / 说明书」适应症内? 落在 → CLEAN; 完全不在 → VIOLATION.
  4. **同名异药 / 剂型复核** (防 stem 误命中): 看 drug_audit_lookup 回传的「原始 fee 名」.
     若其剂型 / 给药途径与依据所指药品明显不同 (例: 依据写"口服肠溶胶囊限 IgA 肾病", fee 却是"吸入用混悬液"),
     极可能是同名异药被 stem 匹配误纳 → 判 INCONCLUSIVE, **不判 VIOLATION**.
  5. 诊断为「待查 / 疑似 / 排除」中间状态, 或病案首页 + 文书均无相关诊断 → INCONCLUSIVE.

  ⏱ 收敛: drug_audit_lookup + note_diagnosis (或工具带出的病案首页诊断) 两步通常即可判定 —— 诊断与依据明确相关 → CLEAN, 明确无关 → V. 仅当诊断真模糊时再补 1-2 次 search_notes; **不要为"找不到逐字证据"反复检索**, 临床相关性已足够裁决.

  verdict 输出:
  - VIOLATION: evidence **聚焦最明确的 1-3 条违规药** (不罗列全部命中药), 每条三者对照 —— (a) 命中药通用名 + 原始 fee 名 (b) 相关诊断 (c) 该药依据原文,
    说明「诊断不在依据内」; 其余违规药可在 reasoning 一句话概述.
    **经自费排查确认为自费的药不得进 VIOLATION** (哪怕适应症不符); 若判 V 涉及病理亚型/分期/线数/自费不确定, reasoning 末尾必附「建议复查病理文书及该项目是否自费后再最终定性」.
  - CLEAN: evidence 引用支持性诊断 (诊断落在依据内).
  - INCONCLUSIVE: 诊断缺失 / 中间状态 / 剂型存疑.

  特殊注意:
  - 果糖 stem 会命中甘油果糖/乳果糖等同名异药, 务必按原始 fee 名复核剂型再判.

