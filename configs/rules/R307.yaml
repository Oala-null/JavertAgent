rule_id: R307
domain: 精神医学
violation_type: 串换项目
question: 将实际提供的低价或非医保项目，记录并结算为高价或医保目录内的精神科项目，如将日常查房与平时看护串换为行为观察和治疗收费等。
example: 示例：《全国医疗服务项目技术规范（2023年）》规定，行为观察和治疗需由专业医护人员针对患者具体行为问题，制定评估与干预计划，记录干预措施并评价效果，含暴露治疗、行为矫正治疗等。某医院未按上述内涵开展诊疗，将每日查房、平时看护等常规工作，按照"行为观察和治疗"项目计费，属串换项目违规。
status: ready
priority: P2
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「行为观察和治疗 (精神科医保项目)」实际开展的只是「日常查房 / 平时看护」(常规工作不应收费), 即项目身份串换.

  按诊疗规范, "行为观察和治疗" 项目内涵 (全国医疗服务项目技术规范 2023):
  - 由专业医护人员针对患者具体行为问题
  - 制定评估与干预计划
  - 记录干预措施并评价效果
  - 含暴露治疗 / 行为矫正治疗 等具体技术

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "行为观察和治疗" / "行为观察" / "行为治疗" / "行为矫正"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="病程记录" / "行为评估" / keyword=...) 提取行为治疗证据.
  4. 检查文书是否含「行为观察和治疗」独有特征 (多数命中 → CLEAN):
     - "行为评估量表" (例: NPI / CMAI / 行为问题清单)
     - "行为干预计划" / "评估与干预计划"
     - "具体行为问题: X" + "干预措施: Y" 配对记录
     - "暴露治疗" / "行为矫正治疗" / "代币疗法" / "正强化"
     - "效果评价" / "治疗后行为变化"
  5. 检查文书是否仅吻合「日常查房 / 看护」(若命中 + 无 Y 独有特征 → V):
     - "查房" / "每日查房记录"
     - "看护记录" / "陪护"
     - "情绪稳定" / "无特殊行为" (无具体干预)
     - 无评估量表 / 无干预计划
  6. 检查患者诊断是否需行为治疗:
     - 自闭症 / 阿斯伯格 / 行为障碍
     - 痴呆 + 行为精神症状 (BPSD)
     - 多动症 / 品行障碍 (儿童)
     - 物质使用障碍 + 复发预防行为干预
     若诊断支持 + 文书有干预细节 → CLEAN.
  7. 文书简略 / 仅查房记录 → INCONCLUSIVE (倾向 V).

  特殊注意:
  - 关键证据是 "行为评估量表 + 干预计划" 配对记录. 仅查房 / 看护描述不构成本项目内涵.
  - 多次收费 (¥30-100/次 × N 次) + 仅查房记录 → 强 V.

  关键判定逻辑: fee 收行为观察治疗 + 文书仅查房 / 看护 + 无评估量表 = 串换 V.

  注意: 黄色难度 — 文书结构依赖性强 (需治疗记录详细). 多见于精神病专科医院.
trigger_keywords:
  - 行为观察和治疗
  - 行为观察
  - 行为治疗
  - 行为矫正
  - 行为评估
  - NPI
  - CMAI
suggested_tools:
  - search_fees
  - search_notes
  - note_diagnosis
expected_signal: |
  典型违规: 精神科住院患者 fee 收行为观察治疗多次, 病程仅查房记录.
  典型 CLEAN: 自闭症患儿明确行为评估 + 干预计划 + 效果评价.
  典型 INCONCLUSIVE: 文书简略, 无干预细节.
