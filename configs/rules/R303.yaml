rule_id: R303
domain: 康复
violation_type: 重复收费
question: 开展精神障碍、身体功能障碍、辅助器具等各类作业疗法训练时，同时收取日常生活动作训练费用。
example: 示例：某省《医疗服务项目价格目录》中作业疗法项目内涵包含日常生活动作训练。某医院同时收取两项费用。
status: ready
priority: P1
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「作业疗法训练 (精神障碍 / 身体功能障碍 / 辅助器具等)」+ 独立的「日常生活动作训练」.
  按各省《医疗服务项目价格目录》, 作业疗法项目内涵已包含日常生活动作训练, 单独再收即重复收费.

  审计步骤:
  1. 用 search_fees(category="检查类") 或 search_fees(keyword=...) 查是否同时存在以下两类:
     A 类 (作业疗法主项): "作业疗法" / "作业疗法训练" / "精神障碍作业疗法" / "身体功能障碍作业疗法" / "辅助器具作业疗法"
     B 类 (附属, 应被内涵): "日常生活动作训练" / "ADL 训练" / "日常生活活动训练"
  2. 若 A 类无命中 → CLEAN (规则不适用).
  3. 若 A 类命中且 B 类无命中 → CLEAN (单收主项, 未重复).
  4. 若 A 类与 B 类都命中 → VIOLATION (硬证据, 内涵冲突),
     evidence: 引 A 类项目名 + 价格 + B 类项目名 + 价格 + 同次住院发生.
  5. 仅 B 类 (日常生活动作训练) 单独命中, 无 A 类 → CLEAN (单收 ADL, 不构成本规则; 可能受 R304 / R305 其他规则关注).

  特殊注意:
  - A/B 都命中时, 即使分别在不同事件时间收费, 也属于本规则违规 (同一住院期间内涵重复).
  - 文书 search_notes(keyword="作业疗法") 出现, 但 fee 只有 B 类 → CLEAN (训练实际开展, 命名问题).
trigger_keywords:
  - 作业疗法
  - 作业疗法训练
  - 精神障碍作业疗法
  - 日常生活动作训练
  - ADL 训练
suggested_tools:
  - search_fees
  - note_diagnosis
expected_signal: |
  典型违规: 同次住院 fee 同时含 "作业疗法训练" + "日常生活动作训练".
  典型 CLEAN: 仅作业疗法或仅 ADL 单项收费.
  典型 INCONCLUSIVE: 项目名歧义 (例 "综合训练" 无法判断归属哪类).
notes: ''
derived_from_template: M1
precheck:
  a_items:
    - 作业疗法
    - 作业疗法训练
    - 精神障碍作业疗法
    - 身体功能障碍作业疗法
    - 辅助器具作业疗法
  b_items:
    - 日常生活动作训练
    - ADL 训练
    - 日常生活活动训练
