rule_id: R193
domain: 肿瘤
violation_type: 超标准收费
question: 开展体表肿物切除术等手术，未按照同一切口、不同切口手术计价标准收费。
example: 示例：某省《诊疗目录》规定，同一手术项目中两个以上切口，在原项目价格基础上加收20%。某医院开展体表肿物切除术，未严格执行上述计价标准，而是按照肿物个数计费，属于超标准收费。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否未按诊疗目录规定的计价标准收取「浅表肿物切除术 / 头皮肿物切除术 / 体表良性肿物切除术」费用.

  📖 诊疗目录条款 (来源: 截至 2026-04-01 全量诊疗项目库):
    项目名: 浅表肿物切除术 / 头皮肿物切除术 / 体表良性肿物切除术
    基础价: ¥580 (浅表) / 200-260 (头皮) / 次
    加成规则: 同一切口多个肿物按 1 次计收; 同一手术项目中两个以上切口, 在原项目价格基础上加收 20%.

  ⚠️ 典型违规模式: 按肿物个数分别计费 (1 切口 3 肿物 = 收 3 次)

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中, 记录出现次数 count + 实收金额合计. 检索关键词: "浅表肿物切除" / "头皮肿物切除" / "体表肿物切除" / "皮下肿物切除"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该项目).
  3. 用 search_notes(section="手术记录") 或 search_notes(keyword=...) 提取实际事件量化值 N.
     量化关键词: "肿物个数" / "肿物数量" / "切口数" / "同一切口" / "皮下肿物"
  4. 按目录规则计算应收次数 expected:
     1 切口多肿物 = 1 次; 不同切口 N 个肿物 = 1 + (N-1) × 20%. 若按肿物个数 N 全价 → 超.
  5. 比对 count vs expected:
     - count 显著大于 expected → VIOLATION (超标准多收),
       evidence: 引 fee 项目名 × count + 实际事件 N + 目录单位 "次" + 应收 expected + 多收金额.
     - count 等于 expected → CLEAN (按目录正确收).
     - count 小于 expected → CLEAN (未足量收, 不属本规则).
  6. 文书未提供量化信息 (切口数/治疗时长/牙数/血管数/疗程数 等) → INCONCLUSIVE.

  特殊注意:
  - 判定关键: 手术记录'切口数'描述; 1 切口 3 肿物 = 1 次, 不能按 3 次
  - fee 命中次数 = 肿物数 + 文书无'不同切口'描述, 强支持 V

  注意: J66252 是甲状腺癌根治, 非体表肿物, fee 不会命中 → CLEAN.
