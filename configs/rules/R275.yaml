rule_id: R275
domain: 内分泌
violation_type: 串换项目
question: 将葡萄糖测定、床旁血糖仪检测串换为电脑血糖监测收费。
example: 示例：某省《诊疗目录》中，电脑血糖监测12元/试验项目、葡萄糖测量床旁血糖仪检测（含末梢采血）8.5元/次。某医院实际使用床旁简易血糖仪开展血糖测量，应收取"葡萄糖测量床旁血糖仪检测（含末梢采血）"费用，但收取"电脑血糖监测"费用，属于串换项目。
status: ready
priority: P2
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「电脑血糖监测 (¥12/次)」实际开展的是「床旁血糖仪检测 / 葡萄糖测定 (¥8.5/次)」, 即项目身份串换.

  按诊疗规范:
  - "电脑血糖监测" / "动态血糖监测 (CGM)": 用皮下传感器持续监测 24h-7d, 设备如 FreeStyle Libre / Dexcom / 雅培瞬感; 自动绘制血糖曲线
  - "床旁血糖仪检测" / "葡萄糖测定 (POCT)": 末梢血手指血糖测试, 用便携式血糖仪 (强生 / 罗氏 等), 单次结果

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "电脑血糖监测" / "动态血糖监测" / "CGM" / "持续血糖监测"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="病程记录" / "护理记录" / keyword=...) 提取血糖监测描述.
  4. 检查文书是否含「电脑血糖监测」独有特征 (多数命中 → CLEAN):
     - "动态血糖" / "持续血糖监测"
     - "CGM 传感器" / "皮下植入" / "佩戴 N 天"
     - "FreeStyle" / "Libre" / "Dexcom" / "瞬感"
     - "血糖曲线" / "AGP 报告"
     - "目标范围内时间 (TIR)"
  5. 检查文书监测描述是否仅吻合「床旁血糖仪」(若命中 + 无 Y 独有特征 → V):
     - "末梢血血糖" / "指尖血糖"
     - "POCT 血糖"
     - "三餐前后血糖" + 单次值
     - "雅培稳豪" / "强生稳豪" / 普通血糖仪型号
     - 无传感器 / 无持续监测
  6. 文书无血糖监测描述 → INCONCLUSIVE.

  特殊注意:
  - 关键证据是 "传感器" + "佩戴时长": 动态血糖必带传感器 + 数天连续记录.
  - 即使糖尿病患者也可能误开 CGM 收费 (实际只测了末梢血糖), 重点查方式而非诊断.

  关键判定逻辑: fee 收电脑血糖监测 + 护理记录仅末梢血糖单次 = 串换 V.

  注意: 多见于内分泌 / 糖尿病科 / 普内科住院患者.
trigger_keywords:
  - 电脑血糖监测
  - 动态血糖监测
  - CGM
  - 床旁血糖仪
  - 末梢血糖
  - 葡萄糖测定
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 糖尿病患者 fee 收 "电脑血糖监测" 多次, 护理记录仅"指尖血糖三餐前后".
  典型 CLEAN: 文书明确 "佩戴 FreeStyle Libre 14 天 + AGP 报告".
  典型 INCONCLUSIVE: 护理记录无血糖监测细节.
notes: ''
