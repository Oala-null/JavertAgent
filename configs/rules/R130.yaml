rule_id: R130
domain: 医学影像
violation_type: 过度检查
question: 为住院患者，普遍无指征开展血管彩色多普勒超声检查并收取费用。
example: 示例：某医院外科，将颈部血管彩色多普勒超声、四肢血管彩色多普勒超声、四肢多普勒血流图检查作为所有入院患者的常规检查，属于过度检查。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |+
  本规则关注: 患者本次住院里, 是否被无指征收取了「血管彩色多普勒超声 (颈动脉 / 下肢血管 / 动脉 / 静脉彩超)」检查/检验.
  按诊疗规范, 血管彩超应有血管疾病或相关症状指征, 不应作为入院常规打包.

  审计步骤:
  1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  2. 用 search_fees(category="检查类") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.
     检索关键词: "血管彩超" / "颈动脉彩超" / "下肢血管彩超" / "动脉彩超" / "静脉彩超"
  3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).
  4. 检查 note_diagnosis 中是否含以下指征任一:
     - 动脉硬化 / 动脉狭窄 / 动脉斑块
     - 血栓形成 / 深静脉血栓 / DVT
     - 栓塞 / 肺栓塞 / 动脉栓塞
     - 下肢缺血 / 间歇性跛行
     - 血管炎 / 多发性大动脉炎
     - 静脉曲张 / 慢性静脉功能不全
     - TIA / 短暂性脑缺血发作 / 脑梗 / 脑梗死
     - 颈动脉斑块 / 颈动脉狭窄
     - 心房颤动 (评估栓塞风险)
     - 术前血管评估 (大手术 / 血管手术)
     
  5. 若有任一指征命中 → CLEAN (有指征).
  6. 若无任一指征命中, 且 count >= 1 → VIOLATION,
     evidence: 引诊断完整列表 + 该检查项目名 × count.
  7. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.

  特殊注意:
  - 颈动脉 + 下肢动脉 + 下肢静脉 三项打包是核心违规模式, 应分别核对各项指征.

trigger_keywords:
  - 血管彩超
  - 颈动脉彩超
  - 下肢血管彩超
  - 动脉彩超
  - 静脉彩超
  - 深静脉血栓
  - 动脉硬化
suggested_tools:
  - note_diagnosis
  - search_fees
expected_signal: |
  典型违规: 患者无血管相关诊断, 收颈动脉 + 下肢动脉 + 下肢静脉彩超打包.
  典型 CLEAN: TIA 患者颈动脉彩超评估, 或 DVT 患者下肢静脉彩超.
  典型 INCONCLUSIVE: 诊断 "下肢肿胀待查" 等中间状态.
notes: ''
