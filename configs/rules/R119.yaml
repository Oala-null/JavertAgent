rule_id: R119
domain: 医学影像
violation_type: 重复收费
question: 开展临床操作的CT引导，收取引导费用时，重复收取X线计算机体层(CT)扫描、X线计算机体层(CT)平扫、X线计算机体层(CT)增强扫描、X线计算机体层(CT)成象等检查费用。
example: 示例：各类影像引导是临床医师在开展治疗、手术时，为动态观察操作过程、精准定位相关病灶而实施的辅助操作，而各类影像检查是为诊断疾病通过一定方式显示人体器官组织的形态状况等图像的检查方式，开展引导不应收取检查、图文报告、胶片等费用。某医院开展CT引导下肺部肿瘤消融术，在收取“临床操作的CT引导”费用同时，另收取“X线计算机体层(CT)扫描”“胶片”等费用，其中“X线计算机体层(CT)扫描”“胶片”属于重复收费。
status: ready
priority: P0
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「临床操作的 CT 引导」项目 + 独立的「X 线计算机体层 (CT) 扫描 / 平扫 / 增强 / 成象」费用.
  按各省《医疗服务诊疗目录》, CT 引导是治疗 / 手术过程的辅助操作, CT 引导费已含术中扫描, 单独再收 CT 扫描 / 平扫 / 增强 / 胶片 = 重复收费.

  审计步骤:
  1. 用 search_fees(category="检查类") 取检查类全部明细; 关注是否同时存在以下两类:
     A 类 (CT 引导): "CT 引导" / "X 线计算机体层引导" / "CT 引导穿刺" / "CT 引导消融" / "临床操作的 CT 引导"
     B 类 (CT 检查): "CT 扫描" / "CT 平扫" / "CT 增强" / "CT 成象" / "X 线计算机体层扫描" / "X 线计算机体层平扫" / "X 线计算机体层增强扫描" / "胶片"
  2. 若 A 类无命中 → CLEAN (该患者根本没做CT 引导, 规则不适用).
  3. 若 A 类有命中且 B 类无命中 → CLEAN (CT 引导费用单一, 未重复收CT 检查费).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="手术记录"/"操作记录"/"影像报告") 没有提到该报告由
     术前评估独立时间窗的扫描 (有独立报告与时间戳) → VIOLATION, evidence 引引导笔数 + 扫描 / 胶片笔数 + 价格 + 操作记录时间戳.
  5. 信息明确不足 (例如费用项目命名只写 'CT 操作 ¥1000', 无法判断属于引导还是检查) → INCONCLUSIVE.

  注意: 患者基础诊断必须含需要 CT 引导操作的临床指征 (note_diagnosis 命中"肿瘤"/"占位"/"肺结节"/"肝癌"/"穿刺活检"); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - CT 引导
  - X 线计算机体层引导
  - CT 引导穿刺
  - CT 引导消融
  - CT 扫描
  - CT 平扫
  - CT 增强
  - 胶片
