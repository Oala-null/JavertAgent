rule_id: R155
domain: 临床检验
violation_type: 过度检查
question: 将各种白介素测定、干扰素测定、肿瘤坏死因素测定等作为入院患者的常规检查，对大量无相关疾病指征的患者开展检验并收费。
example: 示例：各种白介素测定、干扰素测定、肿瘤坏死因素测定一般用于感染、炎症、肿瘤的诊断。某医院对没有上述疾病指征的患者，以套餐检查的方式，大量开展各种白介素测定、干扰素测定、肿瘤坏死因子等检查。
status: ready
priority: P1
handling_level: 可疑（警告）
prompt_addon: |+
  本规则关注: 患者本次住院里, 是否被无指征收取了「细胞因子谱 (白介素 IL-6/IL-2, 干扰素, 肿瘤坏死因子 TNF)」检查/检验.
  按诊疗规范, 细胞因子谱用于风湿免疫病 / 严重感染 / 噬血细胞综合征评估, 不应作为普通入院常规打包.

  审计步骤:
  1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  2. 用 search_fees(category="检查类") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.
     检索关键词: "白介素" / "IL-6" / "干扰素测定" / "肿瘤坏死因子" / "TNF" / "细胞因子"
  3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).
  4. 检查 note_diagnosis 中是否含以下指征任一:
     - 类风湿关节炎 / 红斑狼疮 / 强直性脊柱炎
     - 自身免疫病 / 风湿病
     - 严重感染 / 脓毒症 / 重症肺炎
     - 噬血细胞综合征 / 巨噬细胞活化综合征
     - 不明原因发热 / FUO
     - 免疫缺陷病
     - 重症 COVID / 细胞因子风暴
     
  5. 若有任一指征命中 → CLEAN (有指征).
  6. 【判「无指征」前 MUST 执行】用 scan_progress_indications(patient_id, symptom_kw_list=["胸闷", "气短", "喘", "憋", "胸痛", "下肢水肿", "发热", "咳嗽", "心悸"]) 扫病程/查房 section 族的症状指征.
     - 若命中**阳性**症状 (无 [否认段]/[选项框] 标注) → CLEAN (病程记录有指征, 不只看诊断).
     - 仅当诊断无指征 **且** 病程症状 0 阳性命中时, 才可继续向 VIOLATION 推进.
  7. 若无任一诊断指征命中 且病程症状 0 阳性命中, 且 count >= 1 → VIOLATION,
     evidence: 引诊断完整列表 + 该检查项目名 × count.
  8. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.

  特殊注意:
  - 打包开展 (IL-6 + IL-2 + 干扰素 + TNF 四项一起) 是核心违规模式; 单项 IL-6 在脓毒症监测仍可 CLEAN.

trigger_keywords:
  - 白介素
  - IL-6
  - IL-2
  - 干扰素测定
  - TNF
  - 肿瘤坏死因子
  - 细胞因子谱
  - 风湿免疫
suggested_tools:
  - note_diagnosis
  - search_fees
expected_signal: |
  典型违规: 患者诊断为甲状腺结节, 收 IL-6 + TNF + 干扰素打包.
  典型 CLEAN: 红斑狼疮活动期患者监测 IL-6, 或脓毒症患者 IL-6 评估炎症.
  典型 INCONCLUSIVE: 诊断 "发热待查" / "风湿待排" 等中间状态.
notes: ''
