rule_id: R047
domain: 骨科
violation_type: 重复收费
question: 开展关节镜下半月板修整术、韧带重建术、骨折复位固定术、滑膜切除术等，重复收取关节镜加收费用。
example: 示例：某省《诊疗目录》规定，手术项目名称中已明确运用某种腔镜的，不得另行收取该腔镜使用费。某医院为严重膝关节退行性病变患者行关节镜下关节滑膜切除术，每例收取“关节镜下关节滑膜切除术”和“关节镜加收”费用，其中，“关节镜加收”属于重复收费。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「关节镜下手术类项目 (半月板修整 / 韧带重建 / 骨折复位 / 滑膜切除 / 游离体取出)」项目 + 独立的「关节镜加收 / 关节镜使用费」费用.
  按各省《医疗服务诊疗目录》, 项目名称中已明确运用某种腔镜的, 不得另行收取该腔镜使用费; 关节镜下手术已含关节镜加收, 单独再收 = 重复收费.

  审计步骤:
  1. 用 search_fees(category="手术类") 取手术类全部明细; 关注是否同时存在以下两类:
     A 类 (关节镜下手术): "关节镜下半月板修整术" / "关节镜下韧带重建术" / "关节镜下骨折复位固定术" / "关节镜下滑膜切除术" / "关节镜下游离体取出"
     B 类 (关节镜加收): "关节镜加收" / "关节镜使用费" / "关节镜辅助费"
  2. 若 A 类无命中 → CLEAN (该患者根本没做关节镜下手术, 规则不适用).
  3. 若 A 类有命中且 B 类无命中 → CLEAN (关节镜下手术费用单一, 未重复收关节镜加收费).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="手术记录"/"诊疗经过") 没有提到该报告由
     双侧关节镜 / 多关节腔分别开展 (手术记录有独立切口与时间记录) → VIOLATION, evidence 引关节镜下手术笔数 + 关节镜加收笔数 + 价格 + 手术记录单 / 双侧描述.
  5. 信息明确不足 (例如费用项目只写 '膝关节手术 ¥4500', 无法判断是否走关节镜) → INCONCLUSIVE.

  注意: 患者基础诊断必须含关节内损伤 / 退行性病变 (note_diagnosis 命中"半月板损伤"/"韧带损伤"/"滑膜炎"/"关节内骨折"/"关节退变"/"游离体"); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - 关节镜下半月板修整
  - 关节镜下韧带重建
  - 关节镜下骨折复位
  - 关节镜下滑膜切除
  - 关节镜下游离体取出
  - 关节镜加收
  - 关节镜使用费
  - 关节镜辅助费
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 同次手术 "关节镜下半月板修整术 ¥4500" + "关节镜加收 ¥1200" 并存, 手术记录单侧关节单次操作.
  典型 CLEAN: 仅有关节镜下手术单笔; 或手术记录明确双侧 / 多关节腔分别开展独立计费.
notes: ''
