rule_id: R312
domain: 精神医学
violation_type: 过度诊疗
question: 开展脑反射治疗时，超出脑波治疗仪说明书规定的适应症范围（仅限失眠及强迫症状），为精神分裂症、抑郁症、焦虑症等非适用病症患者进行治疗，并收取相应费用。
example: 示例：某医院脑波治疗仪的适用范围为失眠及强迫症状的患者进行辅助治疗，医院使用该仪器为其他如精神分裂症、抑郁症、强迫症、焦虑症等患者使用并收取“脑反射治疗”费用。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |+
  本规则关注: 患者本次住院里, 是否被无指征收取了「脑反射治疗 (脑波治疗仪)」治疗/干预.
  按医保政策, 脑反射治疗 (脑波治疗仪) 说明书仅适用于失眠 + 强迫症状. 用于精神分裂症 / 抑郁症 / 焦虑症等说明书外适应症 = 过度诊疗.

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中. 检索关键词: "脑反射治疗" / "脑波治疗" / "脑波治疗仪"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该治疗).
  3. 用 note_diagnosis 列出全部诊断.
  4. 检查是否含任一指征:
     - 失眠
     - 入睡困难
     - 早醒
     - 睡眠障碍
     - 强迫症
     - 强迫思维
     - 强迫行为
     
     若有任一指征 → CLEAN (有指征).
  5. 检查是否含任一明确排除指征 (硬证据 V):
     - 精神分裂症 (非失眠)
     - 抑郁症 (单纯, 非失眠)
     - 焦虑症 (单纯, 非失眠)
     - 其他精神疾病 (非失眠/强迫)
     
     若有任一排除指征命中 + treatment 命中 → VIOLATION (强证据, 治疗与诊断硬冲突).
  6. 若指征不命中 + 排除指征也不命中 + treatment 命中 → VIOLATION (无指征过度).
     evidence: 引诊断完整列表 + 该治疗项目名 + 价格.
  7. 文书简略 / 诊断为"待查"/"疑似"等中间状态 → INCONCLUSIVE.

  特殊注意:
  - 脑反射治疗严格按说明书; 即使精神病患者合并失眠, 应明确以失眠/强迫为主诉.

trigger_keywords:
  - 脑反射治疗
  - 脑波治疗
  - 脑波治疗仪
  - 失眠
  - 强迫症
  - 精神分裂症
  - 抑郁症
suggested_tools:
  - search_fees
  - note_diagnosis
expected_signal: |
  典型违规: 患者诊断为精神分裂症 / 抑郁症 / 焦虑症 (无失眠), 收脑反射治疗.
  典型 CLEAN: 失眠或强迫症患者治疗.
  典型 INCONCLUSIVE: 患者主诉模糊, 兼有失眠.
notes: ''
