rule_id: R040
domain: 骨科
violation_type: 串换项目
question: 各类骨折切开复位内固定术间相互串换收费。
example: 示例：某医院为四肢骨折患者开展内外踝骨折切开复位内固定手术，应当收取"内外踝骨折切开复位内固定术"费用（单价：2200元），实际收取"三踝骨折切开复位内固定术"费用（单价：3100元），属于串换项目。
status: ready
priority: P2
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「高价骨折切开复位内固定术」实际开展的是「低价同类术式」, 即骨折术式之间串换.

  典型例子: 内外踝骨折 (¥2200) 串换为三踝骨折 (¥3100), 单髁骨折 vs 双髁骨折, 简单 vs 粉碎性骨折.

  按诊疗规范, 骨折术式按部位 + 复杂度计价:
  - "内外踝骨折切开复位内固定术" (¥2200): 内踝 + 外踝 2 处骨折
  - "三踝骨折切开复位内固定术" (¥3100): 内踝 + 外踝 + 后踝 3 处骨折

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "切开复位内固定" / "骨折内固定" / "三踝" / "双髁" / "粉碎性"
  2. 若 fee 无命中 → CLEAN.
  3. 用 note_diagnosis 提取骨折诊断, 注意计数:
     - 骨折部位数 (内踝 + 外踝 = 2, 加后踝 = 3)
     - 骨折严重度 (简单 / 粉碎 / 移位)
  4. 用 search_notes(section="手术记录" / "影像报告" / keyword=...) 提取手术经过.
     提取关键: 切开部位 + 内固定耗材 + 涉及关节面
  5. 比对 fee 项目名声明的骨折复杂度 vs 文书 + 诊断实际:
     - 文书记录与 fee 一致 (例: fee "三踝" + 文书三踝骨折切开复位) → CLEAN
     - 文书与 fee 不符 (例: fee "三踝" + 诊断仅"内外踝" 2 处骨折) → V
     - 文书简略, 仅 "切开复位内固定术" 无骨折部位数描述 → INCONCLUSIVE
  6. 用影像报告核对: 若 CT/X 线报告明确骨折部位数 vs fee 不符 → 硬 V.

  特殊注意:
  - 关键证据是 "诊断中骨折部位数" + "影像报告 / 手术记录中切开部位". 4 工具可审, 但需手术记录详细.
  - 注意手术记录术式名 (如"L Approach 三踝骨折内固定") 与诊断一致性.

  关键判定逻辑: fee 收高复杂度术式 + 诊断/影像/文书部位数不符 = V.

  注意: 红色难度. 4 工具能审但依赖文书详细度. 多见于骨科.
trigger_keywords:
  - 内外踝骨折
  - 三踝骨折
  - 切开复位内固定
  - 双髁骨折
  - 单髁骨折
  - 粉碎性骨折
suggested_tools:
  - search_fees
  - search_notes
  - note_diagnosis
expected_signal: |
  典型违规: 诊断"内外踝骨折"(2 处), fee 收"三踝骨折切开复位内固定术".
  典型 CLEAN: 诊断"三踝骨折" + 手术记录三处切开内固定.
  典型 INCONCLUSIVE: 手术记录仅"行骨折切开复位内固定".
notes: |
  红色难度, 依赖手术记录详细度. 部分能审 (诊断+影像比对).
