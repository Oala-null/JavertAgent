rule_id: R291
domain: 精神医学
violation_type: 超标准收费
question: 开展精神科监护，未严格按照诊疗规范及项目内涵规定的适用对象、监护内容、病区环境、人员资质等要求提供服务，仍按该项目标准收费。
example: '《全国诊疗服务项目目录规范（2023版）》规定，精神科监护项目内涵为:由经过训练的专业人员对入住精神科或者精神专科医疗机构的患者，存在急性、冲动、自杀、伤人、毁物及有外走、妄想、幻觉和木僵的患者实施监护。《精神治疗类医疗服务价格项目立项指南（试行）》进一步明确，该项目服务产出为“为处于重性精神病急性发作期的患者提供严密监护服务”。

  示例1：某医院对常规住院患者（非急性期且未伴发上述精神行为症状）收取精神科监护费。

  示例2：某医院将对精神病患的常规住院看护按照精神科监护计费，且存在自制评估表内容与项目内涵不符、监护人员资质不达标、监护记录与病程记录不一致等问题。

  示例3：某省《诊疗目录》规定，精神科监护限精神病专科医院封闭管理病区开展，监护内容涵盖生命体征、精神状况、认知、情感、意向行为等，并需详细记录。某医院在开放病房对自闭症门诊患者收取精神科监护费，且无相关监护记录。'
status: ready
priority: P0
handling_level: 违规（阻断）
prompt_addon: "本规则关注: 患者本次住院里, 是否未按诊疗目录规定的计价标准收取「精神科监护」费用.\n\n\U0001F4D6 诊疗目录条款 (来源: 截至 2026-04-01 全量诊疗项目库):\n  项目名: 精神科监护\n  基础价: ¥2 / 小时\n  加成规则: 项目内涵: 由经过训练的专业人员对入住精神科或精神专科医疗机构的患者, 存在急性、冲动、自杀、伤人、毁物及有外走、妄想、幻觉和木僵的患者实施监护. 不可与精神病人护理同时收取.\n\n⚠️ 典型违规模式: 慢性稳定期患者长期收 / 文书无监护班次记录 / 与'精神病人护理'同时收\n\n审计步骤:\n1. 用 search_fees(keyword=...) 查 fee 是否命中, 记录出现次数 count + 实收金额合计. 检索关键词: \"精神科监护\"\n2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该项目).\n3. 用 search_notes(section=\"精神状况评估\") 或 search_notes(keyword=...) 提取实际事件量化值 N.\n   量化关键词: \"急性发作\" / \"自伤\" / \"自杀\" / \"木僵\" / \"拒食拒治\" / \"兴奋躁动\" / \"稳定期\" / \"康复期\"\n4. 按目录规则计算应收次数 expected:\n   判定核心 (4 维度): 1) 适用对象 — 急性发作期; 2) 监护内容 — 文书有班次记录; 3) 病区环境 — 封闭式监护病区; 4) 人员资质 — 专业训练. 当前 4 工具仅能审 1) (诊断指征); 2-4 需医院级确认, 退 INCONCLUSIVE.\n5. 比对 count vs expected:\n   - count 显著大于 expected → VIOLATION (超标准多收),\n     evidence: 引 fee 项目名 × count + 实际事件 N + 目录单位 \"小时\" + 应收 expected + 多收金额.\n   - count 等于 expected → CLEAN (按目录正确收).\n   - count 小于 expected → CLEAN (未足量收, 不属本规则).\n6. 文书未提供量化信息\
  \ (切口数/治疗时长/牙数/血管数/疗程数 等) → INCONCLUSIVE.\n\n特殊注意:\n- 判定 1: 诊断含急性发作/自伤/木僵指征 + fee 命中 → 看其他维度\n- 判定 2: 诊断为'稳定期'/'康复期' + fee 命中 → V (硬证据)\n- 判定 3: 若 fee 同期有'精神病人护理' + '精神科监护' → 强支持 V (不可同收)\n- 病区环境/人员资质 4 工具不可见, 输出 INCONCLUSIVE 建议线下核实\n\n注意: J66252 非精神科, fee 不命中 → CLEAN. 该规则核心 (病区环境/人员资质) 需医院级核实.\n\n\U0001F4CC 专家共识触发器 (v0.7, wangxin 加权 5C/0V/0I):\n\nCLEAN 触发器:\n- search_fees 无精神科监护类项目 (封闭式精神病专科病区监护/精神科特殊监护) → **CLEAN**\n  → wangxin: \"无精神科监护的收费\"\n- 若该规则在该患者不适用 (fee 无精神监护项目) → CLEAN\n\n反例 (V): 普通病房收\"封闭式精神病专科病区监护费\" + 医院 hospital_config 标注无该科室.\n"
