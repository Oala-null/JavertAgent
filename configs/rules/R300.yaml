rule_id: R300
domain: 精神医学
violation_type: 重复收费
question: 开展精神科监护，重复收取抗精神病药物治疗监测费用
example: 示例：《全国医疗服务项目技术规范（2012年版）》规定，精神科监护监护并记录的内容包括药物不良反应等药物治疗相关监测。某医院收取“精神科监护”费用时，同时收取“抗精神病药物治疗监测”费用，属于重复收费。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「精神科监护」项目 + 独立的「抗精神病药物治疗监测」费用.
  按《全国医疗服务项目技术规范 (2012 年版)》, 精神科监护内容已包括药物不良反应等药物治疗相关监测, 单独再收抗精神病药物治疗监测费 = 重复收费.

  审计步骤:
  1. 用 search_fees(category="其他类") 取其他类全部明细; 关注是否同时存在以下两类:
     A 类 (精神监护): "精神科监护" / "精神科特级护理" / "精神科一级监护"
     B 类 (药物监测): "抗精神病药物治疗监测" / "药物治疗监测" / "精神药物监测"
  2. 若 A 类无命中 → CLEAN (该患者根本没做精神科监护, 规则不适用).
  3. 若 A 类有命中且 B 类无命中 → CLEAN (精神监护费用单一, 未重复收药物治疗监测费).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="护理记录"/"病程记录"/"药学服务") 没有提到该报告由
     特殊药物血药浓度检测 (例如氯氮平血药浓度) 有独立检验申请单 → VIOLATION, evidence 引精神监护笔数 + 药物监测笔数 + 价格 + 文书是否有血药浓度独立检验单.
  5. 信息明确不足 (例如费用项目笼统写 '精神科治疗 ¥150', 未细分监护与药物监测) → INCONCLUSIVE.

  注意: 患者基础诊断必须含重性精神疾病 (note_diagnosis 命中"精神分裂症"/"抑郁症"/"双相情感障碍"/"重性精神疾病"/"躁狂"); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - 精神科监护
  - 精神科特级护理
  - 抗精神病药物治疗监测
  - 药物治疗监测
  - 精神药物监测
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 同住院 "精神科监护 ¥150/天" + "抗精神病药物治疗监测 ¥30/次" 并存, 病程记录无独立血药浓度检验单.
  典型 CLEAN: 仅有精神监护单笔; 或药学服务记录中有氯氮平等特殊药物血药浓度独立申请单据.
