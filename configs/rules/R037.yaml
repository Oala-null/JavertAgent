rule_id: R037
domain: 骨科
violation_type: 虚构医药服务项目
question: 未开展相关诊疗项目，但收取对应诊疗费用。
example: 示例：某医院患者未骨折，医院未针对骨折进行治疗，患者住院的主手术为椎管扩大减压术，但收取了胸腰椎骨折切开复位内固定术费用。
status: ready
priority: P0
prompt_addon: "本规则关注: 患者本次住院里, 费用中有「胸腰椎骨折切开复位内固定术」, 但文书中没有对应的\n执行记录, 即 \"虚构 胸腰椎骨折切开复位内固定术 项目骗取医保基金\".\n按医保政策, 胸腰椎骨折切开复位内固定术适用于胸椎/腰椎骨折/椎体压缩骨折等具体损伤, 文书手术记录必须明确手术入路 + 内固定型号 + 出血量等关键描述. 主手术非该术但费用列该术 = 虚构.\n\n【裁决基准 (举证责任, M5 虚构类通则 — 优先于下列步骤)】\n- 治疗/手术类收费项目存在 = 医院已就该操作向基金收费, 举证\"该操作确实开展\"的责任在收费方。\n- 文书找不到该操作的执行证据时, 默认下限为 INCONCLUSIVE (证据缺失待人工核查);\n  MUST NOT 因\"文书未提及 / 未检索到执行描述\"就判 CLEAN。\n- 仅当文书**正面反证**该操作确实执行 (操作记录 / 治疗单 / 麻醉记录 / 执行记载, 含操作名+时间+过程)\n  → CLEAN。\n- 若文书正面显示该操作实际**未执行** (记录为其它操作 / 明确未做 / 诊断无支持且执行痕迹全缺)\n  → VIOLATION。\n- 名称警示: 收费项目名与文书术式名常不一致 (如「肘关节截骨术」↔「尺骨截骨术」),\n  MUST NOT 仅因名称不同就断言\"未收费\"或\"未执行\"; 用解剖部位与操作类别交叉核对。\n\n审计步骤:\n1. 用 search_fees 查 fee 是否命中. 检索关键词: \"胸腰椎骨折切开复位\" / \"胸腰椎内固定术\" / \"椎弓根钉\" / \"椎体复位\"\n2. 若 fee 无命中 → CLEAN (规则不适用, 患者未被收取该费用).\n3. 用 search_notes 检查文书是否有该服务的执行记录:\n   - 重点检查 section: \"手术记录\"\n   - 执行证据关键词: \"手术切口\" / \"内固定植入\" / \"椎弓根钉\" / \"椎体复位\" / \"出血量\"\n4. 若文书有任一执行证据命中 → CLEAN (服务实际开展).\n4a. 用 note_diagnosis 检查是否有支持该服务开展的诊断:\n   - 胸椎骨折\n   - 腰椎骨折\n   - 椎体压缩骨折\n   - 椎管狭窄继发外伤\n   \n   若诊断有支持但文书无执行证据 → INCONCLUSIVE (有指征但记录可能缺失).\n5. 若 fee 有 + 文书无执行证据 + 诊断无支持 → VIOLATION,\n   evidence: 引 fee 项目名 + 价格 + \"在 手术记录 等 section 中未检索到 手术切口 等执行描述\".\n6. 文书 section 不完整 (例如手术记录缺失) / 描述模糊 → INCONCLUSIVE.\n\n特殊注意:\n- 若同次住院主手术是其他手术 (如椎管扩大减压术) 但费用列内固定术, 强支持 VIOLATION.\n\n注意: 甲状腺患者无骨折手术指征, 命中即 V (除非确实并发外伤).\n"
