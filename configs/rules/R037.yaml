rule_id: R037
domain: 骨科
violation_type: 虚构医药服务项目
question: 未开展相关诊疗项目，但收取对应诊疗费用。
example: 示例：某医院患者未骨折，医院未针对骨折进行治疗，患者住院的主手术为椎管扩大减压术，但收取了胸腰椎骨折切开复位内固定术费用。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 费用中有「胸腰椎骨折切开复位内固定术」, 但文书中没有对应的
  执行记录, 即 "虚构 胸腰椎骨折切开复位内固定术 项目骗取医保基金".
  按医保政策, 胸腰椎骨折切开复位内固定术适用于胸椎/腰椎骨折/椎体压缩骨折等具体损伤, 文书手术记录必须明确手术入路 + 内固定型号 + 出血量等关键描述. 主手术非该术但费用列该术 = 虚构.

  审计步骤:
  1. 用 search_fees 查 fee 是否命中. 检索关键词: "胸腰椎骨折切开复位" / "胸腰椎内固定术" / "椎弓根钉" / "椎体复位"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未被收取该费用).
  3. 用 search_notes 检查文书是否有该服务的执行记录:
     - 重点检查 section: "手术记录"
     - 执行证据关键词: "手术切口" / "内固定植入" / "椎弓根钉" / "椎体复位" / "出血量"
  4. 若文书有任一执行证据命中 → CLEAN (服务实际开展).
  4a. 用 note_diagnosis 检查是否有支持该服务开展的诊断:
     - 胸椎骨折
     - 腰椎骨折
     - 椎体压缩骨折
     - 椎管狭窄继发外伤
     
     若诊断有支持但文书无执行证据 → INCONCLUSIVE (有指征但记录可能缺失).
  5. 若 fee 有 + 文书无执行证据 + 诊断无支持 → VIOLATION,
     evidence: 引 fee 项目名 + 价格 + "在 手术记录 等 section 中未检索到 手术切口 等执行描述".
  6. 文书 section 不完整 (例如手术记录缺失) / 描述模糊 → INCONCLUSIVE.

  特殊注意:
  - 若同次住院主手术是其他手术 (如椎管扩大减压术) 但费用列内固定术, 强支持 VIOLATION.

  注意: 甲状腺患者无骨折手术指征, 命中即 V (除非确实并发外伤).
trigger_keywords:
  - 胸腰椎骨折切开复位内固定术
  - 椎弓根钉
  - 胸椎骨折
  - 腰椎骨折
  - 椎体压缩骨折
suggested_tools:
  - search_fees
  - search_notes
  - note_diagnosis
expected_signal: |
  典型违规: 患者主手术椎管扩大减压, 费用列胸腰椎骨折切开复位内固定术, 诊断无骨折.
  典型 CLEAN: 胸椎骨折患者手术记录详述椎弓根钉植入 + 复位过程.
  典型 INCONCLUSIVE: 手术记录简略未述内固定细节.
notes: ''
