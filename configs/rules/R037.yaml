expected_signal: "典型违规: 患者主手术椎管扩大减压, 费用列胸腰椎骨折切开复位内固定术, 诊断无骨折.\n典型 CLEAN: 胸椎骨折患者手术记录详述椎弓根钉植入 + 复位过程.\n典型 INCONCLUSIVE: 手术记录简略未述内固定细节.\n"
