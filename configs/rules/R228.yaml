rule_id: R228
domain: 重症医学
violation_type: 重复收费
question: 医院开展重症监护等并对应收费，重复收取口腔护理、皮肤护理、会阴护理、肛周护理、心理护理、动静脉置管护理等费用。
example: 示例：某省《诊疗目录》规定，重症项目项目含以下内容：做好监护记录、基础护理及专项护理等。某医院ICU开展重症监护项目并收费，同时收取“口腔护理”“皮肤护理”“会阴护理”“肛周护理”等费用，其中，“口腔护理”“皮肤护理”“会阴护理”“肛周护理”等为重复收费。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「重症监护」项目 + 独立的「基础护理 (口腔/皮肤/会阴/肛周/心理/动静脉置管护理)」费用.
  按各省《医疗服务诊疗目录》, 重症监护项目本身已含监护记录、基础护理及专项护理, 单独再收口腔/皮肤/会阴/肛周/心理/动静脉置管护理费 = 重复收费.

  审计步骤:
  1. 用 search_fees(category="其他类") 取其他类全部明细; 关注是否同时存在以下两类:
     A 类 (重症监护): "重症监护" / "综合 ICU 监护" / "ICU 监护" / "重症医学科监护" / "重症加强护理"
     B 类 (基础护理): "口腔护理" / "皮肤护理" / "会阴护理" / "肛周护理" / "心理护理" / "动静脉置管护理"
  2. 若 A 类无命中 → CLEAN (该患者根本没做重症监护, 规则不适用).
  3. 若 A 类有命中且 B 类无命中 → CLEAN (重症监护费用单一, 未重复收基础护理费).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="护理记录"/"ICU 日志"/"重症医学记录") 没有提到该报告由
     操作前消毒 / 创口换药 / 隔离期间独立护理 (非常规基础护理) → VIOLATION, evidence 引重症监护笔数 + 多笔基础护理项目名 + 价格 + 同日日期.
  5. 信息明确不足 (例如护理记录笼统只写 '常规护理', 无法确认基础护理项目执行频次) → INCONCLUSIVE.

  注意: 患者基础诊断必须含ICU 入科 / 重症诊断 (note_diagnosis 命中"重症"/"ICU"/"呼吸衰竭"/"多器官"/"脓毒症"); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - 重症监护
  - ICU 监护
  - 口腔护理
  - 皮肤护理
  - 会阴护理
  - 肛周护理
  - 心理护理
  - 动静脉置管护理
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 同日存在 "重症监护 ¥300" + "口腔护理 ¥15" + "皮肤护理 ¥15" + "会阴护理 ¥15" 多笔, 护理记录中只写常规护理.
  典型 CLEAN: 仅有重症监护单笔; 或护理记录明确指出某护理为感染隔离 / 创口换药独立操作.
notes: ''
