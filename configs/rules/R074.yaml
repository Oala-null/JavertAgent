rule_id: R074
domain: 血液净化
violation_type: 超标准收费
question: 按次收费的血液净化类诊疗项目（如血液透析、血液灌流、血液滤过、血液透析滤过、血透监测等），按治疗时长进行收费。
example: 示例：某省《诊疗目录》中，血液透析滤过单价600元，计价单位为次。某医院对慢性肾功能衰竭患者进行血液透析滤过治疗，治疗时长4小时，应收取1次“血液透析滤过”费用600元。但医院以小时为单位收取4次“血液透析滤过”费用共2400元，属于超标准收费。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否未按诊疗目录规定的计价标准收取「血液净化类 (血液透析 / 血液灌流 / 血液滤过 / 血液透析滤过 / 血透监测)」费用.

  📖 诊疗目录条款 (来源: 截至 2026-04-01 全量诊疗项目库):
    项目名: 血液净化类 (血液透析 / 血液灌流 / 血液滤过 / 血液透析滤过 / 血透监测)
    基础价: ¥399 (透析 / 滤过) / 599 (透析滤过) / 550 (灌流) / 次
    加成规则: 诊疗目录计价单位为 '次', 每次完整治疗按 1 次计收, 不论治疗时长 2-4 小时.

  ⚠️ 典型违规模式: 按治疗时长拆分 (4 小时透析 = 收 4 次 ¥1596 而非 1 次 ¥399)

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中, 记录出现次数 count + 实收金额合计. 检索关键词: "血液透析" / "血液灌流" / "血液滤过" / "血液透析滤过" / "血透监测"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该项目).
  3. 用 search_notes(section="治疗记录") 或 search_notes(keyword=...) 提取实际事件量化值 N.
     量化关键词: "治疗时长" / "透析时长" / "灌流时长" / "小时" / "持续时间" / "治疗起止时间"
  4. 按目录规则计算应收次数 expected:
     1 次治疗 (无论 2-4 小时) = 收 1 次. 若文书显示 1 次完整治疗 4 小时, 收 4 次 = V (超收 3 次).
  5. 比对 count vs expected:
     - count 显著大于 expected → VIOLATION (超标准多收),
       evidence: 引 fee 项目名 × count + 实际事件 N + 目录单位 "次" + 应收 expected + 多收金额.
     - count 等于 expected → CLEAN (按目录正确收).
     - count 小于 expected → CLEAN (未足量收, 不属本规则).
  6. 文书未提供量化信息 (切口数/治疗时长/牙数/血管数/疗程数 等) → INCONCLUSIVE.

  特殊注意:
  - 判定关键: search_fees 同一项目命中次数 vs 文书治疗次数; 命中次数 ≈ 治疗小时数 → 强支持 V
  - 排除场景: 慢性肾衰患者每周 3 次透析, 一周内 3 次 fee 命中正常 (不是同一次拆分)

  注意: 甲状腺患者无血液净化指征, J66252 应 CLEAN (fee 无命中). 该规则在慢性肾衰/肾内科患者高命中.
