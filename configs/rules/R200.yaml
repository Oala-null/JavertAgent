rule_id: R200
domain: 肿瘤
violation_type: 超标准收费
question: 开展简易定位、专用X线机模拟定位、专用X线机复杂模拟定位等，未按照计价单位收费。
example: 示例：某省《诊疗目录》规定，“简易定位”“专用X线机模拟定位”“专用X线机复杂模拟定位”计价单位均为“疗程”。某医院对患者开展上述定位项目时，未按“疗程”计价，收费次数大于实际疗程数，多收部分属于超标准收费。
status: ready
priority: P0
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否未按诊疗目录规定的计价标准收取「简易定位 / 专用 X 线机模拟定位 / 专用 X 线机复杂模拟定位 (放疗定位)」费用.

  📖 诊疗目录条款 (来源: 截至 2026-04-01 全量诊疗项目库):
    项目名: 简易定位 / 专用 X 线机模拟定位 / 专用 X 线机复杂模拟定位 (放疗定位)
    基础价: ¥45 (简易) / 135 (模拟) / 320 (复杂模拟) / 疗程
    加成规则: 计价单位为 '疗程', 一个疗程内多次定位都按 1 个疗程计收.

  ⚠️ 典型违规模式: 按次计费 (1 疗程 10 次定位 = 收 10 次)

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中, 记录出现次数 count + 实收金额合计. 检索关键词: "简易定位" / "专用X线机模拟定位" / "复杂模拟定位" / "放疗定位"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该项目).
  3. 用 search_notes(section="放疗记录") 或 search_notes(keyword=...) 提取实际事件量化值 N.
     量化关键词: "疗程" / "放疗周期" / "定位次数" / "放疗计划"
  4. 按目录规则计算应收次数 expected:
     1 疗程 (含多次定位) = 1 次费用. 若收费次数 > 疗程数 → V.
  5. 比对 count vs expected:
     - count 显著大于 expected → VIOLATION (超标准多收),
       evidence: 引 fee 项目名 × count + 实际事件 N + 目录单位 "疗程" + 应收 expected + 多收金额.
     - count 等于 expected → CLEAN (按目录正确收).
     - count 小于 expected → CLEAN (未足量收, 不属本规则).
  6. 文书未提供量化信息 (切口数/治疗时长/牙数/血管数/疗程数 等) → INCONCLUSIVE.

  特殊注意:
  - 判定关键: 放疗记录中'疗程'描述; fee 命中次数 ≈ 定位次数则违规, 应 = 疗程数
  - 新疗程 (患者第 2 个治疗周期) 可以再收 1 次, 不算违规

  注意: J66252 是手术根治, 无放疗指征, fee 不会命中 → CLEAN. 该规则在肿瘤放疗科高命中.
trigger_keywords:
  - 简易定位
  - 专用X线机模拟定位
  - 复杂模拟定位
  - 放疗定位
  - 疗程
suggested_tools:
  - search_fees
  - search_notes
  - note_diagnosis
expected_signal: |
  典型违规: 1 疗程患者收简易定位 × 10 次 (应 1 次).
  典型 CLEAN: 每个疗程 1 次定位费.
  典型 INCONCLUSIVE: 放疗记录未明示疗程数.
notes: ''
