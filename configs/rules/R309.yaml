rule_id: R309
domain: 精神医学
violation_type: 串换项目
question: 将常规查房过程，串换为心理治疗项目收费。
example: 示例：《全国医疗服务项目技术规范（2023年）》规定，心理治疗需在适宜的治疗空间，由经过训练的专业人员，对来访者或患者依据心理治疗原理，选择相应的心理治疗方法，进行一对一的规范化的系统治疗。某医院开展的"心理治疗"通过查房的形式开展，没有在特定环境实施，不符合项目内涵规定，属于串换项目收费。
status: ready
priority: P2
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「心理治疗」实际开展的只是「常规查房」(无适宜治疗空间 / 无规范化系统治疗), 即项目身份串换.

  按诊疗规范, "心理治疗" 项目内涵 (全国医疗服务项目技术规范 2023):
  - 在适宜的治疗空间 (心理治疗室 / 咨询室, 非病房)
  - 由经过训练的专业人员 (心理治疗师 / 心理咨询师)
  - 对来访者或患者依据心理治疗原理
  - 选择相应的心理治疗方法
  - 进行一对一的规范化的系统治疗

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "心理治疗" / "心理咨询"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="心理治疗记录" / "病程记录" / "查房记录" / keyword=...) 提取治疗形式描述.
  4. 检查文书是否含「合规心理治疗」独有特征 (多数命中 → CLEAN):
     - 治疗地点 = 心理治疗室 / 咨询室 (非病房)
     - 治疗师签名 + 工号
     - 一对一治疗 (非查房同组多患者)
     - 心理治疗方法 (CBT / 精神分析 / 人本主义 等)
     - 治疗时长 50 分钟左右
     - 系统治疗 (多次连续, 治疗目标 / 计划)
  5. 检查文书是否仅吻合「常规查房」(若命中 + 无 Y 独有特征 → V):
     - 治疗地点 = 病房床边
     - 查房集体形式 (主任医师查房 + 住院医师 + 多患者)
     - "今日查房" 标准格式
     - 无心理治疗师参与, 仅精神科医师查房
     - 治疗时长 ≤ 10 分钟
  6. 检查 R308 类似规则: 若同时收 "心理治疗" + "查房" 但仅有查房记录 → 与 R309 重合 → V.
  7. 文书简略 → INCONCLUSIVE.

  特殊注意:
  - 关键证据是 "治疗地点 + 治疗师 + 1 对 1 + 50 分钟". 查房形式四个条件都不满足.
  - 查房中夹带"心理疏导" 不构成心理治疗内涵.

  关键判定逻辑: fee 收心理治疗 + 病程仅查房 + 治疗地点= 病房 = 强 V.

  注意: 黄色难度. 多见于精神病专科住院, 注意区分 "心理治疗" 和 "心理疏导" (后者不应单独收费).
trigger_keywords:
  - 心理治疗
  - 心理咨询
  - 心理疏导
  - 查房
  - 心理治疗师
  - 治疗室
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: fee 收心理治疗多次, 病程仅 "今日查房, 给予心理疏导".
  典型 CLEAN: 文书有心理治疗室 + 治疗师签名 + 1 对 1 + 50 分钟 CBT 治疗.
  典型 INCONCLUSIVE: 文书无治疗地点 / 治疗师信息.
