rule_id: R045
domain: 骨科
violation_type: 重复收费
question: 开展肩锁关节脱位切开复位内固定术，重复收取韧带重建术费用。
example: 示例：某省《诊疗目录》规定，肩锁关节脱位切开复位内固定术项目内涵：含韧带重建术。某医院为肩锁关节脱位患者行肩锁关节脱位切开复位内固定术，收取“肩锁关节脱位切开复位内固定术”“韧带重建术”费用。其中，“韧带重建术”属于重复收费。
status: ready
priority: P0
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「肩锁关节脱位切开复位内固定术」项目 + 独立的「韧带重建术」费用.
  按各省《医疗服务诊疗目录》, 肩锁关节脱位切开复位内固定术项目内涵已包含韧带重建术, 单独再收韧带重建术费 = 重复收费.

  审计步骤:
  1. 用 search_fees(category="手术类") 取手术类全部明细; 关注是否同时存在以下两类:
     A 类 (主项手术): "肩锁关节脱位切开复位内固定术" / "肩锁关节切开复位内固定" / "肩锁关节脱位切开复位术"
     B 类 (附属手术): "韧带重建术" / "肩锁韧带重建" / "喙锁韧带重建术"
  2. 若 A 类无命中 → CLEAN (该患者根本没做肩锁关节脱位切开复位, 规则不适用).
  3. 若 A 类有命中且 B 类无命中 → CLEAN (主项手术费用单一, 未重复收韧带重建费).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="手术记录"/"诊疗经过") 没有提到该报告由
     韧带重建为独立手术指征单独实施 (而非内固定术内涵) → VIOLATION, evidence 引两笔手术费用项目名 + 价格 + 手术记录原文.
  5. 信息明确不足 (例如手术类只 1 项, 名字模糊无法判断是 A 还是 B) → INCONCLUSIVE.

  注意: 患者基础诊断必须含肩锁关节脱位 (note_diagnosis 命中"肩锁关节脱位"/"韧带损伤"); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - 肩锁关节脱位
  - 切开复位内固定术
  - 韧带重建术
  - 肩锁韧带
  - 喙锁韧带
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 同次住院里同时存在 "肩锁关节脱位切开复位内固定术" 与 "韧带重建术" 两笔手术费用项, 且手术记录中未将韧带重建作为独立手术叙述.
  典型 CLEAN: 仅有内固定术费用; 或手术记录明确将韧带重建作为额外独立指征单独施行.
notes: ''
derived_from_template: M1
precheck:
  a_items:
    - 肩锁关节脱位切开复位内固定术
    - 肩锁关节切开复位内固定
    - 肩锁关节脱位切开复位术
  b_items:
    - 韧带重建术
    - 肩锁韧带重建
    - 喙锁韧带重建术
