rule_id: R024
domain: 心血管内科
violation_type: 串换项目
question: 使用血压计、监护仪监测血压，按照动态血压监测进行收费。
example: 示例：某医院医护人员为住院患者开展体温、测血压等生命体征监测，属于常规的护理操作，不应额外收费，但医院按照"动态血压监测"（单价：6元/小时）收取费用，属于重复收费。
status: ready
priority: P2
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「动态血压监测 (¥6/小时)」实际开展的只是「血压计 / 监护仪日常血压监测」(护理常规, 不应额外收费), 即项目身份串换.

  按诊疗规范:
  - "动态血压监测 (ABPM)": 用专用 24h 动态血压记录仪 (Mobil-O-Graph / Spacelabs / Suntech), 24h 内每 15-30 分钟自动测量, 出 24h 血压曲线
  - 血压计 / 监护仪日常测血压: 护理常规, 每班次 1-3 次, 不应单独按小时计费

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "动态血压监测" / "ABPM" / "24 小时血压" / "动态血压"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="病程记录" / "护理记录" / keyword=...) 提取血压监测描述.
  4. 检查文书是否含「动态血压监测」独有特征 (多数命中 → CLEAN):
     - "24h 动态血压" / "Mobil-O-Graph" / "Spacelabs"
     - "佩戴 24 小时" / "ABPM 记录仪"
     - "动态血压报告" / "白昼/夜间平均血压"
     - "杓型 / 非杓型血压"
  5. 检查文书监测描述是否仅吻合「常规血压」(若命中 + 无 Y 独有特征 → V):
     - "BP N/N mmHg" + 三餐前后零散记录
     - "护理常规" / "生命体征监测"
     - "心电监护仪持续监测" 但无 ABPM 描述
  6. 检查患者诊断是否需 ABPM:
     - 高血压病 (尤其新诊断 / 难治性 / 怀疑白大衣高血压)
     - 体位性低血压评估
     - 自主神经功能评估
     - 嗜铬细胞瘤评估
     若有 → CLEAN.
  7. 文书无血压监测细节 → INCONCLUSIVE.

  特殊注意:
  - 关键证据是 "ABPM 记录仪" + "24h 佩戴": 没这两个就不是动态血压, 是普通血压.
  - 按小时收费 (¥6/h × N) 是动态血压的典型计费方式, 但实际是普通血压则违规.

  关键判定逻辑: fee 收动态血压 (按小时) + 文书无 ABPM 记录仪 / 24h 报告 = 强 V.

  注意: 多见于心内 / 高血压科; 其他科室命中需特别核查 (可能是误开).
trigger_keywords:
  - 动态血压监测
  - ABPM
  - 24小时血压
  - 血压计
  - 监护仪
  - Mobil-O-Graph
suggested_tools:
  - search_fees
  - search_notes
  - note_diagnosis
expected_signal: |
  典型违规: 普通患者 fee 含动态血压监测 24×¥6=¥144, 护理记录仅"BP 120/80 三餐前后".
  典型 CLEAN: 难治性高血压患者佩戴 ABPM 24h, 有报告.
  典型 INCONCLUSIVE: 护理记录无血压监测方式描述.
