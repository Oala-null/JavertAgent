rule_id: R026
domain: 心血管内科
violation_type: 串换项目
question: 动态心电图与遥测心电监护项目互相串换收费。
example: 示例：某医院为心悸患者使用心电图机，安放电极后进行24小时心电图检查，应收取"动态心电图"（单价：160元/次）费用，但医院实际按照"遥测心电监护"（单价：10元/小时）收取费用，24小时收取240元，属于串换项目。
status: ready
priority: P2
handling_level: 违规（阻断）
prompt_addon: "本规则关注: 患者本次住院里, 是否「动态心电图 (Holter, ¥160/次)」与「遥测心电监护 (¥10/小时)」之间互相串换收费 (高低价之间错置).\n\n按诊疗规范:\n- \"动态心电图 (Holter)\": 24h 记录器, 患者佩戴回家或床边, 单次¥160, 出 Holter 报告\n- \"遥测心电监护 (Telemetry)\": 病区遥测发射器, 中央监护系统接收, 按小时计费\n\n审计步骤:\n1. 用 search_fees(keyword=...) 查 fee 命中:\n   A 类: \"动态心电图\" / \"Holter\" / \"24小时动态心电图\"\n   B 类: \"遥测心电监护\" / \"床边遥测\" / \"中央监护\"\n2. 若 A B 都无命中 → CLEAN.\n3. 用 search_notes(section=\"病程记录\" / \"护理记录\" / keyword=...) 提取实际监测方式描述.\n4. 检查文书是否含「Holter」独有特征 (命中 → 应收 Holter):\n   - \"Holter 记录器\" / \"24h 心电记录仪\"\n   - \"佩戴 24 小时回家\"\n   - \"Holter 报告\" / \"心律失常事件记录\"\n   - 心电图机型号 (例: \"DMS Holter\")\n5. 检查文书是否含「遥测监护」独有特征 (命中 → 应收遥测):\n   - \"遥测发射器\" / \"床边遥测\"\n   - \"中央监护系统\" / \"护士站接收\"\n   - \"实时心电监护 N 小时\"\n   - 病区分配遥测设备\n6. 比对 fee 项目 vs 文书实际方式:\n   - fee = A (Holter) + 文书 = 遥测 → V (低串高?或高串低?具体看金额)\n   - fee = B (遥测) + 文书 = Holter → V (例子情形, 24h Holter 应收¥160, 不应按¥10/h × 24h = ¥240)\n   - fee 与文书一致 → CLEAN\n7. 文书无心电监测方式描述 → INCONCLUSIVE.\n\n特殊注意:\n- 关键证据是 \"记录器型号 /\
  \ Holter vs 遥测\" 描述. 4 工具可审.\n- 注意: 同一患者可能同时做 Holter + 遥测 (合规), 需 fee 与文书逐一对账.\n\n关键判定逻辑: fee 项目 vs 文书实际监测方式不符 = V.\n\n注意: 红色难度 — 实际中两种方式描述常混用, 难精准判定. 多见于心内 / 急诊住院.\n\n\U0001F4CC 专家共识触发器 (v0.7, wangxin/jiweihui 加权 9I/0V/0C, 规则措辞需改):\n\nINCONCLUSIVE 触发器:\n- 心电监测与动态心电图或遥测心电监护任意 2 项同收 → **INCONCLUSIVE conf 0.5 + 标注\"规则措辞模糊, 建议线下复核\"**\n  → jiweihui: \"心电监测与动态心电图或遥测心电监护不能同时收费 — 规则措辞需改\"\n"
trigger_keywords:
- 动态心电图
- Holter
- 24小时动态心电图
- 遥测心电监护
- 床边遥测
- 中央监护
suggested_tools:
- search_fees
- search_notes
expected_signal: '典型违规: 心悸患者 fee 收 "遥测心电监护 24×¥10=¥240", 文书"佩戴 Holter 24h 出报告".

  典型 CLEAN: 重症患者床边遥测发射器 + 中央监护 + 病区文书一致.

  典型 INCONCLUSIVE: 文书仅"行心电监护"无方式描述.

  '
