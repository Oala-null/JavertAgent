rule_id: R231
domain: 重症医学
violation_type: 串换项目
question: 开展经纤支镜治疗，按照经纤支镜特殊治疗进行收费。
example: 示例：某省《诊疗目录》规定，经纤支镜特殊治疗项目内涵：包括微波、激光、高频电等法。医院为重症患者进行气管镜吸痰和注药操作，应收取"经纤支镜治疗"费用，但实际按照"经纤支镜特殊治疗"进行收费，属于串换项目。
status: ready
priority: P2
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「经纤支镜特殊治疗 (高价)」实际开展的只是「经纤支镜治疗 (常规吸痰 / 注药, 低价)」.

  按诊疗规范:
  - "经纤支镜治疗" (常规): 气管镜吸痰 / 灌洗 / 局部注药 (抗生素 / 止血药) / 取异物
  - "经纤支镜特殊治疗": 微波 / 激光 / 高频电 / 冷冻 / 支架置入 / 球囊扩张

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "经纤支镜特殊治疗" / "纤支镜特殊治疗" / "气管镜特殊治疗" / "支气管镜特殊"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="操作记录" / "诊疗经过" / keyword=...) 提取治疗手段描述.
  4. 检查文书是否含「特殊治疗」独有特征 (多数命中 → CLEAN):
     - "微波" / "微波消融"
     - "激光" / "Nd:YAG 激光" / "氩气激光"
     - "高频电" / "电凝" / "电切"
     - "冷冻探头" / "冷冻治疗"
     - "支架置入" / "气管支架"
     - "球囊扩张"
     - 设备型号 (例: "Olympus 电烙器")
  5. 检查文书操作描述是否仅吻合「常规治疗」(若命中 + 无 Y 独有特征 → V):
     - "吸痰" / "灌洗液 N ml"
     - "局部注药" / "抗生素灌注"
     - "取异物" / "活检"
     - 无激光 / 电凝 / 冷冻 / 支架 描述
  6. 文书无治疗手段描述 → INCONCLUSIVE.

  特殊注意:
  - 关键证据是 "治疗手段名" + "设备型号": 特殊治疗必带激光/电凝/冷冻等具体技术描述.
  - 重症 ICU 常规气管镜吸痰最易混淆为特殊治疗.

  关键判定逻辑: fee 收特殊治疗 + 文书仅 "吸痰 / 灌洗" 无特殊设备 = 串换 V.

  注意: 多见于呼吸科 / 重症医学科 / 胸外科.
trigger_keywords:
  - 经纤支镜特殊治疗
  - 纤支镜
  - 气管镜
  - 微波
  - 激光
  - 冷冻
  - 气管支架
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 重症患者 fee 收 "经纤支镜特殊治疗", 操作记录仅 "气管镜吸痰".
  典型 CLEAN: 气管狭窄患者激光烧灼 + 支架置入, 文书有设备型号.
  典型 INCONCLUSIVE: 文书简略 "行纤支镜治疗".
notes: ''
