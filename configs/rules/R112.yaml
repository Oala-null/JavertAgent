expected_signal: '典型违规: 同一日 "腹部 CT 增强扫描 ¥600" + "腹部 CT 平扫 ¥200" 同部位, 影像报告未说明分次时相采集.

  典型 CLEAN: 仅有增强单笔; 或影像报告明确不同部位 / 不同时相独立采集.

