rule_id: R324
domain: 眼科
violation_type: 超标准收费
question: 眼内能量精密治疗按单侧等单位计价时，净收费数量是否超过实际治疗侧别、独立执行及有效目录允许数量。
example: 临时医嘱开具一次，眼内能量精密治疗费按单侧计收三单位，需核实眼别、实际执行和当地计价口径。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |
  本规则核对“眼内能量精密治疗/眼内能量精密诊疗”的净数量，不能把一条ST医嘱直接等同一个单侧计价单位，也不能机械认为单侧项目一次最多收两单位。
  1. search_fees 搜“眼内能量”，列实际项目编码、服务日期、单位、净数量、单价及金额；核销关联退费，不把收费行数当治疗次数，不把儿童等合法加收项当重复主项。无目标净正收费才 CLEAN。
  2. catalog_lookup 按实际编码、名称和服务日期查有效目录，核实该院适用地区、计价单位、疗程/次数限制、加收规则及完整条文；原始费用单位“单侧”仅是记录，不能代替有效当地价格条款。
  3. search_orders(keyword="眼内能量") 并按实际术式补搜，核查临时/ST/长期、执行、取消；search_notes 查治疗单/激光记录/手术记录，逐个确认日期、眼别、实际疗次及操作。一次医嘱可覆盖合法双眼或分次安排，反复文字、复制病程、激光点数/发数/部位描述不能自动增加计价次数。
  4. 只有有效当地条款和完整执行事实共同确定允许数量后才计算超量：净收费数量减允许计价数量。例：净收3，确认仅单次左眼、允许1，则超2；确认一次双眼且目录允许按两侧计2，则超1；三次独立执行且目录允许分别计费，则不超量。不得直接采用专家摘要中的差额而跳过核算。
  5. 允许数量已确定且净收超量，判 VIOLATION，引用计价依据、逐次侧别和差额；执行和数量均相符且目录支持时 CLEAN。只有一条ST、眼别不清、分次记录不全、退费关联不明或当地目录未确认，判 INCONCLUSIVE conf 0.50 并列出资料缺口，不确定违规金额。
trigger_keywords: [眼内能量, 眼内能量精密治疗, 眼内能量精密诊疗]
trigger_codes: []
exam_keywords: [眼内能量]
suggested_tools: [search_fees, search_orders, catalog_lookup, search_notes]
expected_signal: |
  违规：目录按单侧，执行为单次左眼、允许1却净收3。
  待核：ST仅一条、净收3，实际眼别/分次/当地计价不明。
  合规：三次独立执行，服务当日目录允许且净收费相符。
