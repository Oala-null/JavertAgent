rule_id: R151
domain: 临床检验
violation_type: 过度检查
question: 非肝炎患者，住院期间多次测定乙肝、丙肝抗体。
example: 示例：某医院对部分非乙肝、丙肝患者，一次住院周期内多次无指征开展乙型肝炎、丙型肝炎抗体测定检查，属于过度检查。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: "\U0001F525 v1.6 STEP 0:\n**search_lab_results(item_keyword=\"乙肝病毒\"或\"HBV DNA\"或\"DNA定量\")**.\n若 rpt_itemname 含 \"病毒 DNA 定量\" + note_diagnosis 无肝炎/肝硬化 → **V** (wangxin 共识).\n\n\U0001F6A8 v1.5 STEP 0 (V 强信号):\n**先 search_lab_results(item_keyword=\"乙肝病毒\"或\"HBV DNA\")** 看返回是否真做了 + diagnosisOpinion.\n- rpt_itemname 含 \"乙肝病毒 DNA 定量\" + note_diagnosis 无 \"乙肝/肝炎/肝硬化\" → **V** (wangxin: \"无相关病史不应检查\")\n- 普通乙肝 5 项 / HBV 抗体 → 是术前传染指标, CLEAN\n\n本规则关注: 患者本次住院里, 是否被无指征收取了「乙肝/丙肝抗体测定 (HBsAg, HBsAb, HBeAg, HBeAb, HBcAb, 抗 HCV 等)」检查/检验.\n按诊疗规范, 这些项目仅适用于肝炎/肝硬化/肝癌患者, 或术前/输血前/血制品使用前的常规筛查 (一次足够). 一次住院周期内对非肝炎患者多次测定 = 过度检查.\n\n审计步骤:\n1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).\n2. 用 search_fees(category=\"检查类\") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.\n   检索关键词: \"乙肝\" / \"丙肝\" / \"HBsAg\" / \"抗 HCV\"\n3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).\n4. 检查 note_diagnosis 中是否含以下指征任一:\n   - 乙型肝炎 / 慢性乙肝 / 急性乙肝 / 乙肝病毒携带\n   - 丙型肝炎 / 慢性丙肝\n   - 肝炎 / 病毒性肝炎 / 肝硬化 / 肝癌 / 肝功能不全\n   - 肝穿刺活检 /\
  \ 肝移植 / 抗病毒治疗\n   - 术前筛查 / 输血前筛查 / 血制品使用前筛查 (首次)\n   \n5. 若有任一指征命中 → CLEAN (有指征).\n6. 若无任一指征命中, 且 count >= 2 → VIOLATION,\n   evidence: 引诊断完整列表 + 该检查项目名 × count.\n7. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.\n若 count == 1 且无指征 → INCONCLUSIVE (单次可能是术前/输血前筛查).\n\n特殊注意:\n- 术前筛查通常只查一次, 多次重复无医学价值, 是判 V 的核心依据.\n- 患者诊断含\"急性丙型肝炎抗体阴性\"等\"阴性结果\"也算指征 (诊断流程中).\n- 不要把\"乙肝表面抗原阳性\"误判为\"非肝炎\", 它是携带者标识 = 有指征.\n\n\U0001F4CC 专家共识触发器 (v0.7, wangxin/jiweihui 加权 9V/0/0):\n\nV 触发器:\n- 乙肝病毒 DNA / 丙肝病毒 RNA / 巨细胞病毒 DNA 等病毒载量定量检测 + 无任何肝炎/感染病史 → **V**\n  → wangxin: \"手术病人可以检查传染指标, 但乙肝病毒 DNA 测定不是常规检查项目, 无相关病史不应检查\"\n\nCLEAN 触发器:\n- 乙肝表面抗原/丙肝抗体/HIV/梅毒 等抗体筛查 (术前传染指标) → CLEAN (是常规)\n- 乙肝病毒 DNA + note_diagnosis 含 \"乙肝\"/\"病毒性肝炎\"/\"肝硬化\"/\"肝炎活动\" → CLEAN\n"
trigger_keywords:
- 乙肝抗体
- HBsAg
- HBsAb
- HBeAg
- HBeAb
- HBcAb
- 丙肝抗体
- 抗 HCV
- HCV
- 乙型肝炎
- 丙型肝炎
