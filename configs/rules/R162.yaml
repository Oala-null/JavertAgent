rule_id: R162
domain: 临床检验
violation_type: 过度检查
question: 将细菌抗体测定作为入院患者的常规检查，对大量无相关疾病指征的患者开展检验并收费。
example: 示例：细菌抗体测定主要用于特定病原菌感染的辅助诊断。某医院违反诊疗规范，将细菌抗体测定作为入院常规检查，对大量无感染症状及病原菌接触史的患者普遍开展检测并收费，属于过度检查。
status: ready
priority: P1
prompt_addon: |+
  本规则关注: 患者本次住院里, 是否被无指征收取了「细菌抗体测定 (肺炎支原体抗体 / 衣原体抗体 / 军团菌抗体 / 结核抗体 / 立克次体抗体)」检查/检验.
  按诊疗规范, 细菌抗体测定用于特定不典型病原感染的诊断, 不应作为普通入院常规.

  审计步骤:
  1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  2. 用 search_fees(category="检查类") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.
     检索关键词: "细菌抗体" / "肺炎支原体抗体" / "衣原体抗体" / "军团菌抗体" / "结核抗体"
  3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).
  4. 检查 note_diagnosis 中是否含以下指征任一:
     - 肺炎 / 不典型肺炎 / 社区获得性肺炎 CAP
     - 结核 / 肺结核 / 结核感染
     - 长期发热待查 / 不明原因发热 / FUO
     - 呼吸道感染
     - 胸部影像异常待查 / 肺部阴影待查
     - 持续咳嗽 / 慢性咳嗽
     - 免疫抑制患者感染评估
     
  5. 若有任一指征命中 → CLEAN (有指征).
  6. 若无任一指征命中, 且 count >= 1 → VIOLATION,
     evidence: 引诊断完整列表 + 该检查项目名 × count.
  7. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.

trigger_keywords:
  - 细菌抗体测定
  - 肺炎支原体抗体
  - 衣原体抗体
  - 军团菌抗体
  - 嗜肺军团菌抗体
  - 结核抗体
  - 立克次体抗体
suggested_tools:
  - note_diagnosis
  - search_fees
expected_signal: |
  典型违规: 患者诊断为甲状腺结节, 收肺炎支原体抗体, 无呼吸/感染相关诊断.
  典型 CLEAN: 不典型肺炎或长期发热待查患者测肺炎支原体/衣原体抗体.
  典型 INCONCLUSIVE: 诊断 "咳嗽待查" 等中间状态.
notes: ''
