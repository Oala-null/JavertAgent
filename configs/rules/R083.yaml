rule_id: R083
domain: 康复
violation_type: 串换项目
question: 将使用冰袋降温的操作，按照使用专用设备进行的冷疗治疗进行收费。
example: 示例：某省《诊疗目录》规定，冷疗指使用特殊设计的转换器，除去空气中的水分和灰尘，用处理过的冷空气(温度-15℃以下)作用于治疗部位的冷疗方法。某医院在患者住院期间使用冰袋给患者进行降温，收取冷疗费用，属于串换收费。
status: ready
priority: P2
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「冷疗治疗 (专用设备)」实际开展的是「冰袋降温 (普通物理降温)」, 即项目身份串换骗保模式.

  按各省《诊疗目录》:
  "冷疗治疗" 项目内涵: 使用特殊设计的转换器, 除去空气中水分和灰尘, 用处理过的冷空气 (温度 -15℃ 以下) 作用于治疗部位; 或使用亚低温治疗仪 / Blanketrol 降温毯 / 电脑温控冷疗机. 与普通冰袋 / 冰帽降温 (人工放置, 无设备参数记录) 是两个不同的医保项目.

  审计步骤:
  1. 用 search_fees(category="其他类") 或 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "冷疗治疗" / "亚低温治疗" / "冷疗" / "降温治疗"
  2. 若 fee 无命中 → CLEAN (规则不适用).
  3. 用 search_notes(section="病程记录" / "护理记录" / keyword=...) 提取实际操作过程描述.
  4. 检查文书是否含「冷疗治疗」独有特征 (多数命中 → CLEAN, Y 真做了):
     - "亚低温治疗仪" / "Blanketrol" / "降温毯" / "冷疗机" / "冷空气治疗"
     - "核心温度监测" / "肛温监测" / "目标温度 32-34℃"
     - "设备参数" / "温度设定"
     - "持续 N 小时低温治疗"
  5. 检查文书操作描述是否吻合「冰袋降温」(若命中 + 不含 Y 独有特征 → V):
     - "冰袋" / "冰帽" / "毛巾包裹冰袋"
     - "腋下冰敷" / "腹股沟冰敷" / "额头冰敷"
     - "物理降温" / "外用冰块"
  6. 检查排除指征 (命中任一 → CLEAN):
     - 心脏骤停后亚低温 (有正式亚低温治疗 + 核心温度 32-34℃ 目标)
     - 重度颅脑损伤亚低温
     - 中暑核心降温
  7. 文书无温度监测/操作描述 → INCONCLUSIVE.
     操作记录 section 缺失但有交叉引用 (如 "见冷疗记录") → INCONCLUSIVE conf 0.5 + etl_warning.

  特殊注意:
  - 关键证据是 "设备名" + "温度监测参数": 冷疗治疗必须有设备型号 + 温度记录, 冰袋降温只有手工放置描述.
  - 若 fee 含冷疗 + 文书有 "冰袋" 但无任何冷疗设备 → 强 V (硬证据, conf 0.85+).

  关键判定逻辑: fee 命中 Y + 文书无 Y 独有特征 + 文书描述与 X 吻合 = 串换 V.

  注意: 甲状腺 pilot 患者罕见, 多见于重症 / 心脏骤停 / 颅脑损伤 / 中暑 / 急诊场景.
trigger_keywords:
  - 冷疗治疗
  - 亚低温治疗
  - 冰袋降温
  - 物理降温
  - Blanketrol
  - 降温毯
  - 核心温度
suggested_tools:
  - search_fees
  - search_notes
  - note_diagnosis
expected_signal: |
  典型违规: 发热患者 fee 含 "冷疗治疗", 但护理记录仅写 "冰袋外敷".
  典型 CLEAN: 心脏骤停后亚低温治疗, 有设备型号 + 温度监测.
  典型 INCONCLUSIVE: 护理记录无降温措施描述.
notes: ''
