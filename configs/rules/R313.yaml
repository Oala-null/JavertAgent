rule_id: R313
domain: 精神医学
violation_type: 过度诊疗
question: 违反诊疗规范将抗精神病药物治疗监测普遍为无相关指征的患者开展并收费。
example: 示例：某医院普遍无指征为住院患者开展抗精神病药物治疗监测，如患者住院期间只有营养输液治疗，但仍常规收取精神病药物治疗监测。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |+
  本规则关注: 患者本次住院里, 是否被无指征收取了「抗精神病药物治疗监测 (药物治疗监测)」检查/检验.
  按诊疗规范, 抗精神病药物治疗监测仅在使用抗精神病药时有意义, 用于评估血药浓度 / 副作用 / 疗效. 未用抗精神病药患者收取该监测属于无适应症加收.

  审计步骤:
  1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  2. 用 search_fees(category="检查类") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.
     检索关键词: "抗精神病药物治疗监测" / "药物治疗监测"
  3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).
  4. 检查 note_diagnosis 中是否含以下指征任一:
     - 精神分裂症
     - 双相情感障碍
     - 急性精神病性障碍
     - 分裂情感性障碍
     - 妄想性障碍
     - 重度抑郁伴精神病性症状
     - 器质性精神障碍
     - 童青少年精神病
     
  5. 若有任一指征命中 → CLEAN (有指征).
  6. 若无任一指征命中, 且 count >= 1 且 search_fees(keyword 任一为 "利培酮"/"奥氮平"/"喹硫平"/"氯氮平"/"阿立哌唑"/"帕利哌酮"/"齐拉西酮"/"鲁拉西酮"/"氟哌啶醇"/"氯丙嗪"/"奋乃静"/"舒必利") 无命中 → VIOLATION,
     evidence: 引诊断完整列表 + 该检查项目名 × count + 用药列表.
  7. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.
  若诊断含精神分裂症 + 治疗中, 但 search_fees 未明示抗精神病药费用, 退 INCONCLUSIVE.

  特殊条件: 若 search_fees(keyword 任一为 "利培酮"/"奥氮平"/"喹硫平"/"氯氮平"/"阿立哌唑"/"帕利哌酮"/"齐拉西酮"/"鲁拉西酮"/"氟哌啶醇"/"氯丙嗪"/"奋乃静"/"舒必利") 命中, 说明患者实际用了抗精神病药, 即使诊断未明说也支持开展 抗精神病药物治疗监测 (药物治疗监测), 应判 CLEAN.

  特殊注意:
  - 判定关键是 "实际用了抗精神病药", 不是 "诊断有精神病". 用 search_fees 查药品名优先于 note_diagnosis.
  - 仅用抗抑郁药 (SSRI) / 抗焦虑药 (BZD) 而无抗精神病药, 不构成监测指征.

trigger_keywords:
  - 抗精神病药物治疗监测
  - 药物治疗监测
  - 利培酮
  - 奥氮平
  - 喹硫平
  - 氯氮平
  - 氟哌啶醇
trigger_codes:
  - XN05AH
  - XN05AX
suggested_tools:
  - note_diagnosis
  - search_fees
expected_signal: |
  典型违规: 患者用药里无抗精神病药 (仅用 SSRI 抗抑郁药), 费用列抗精神病药物治疗监测.
  典型 CLEAN: 精神分裂症患者长期奥氮平治疗, 监测血药浓度.
  典型 INCONCLUSIVE: 文书未明示用药细节, 仅看费用条目.
