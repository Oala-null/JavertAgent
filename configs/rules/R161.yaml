rule_id: R161
domain: 临床检验
violation_type: 过度检查
question: 将血清肌钙蛋白Ⅰ测定作为入院患者的常规检查，对大量无相关指征的患者开展检验并收费。
example: 示例：血清肌钙蛋白Ⅰ是心肌损伤的特异性标志物，主要用于急性心肌梗死等心脏疾病的诊断。某医院违反诊疗规范，将血清肌钙蛋白Ⅰ作为入院常规检查，对大量无心悸、胸痛等症状及心脏疾病相关指征的患者普遍开展检测并收费，属于过度检查。
status: ready
priority: P0
prompt_addon: |+
  本规则关注: 患者本次住院里, 是否被无指征收取了「肌钙蛋白 I (cTnI, TnI, 高敏肌钙蛋白 hs-cTnI)」检查/检验.
  按诊疗规范, cTnI 用于急性冠脉综合征 / 心肌损伤诊断和随访, 不应作为普通入院常规.

  审计步骤:
  1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  2. 用 search_fees(category="检查类") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.
     检索关键词: "肌钙蛋白" / "cTnI" / "TnI" / "高敏肌钙蛋白" / "hs-cTnI"
  3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).
  4. 检查 note_diagnosis 中是否含以下指征任一:
     - 急性心肌梗死 / 心梗 / 急性 STEMI / NSTEMI
     - 急性冠脉综合征 / ACS
     - 不稳定心绞痛 / 稳定心绞痛恶化
     - 胸痛 (待查或明确)
     - 心电图缺血改变 / ST 段抬高 / ST 段压低
     - 心肌损伤 / 心肌炎
     - 心律失常待查
     - 心力衰竭急性发作
     - 围术期心肌缺血风险
     
  5. 若有任一指征命中 → CLEAN (有指征).
  6. 【判「无指征」前 MUST 执行】用 scan_progress_indications(patient_id, symptom_kw_list=["胸闷", "气短", "喘", "憋", "胸痛", "下肢水肿", "发热", "咳嗽", "心悸"]) 扫病程/查房 section 族的症状指征.
     - 若命中**阳性**症状 (无 [否认段]/[选项框] 标注) → CLEAN (病程记录有指征, 不只看诊断).
     - 仅当诊断无指征 **且** 病程症状 0 阳性命中时, 才可继续向 VIOLATION 推进.
  7. 若无任一诊断指征命中 且病程症状 0 阳性命中, 且 count >= 1 → VIOLATION,
     evidence: 引诊断完整列表 + 该检查项目名 × count.
  8. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.

trigger_keywords:
  - 肌钙蛋白
  - cTnI
  - TnI
  - 高敏肌钙蛋白
  - hs-cTnI
  - 心梗
  - ACS
  - 心肌损伤
suggested_tools:
  - note_diagnosis
  - search_fees
expected_signal: |
  典型违规: 患者诊断无胸痛/心电图异常/心肌问题, 收 cTnI × 1.
  典型 CLEAN: 急性胸痛患者多次 cTnI 排查心梗.
  典型 INCONCLUSIVE: 诊断 "胸痛待查" 等中间状态.
notes: ''
