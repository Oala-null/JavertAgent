rule_id: R131
domain: 医学影像
violation_type: 过度检查
question: 无指征为住院患者普遍开展心脏彩色多普勒超声、左心功能测定、室壁运动分析、组织多普勒显象(TDI)等检查并收费。
example: 示例：心脏彩超、左心功能测定、室壁运动分析、TDI等检查一般用于评估心脏功能。某医院外科、妇科将相关检查作为住院患者入院常规检查普遍开展，属于过度检查。
status: ready
priority: P0
prompt_addon: |+
  本规则关注: 患者本次住院里, 是否被无指征收取了「心脏彩超系列 (心脏彩色多普勒超声 + 左心功能测定 + 室壁运动分析 + 组织多普勒显象 TDI)」检查/检验.
  按诊疗规范, 心脏彩超系列应有心脏疾病或心功能评估指征, 不应作为入院常规打包.

  审计步骤:
  1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  2. 用 search_fees(category="检查类") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.
     检索关键词: "心脏彩超" / "心脏彩色多普勒超声" / "左心功能" / "室壁运动" / "TDI"
  3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).
  4. 检查 note_diagnosis 中是否含以下指征任一:
     - 心脏病 / 冠心病 / 心肌梗死
     - 心衰 / 心力衰竭 / 心功能不全
     - 心律失常 / 房颤 / 室颤
     - 高血压心脏病 / 高血压性心脏病
     - 心肌病 / 扩张型心肌病 / 肥厚型心肌病
     - 瓣膜病 / 瓣膜性心脏病 / 主动脉瓣 / 二尖瓣病变
     - 心绞痛 / 不稳定心绞痛 / 稳定型心绞痛
     - 心肌损伤 / 心肌炎
     - 心电图异常 / ST-T 改变
     - 胸闷 / 呼吸困难待查
     - 重大手术术前心功能评估 (高龄 / 心血管风险)
     - 肺动脉高压 / 右心衰
     - 先天性心脏病
     
  5. 若有任一指征命中 → CLEAN (有指征).
  6. 【判「无指征」前 MUST 执行】用 scan_progress_indications(patient_id, symptom_kw_list=["胸闷", "气短", "喘", "憋", "胸痛", "下肢水肿", "发热", "咳嗽", "心悸"]) 扫病程/查房 section 族的症状指征.
     - 若命中**阳性**症状 (无 [否认段]/[选项框] 标注) → CLEAN (病程记录有指征, 不只看诊断).
     - 仅当诊断无指征 **且** 病程症状 0 阳性命中时, 才可继续向 VIOLATION 推进.
  7. 若无任一诊断指征命中 且病程症状 0 阳性命中, 且 count >= 1 → VIOLATION,
     evidence: 引诊断完整列表 + 该检查项目名 × count.
  8. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.

  特殊注意:
  - 心脏彩超 + 左心功能 + TDI 三项打包是核心违规模式; 单项心脏彩超有"重大手术术前评估"指征仍可 CLEAN.

trigger_keywords:
  - 心脏彩超
  - 心脏彩色多普勒超声
  - 左心功能
  - 室壁运动
  - 组织多普勒
  - TDI
suggested_tools:
  - note_diagnosis
  - search_fees
expected_signal: |
  典型违规: 患者诊断只有甲状腺结节, 收心脏彩超 + 左心功能 + TDI 打包.
  典型 CLEAN: 心衰患者心脏彩超 + 左心功能评估射血分数.
  典型 INCONCLUSIVE: 诊断 "胸闷待查" / "心律失常待查" 等中间状态.
notes: ''
