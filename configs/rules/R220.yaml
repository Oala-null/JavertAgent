rule_id: R220
domain: 麻醉
violation_type: 虚构医药服务项目或过度诊疗
question: 对不符合控制性降压适用范围（如不能耐受、非保护重要脏器氧供等）的患者，收取控制性降压费用。
example: 示例：《全国医疗服务项目技术规范（2023版）》规定，控制性降压项目内涵：对可以耐受的患者，在保证重要脏器的氧供的情况下，采用药物(如麻醉药物和血管扩张药等)和技术，根据手术需要，调节控制血压，以减少术野出血，使术野清晰，便于手术，并维护重要器官功能。某医院对大多数全身麻醉患者，无论是否耐受、是否保护重要脏器氧供，均收取“控制性降压”费用，涉嫌虚构医药服务项目或过度诊疗。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: "本规则关注: 患者本次住院里, 是否被无指征收取了「控制性降压 (术中降压)」检查/检验.\n按诊疗规范, 控制性降压用于神经外科 / 血管外科 / 出血风险大手术中减少出血, 普通手术不需要.\n\n审计步骤:\n1. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).\n2. 用 search_fees(category=\"检查类\") 或 search_fees(keyword=...) 查该检查是否做过, 记录出现次数 count.\n   检索关键词: \"控制性降压\" / \"术中降压\"\n3. 若 count == 0 → CLEAN (规则不适用, 患者根本没做该检查).\n4. 检查 note_diagnosis 中是否含以下指征任一:\n   - 神经外科手术 / 颅内手术 / 开颅\n   - 脑动脉瘤 / 颅内动脉瘤夹闭\n   - 脑血管畸形 / AVM\n   - 主动脉手术 / 大血管手术\n   - 脊柱大手术 / 脊柱矫形\n   - 出血风险高的手术 (血管丰富区域)\n   - 鼻内镜手术 / 鼻窦手术\n   - 中耳手术 / 听神经瘤\n   - 颌面外科出血控制\n   - 嗜铬细胞瘤切除 (术中血压剧烈波动)\n   \n5. 若有任一指征命中 → CLEAN (有指征).\n6. 若无任一指征命中, 且 count >= 1 → VIOLATION,\n   evidence: 引诊断完整列表 + 该检查项目名 × count.\n7. 诊断为「待查」「疑似」「排除」等中间状态 → INCONCLUSIVE.\n\n特殊注意:\n- 判定关键是 \"手术类型 + 出血控制需求\", 不仅看诊断. 文书 search_notes(section=\"手术记录\") 描述 \"术中控制血压\" 也算指征.\n\n注意: 甲状腺手术若伴 \"巨大甲状腺肿\" / \"丰富血供\" 描述, 控制性降压可能有指征, 慎判 VIOLATION.\n\n\U0001F4CC 专家共识触发器 (v0.7, wangxin 加权 5C/4V/0I):\n\nCLEAN 触发器:\n- search_notes(section=\"手术记录\") 或 keyword=\"\
  切除\"/\"开颅\"/\"颞叶\"/\"脑膜\"/\"颅底\"/\"脑干\"/\"脊柱\"/\"血管外科\"/\"大型骨科\" 任一命中 → **CLEAN**\n  → wangxin: \"违规认定不符合客观逻辑和诊疗常规\"\n- 控制性降压是颅内手术/大血管手术/出血风险大手术的麻醉常规, 不需 LLM 二次判断必要性\n\n反例 (V): 浅表小手术 (甲状腺浅切 / 皮肤切除 / 痣切除) + 收控制性降压 / 无手术 + 收控制性降压.\n"
trigger_keywords:
- 控制性降压
- 术中降压
- 神经外科
- 颅内手术
- 鼻内镜手术
- 中耳手术
trigger_codes:
- S330100016
suggested_tools:
- note_diagnosis
- search_fees
- search_notes
expected_signal: '典型违规: 普通甲状腺手术患者无血管丰富 / 出血风险描述, 费用列控制性降压.

  典型 CLEAN: 颅内动脉瘤夹闭术患者控制性降压减少出血.

  典型 INCONCLUSIVE: 文书未明示术中是否实际降压, 仅看费用条目.

  '
