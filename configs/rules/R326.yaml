rule_id: R326
domain: 中医
violation_type: 虚构医药服务项目
question: 特殊手法针法、中药敷治及中医熏洗等治疗收费是否具有对应的实际治疗记录。
example: 同次住院收取特殊手法针法、中药敷治和中医熏洗费用，存在医嘱但未见可定位的治疗记录单。
status: ready
priority: P0
handling_level: 可疑（警告）
prompt_addon: |
  本规则逐项核查“特殊手法针法”“中药塌渍/中药溻渍/中药踏渍/中药塌敷/中药溻敷/中药贴敷”“中医熏洗/中药熏洗/中药熏蒸”的执行证据，适用于实际出现这些收费的各科患者，不只限中医科。截图敷治项目具体字形以原始收费编码/名称为准；这些名称是候选，不能认定均为同一项目。
  1. search_fees 分别按上述名称搜索，确认是治疗服务收费，列项目编码、日期、净数量/单位/金额并核对退费。只有中药材料/饮片费用不能推断已收治疗服务费；无目标净正服务收费才 CLEAN。
  2. search_orders 核查对应治疗医嘱、频次及取消；search_notes 分别检索“针法”“塌渍”“溻渍”“踏渍”“塌敷”“溻敷”“贴敷”“熏洗”“熏蒸”“治疗记录”“执行记录”，查病程、治疗单、护理执行单，检索结果被截断或文书域不完整需说明。医嘱是计划，有医嘱不能替代实际执行。
  3. 每项分别核对实际治疗时间、部位和操作过程：针法需记录所实施手法/穴位等相关描述，塌渍需部位及药物湿敷操作线索，熏洗/熏蒸需部位及对应操作线索；签名、时长等字段可辅助追溯，不能因缺任一固定字段单独认定虚构。一张记录可证明多项目，但必须分别有实际执行内容。
  4. 某项文书明确取消、拒绝或未执行，且仍有该项未退净收费，判该项 VIOLATION。只有收费和医嘱、病程泛写“中医治疗”或未检索到执行记录，判 INCONCLUSIVE conf 0.50，逐项列出需补的治疗/护理执行单，不能仅凭记录缺失断言骗保。
  5. 所有目标净正收费均有可定位且数量相符的执行依据时 CLEAN；一项有记录不能替其余两项举证。没有明确违规但任一项目缺记录/数量无法核对，整体 INCONCLUSIVE。必要时用 catalog_lookup 核对名称映射，不能把不同治疗名称强行等同。
trigger_keywords: [特殊手法针法, 中药塌渍, 中药溻渍, 中药踏渍, 中药塌敷, 中药溻敷, 中药贴敷, 中医熏洗, 中药熏洗, 中药熏蒸]
trigger_codes: []
exam_keywords: [特殊手法针法, 中药塌渍, 中药溻渍, 中药踏渍, 中药塌敷, 中药溻敷, 中药贴敷, 中医熏洗, 中药熏洗, 中药熏蒸]
suggested_tools: [search_fees, search_orders, search_notes, catalog_lookup]
expected_signal: |
  待核：三项净正收费和医嘱均有，但无治疗记录，或仅一项有执行依据。
  违规：治疗明确取消但继续收费且未退费。
  合规：三项各有对应部位、时间和操作，数量相符。
