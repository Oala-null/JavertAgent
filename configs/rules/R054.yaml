rule_id: R054
domain: 骨科
violation_type: 重复收费
question: 将普通手术切口的缝合步骤，按照皮瓣成形术进行收费。
example: 示例：某医院为患者行肘关节游离体切开取出术，手术步骤为切开关节、取出游离体、探查前后关节腔、冲洗、缝合包扎。医院收取"肘关节游离体切开取出术""任意皮瓣形成术"费用，其中，"任意皮瓣形成术"为重复收费。
status: ready
priority: P2
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取的「皮瓣成形术 / 皮瓣形成术 / 任意皮瓣」实际开展的只是普通手术切口缝合 (主手术内涵).

  按诊疗规范:
  - "皮瓣成形术" 是独立的整形手术: 设计皮瓣 (蒂部 + 供区) → 切取皮瓣 → 旋转 / 推移 / 转移 → 覆盖受区 → 缝合; 需明确的皮瓣设计/蒂部描述
  - 普通手术切口缝合是主手术内涵, 不应单独收皮瓣成形术费

  审计步骤:
  1. 用 search_fees(category="手术类") 或 search_fees(keyword=...) 查 fee 是否命中.
     检索关键词: "皮瓣成形" / "皮瓣形成" / "任意皮瓣" / "皮瓣转移"
  2. 若 fee 无命中 → CLEAN.
  3. 用 search_notes(section="手术记录" / "手术经过" / keyword=...) 提取手术步骤描述.
  4. 检查文书是否含「皮瓣成形术」独有特征 (多数命中 → CLEAN):
     - "皮瓣设计" / "皮瓣切取"
     - "蒂部" / "蒂宽 N cm"
     - "供区" / "受区"
     - "皮瓣旋转 / 推移 / 转移"
     - "皮瓣面积 N × N cm"
     - 独立的皮瓣手术步骤段落
  5. 检查文书操作描述是否仅吻合「普通切口缝合」(若命中 + 无 Y 独有特征 → V):
     - "切开 → 操作 → 冲洗 → 缝合包扎" (普通手术四步)
     - "逐层缝合" / "全层缝合"
     - "无皮瓣描述"
  6. 检查排除指征:
     - 创伤性皮肤缺损需皮瓣修复
     - 肿瘤切除后大面积皮肤缺损
     - 烧伤后疤痕修复
     - 慢性溃疡 / 压疮的皮瓣覆盖
  7. 文书手术记录简略 → INCONCLUSIVE.

  特殊注意:
  - 关键证据是文书是否有 "皮瓣设计 / 蒂部 / 供区" 等专业描述. 普通手术缝合不会有这些.
  - 若 fee 同时含主手术 + 皮瓣成形, 但手术记录只描述主手术 + 普通缝合 → 强 V.

  关键判定逻辑: fee 收皮瓣成形 + 手术记录无皮瓣专业描述 = 串换/重复 V.

  注意: 多见于骨科 / 普外 / 整形科; 肿瘤切除大面积创面修复需特别核查 (可能合规).
trigger_keywords:
  - 皮瓣成形
  - 皮瓣形成
  - 任意皮瓣
  - 蒂部
  - 供区
  - 皮瓣旋转
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 肘关节游离体切开取出术 + 收皮瓣成形术, 手术记录仅切开-取出-冲洗-缝合.
  典型 CLEAN: 烧伤瘢痕患者皮瓣修复, 文书有皮瓣设计 + 蒂部 + 供区描述.
  典型 INCONCLUSIVE: 手术记录简略, 仅"行手术 + 缝合".
notes: ''
