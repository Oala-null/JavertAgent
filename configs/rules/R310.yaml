rule_id: R310
domain: 精神医学
violation_type: 过度诊疗
question: 未严格执行精神科住院标准，将轻中度焦虑/抑郁、睡眠障碍、酒精依赖等可经门诊管控的非危急重症患者（门诊管控不佳的除外）违规收治住院。
example: 示例：某医院将轻中度抑郁症患者收治住院，实际患者可在门诊定期复诊，无需住院。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被无指征收取了「精神科住院 (轻症患者违规收治)」治疗/干预.
  按医保政策, 精神科住院应针对重性精神病急性发作期 / 自伤自杀风险 / 拒食拒治 / 严重激越等危急重症. 轻中度焦虑/抑郁 / 单纯睡眠障碍 / 单纯酒精依赖 (门诊管控不佳者除外) 不应住院.

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中. 检索关键词: "精神科住院" / "精神病房住院" / "精神科住院费"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该治疗).
  3. 用 note_diagnosis 列出全部诊断, 用 search_notes(section="入院评估") 查文书证据.
  4. 检查是否含任一指征:
     - 精神分裂症急性发作
     - 双相情感障碍躁狂期
     - 重度抑郁伴自杀风险
     - 急性精神病性障碍
     - 自伤
     - 自杀风险
     - 木僵
     - 拒食拒治
     - 严重激越
     - 兴奋躁动
     - 谵妄
     
     若有任一指征 → CLEAN (有指征).
  5. 检查是否含任一明确排除指征 (硬证据 V):
     - 轻中度焦虑 (单纯, 门诊可管控)
     - 轻中度抑郁 (无自杀风险)
     - 单纯睡眠障碍
     - 单纯酒精依赖 (无戒断综合征)
     
     若有任一排除指征命中 + treatment 命中 → VIOLATION (强证据, 治疗与诊断硬冲突).
  6. 若指征不命中 + 排除指征也不命中 + treatment 命中 → VIOLATION (无指征过度).
     evidence: 引诊断完整列表 + 该治疗项目名 + 价格.
  7. 文书简略 / 诊断为"待查"/"疑似"等中间状态 → INCONCLUSIVE.

  特殊条件: 用 search_notes 查关键执行证据: "量表分数" / "自杀风险评估" / "BPRS" / "HAMD" / "HAMA"; 缺失加分判 V.

  特殊注意:
  - 看入院评估量表分数: 轻度量表分数 + 无明确危急指征 + 收住院 = V.

  注意: 甲状腺患者基本无精神科住院, 命中需特别关注 (可能是合并精神症状).
trigger_keywords:
  - 精神科住院
  - 精神病房住院
  - 轻症
  - 焦虑
  - 抑郁
  - 睡眠障碍
suggested_tools:
  - search_fees
  - note_diagnosis
  - search_notes
expected_signal: |
  典型违规: 患者诊断'轻度焦虑' + 量表 HAMA 7 分, 收精神科住院.
  典型 CLEAN: 重度抑郁 + 自杀风险患者收治住院.
  典型 INCONCLUSIVE: 入院评估量表分数缺失.
notes: ''
