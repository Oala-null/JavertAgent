rule_id: R034
domain: 骨科
violation_type: 串换项目
question: 骨科一次性使用高值耗材（如髓内钉、螺钉、金属接骨板、关节钢板、骨针、人工骨、异体骨、固定棒、椎间融合器、骨水泥、脊柱内镜、等离子刀头、钛板等），不同厂家、不同规格、不同价格之间相互串换收费。
example: '示例1：某医院为骨折患者开展切开复位内固定手术，术中使用普通接骨螺钉（单价650元/个）8个，但按照自攻型锁定钉（单价1200元/个）8个进行收费，属于串换项目。

  示例2：某医院给病人实施开放性手术，植入对应的适用于开放性手术钉棒系列耗材，而收费串换成适用于微创性手术的钉棒系列耗材；实际使用实心螺钉、但收取空心接骨螺钉费用，属于串换项目。

  '
status: ready
priority: P2
handling_level: 违规（阻断）
prompt_addon: "本规则关注: 患者本次住院里, 骨科高值耗材 (髓内钉 / 螺钉 / 钢板 / 钛板 / 椎间融合器 / 骨水泥 等) 是否存在「不同厂家 / 规格 / 价格之间串换收费」.\n\n⚠️ **审计工具限制**: 同 R014, 此规则核心证据是「耗材厂家 / 规格 / 注册证号」, 4 工具看不到. pilot 阶段大概率 INCONCLUSIVE.\n\n审计步骤 (受限版):\n1. 用 search_fees(category=\"耗材类\") 取骨科耗材明细.\n   检索关键词: \"髓内钉\" / \"螺钉\" / \"接骨板\" / \"关节钢板\" / \"钛板\" / \"椎间融合器\" / \"骨水泥\" / \"自攻型\" / \"锁定钉\" / \"空心钉\" / \"微创\"\n2. 若骨科耗材 fee 无命中 → CLEAN (规则不适用).\n3. 用 search_notes(section=\"手术记录\" / \"操作记录\" / keyword=...) 提取实际使用耗材描述.\n4. 检查文书是否含耗材厂家 / 型号 / 注册证号:\n   - \"强生 / 史赛克 / 美敦力 / 大博 / 威高 + 型号\"\n   - 注册证号 (例: ZG-XXX-XX-XX)\n   - 高值耗材消耗记录 (单价 + 数量 + 总价对账)\n5. 比对 fee 收费的耗材类型 vs 文书记录:\n   - 文书有完整耗材厂家+型号记录, 与 fee 一致 → CLEAN\n   - 文书有耗材类型描述但与 fee 不符 (例: fee 收\"自攻型锁定钉\", 文书写\"普通接骨螺钉\") → V\n   - 文书无耗材厂家/型号 → **INCONCLUSIVE** (建议核实手术耗材消耗台账)\n6. 同型号耗材计数对账: fee 数量 vs 文书使用数量\n   - 不符 (例: fee 10 个, 文书 8 个) → V (虚增)\n   - 一致 → CLEAN\n\n特殊注意:\n- 当前 4 工具能审的核心是 \"文书是否记录耗材厂家 + 型号\". 实际使用的细节 (开放 vs 微创 / 实心 vs 空心) 多数文书不记录, 难判.\n- 此规则的完整 V 判定依赖 **add-material-registry\
  \ change** (引入采购数据 + 耗材消耗记录).\n\n关键判定逻辑: fee 高值耗材命中 + 文书无耗材厂家/型号 → INCONCLUSIVE.\n\n注意: 红色难度. 多见于骨科手术. 建议医院采购台账独立审计.\n\n\U0001F4CC 专家共识触发器 (v0.7, wangxin C, jiweihui I, 加权 5C/4I/0V):\n\nINCONCLUSIVE 触发器 (统一立场):\n- 耗材费 命中 + 文书无 \"植入\"/\"装入\"/\"使用 [耗材名]\" → **INCONCLUSIVE conf 0.5 + 标注\"需线下核查条码\"**\n  → wangxin: \"需要查看耗材粘贴条码\"\n  → jiweihui: \"建议条形码\"\n\n不要 V 除非反复多次 + 完全无任何手术记录.\n"
trigger_keywords:
- 髓内钉
- 接骨板
- 自攻型锁定钉
- 空心钉
- 钛板
- 椎间融合器
- 骨水泥
- 注册证号
suggested_tools:
- search_fees
- search_notes
expected_signal: '典型违规: fee 收"自攻型锁定钉 8 个", 手术记录写"使用普通接骨螺钉 8 个".

  典型 CLEAN: 文书有完整 "强生 SYNTHES LCP 锁定接骨板 + 注册证号" 记录.

  典型 INCONCLUSIVE: 手术记录仅 "植入接骨板螺钉" 无厂家型号.

  '
notes: '红色难度, 依赖采购数据. add-material-registry change 后才能完整审.

  '
