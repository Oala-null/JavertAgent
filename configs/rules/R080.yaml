rule_id: R080
domain: 康复
violation_type: 虚构医药服务项目
question: 未开展相关诊疗项目，但收取对应诊疗费用。
example: 示例：某医院向所有诊断为单侧膝关节骨性关节病并进行膝关节置换术的患者，收取日常生活能力评定、肢体功能评定、关节活动度检查、肌力检查、步态检查、平衡检查、大关节松动训练、床边徒手肢体运动训练、本体感觉神经机头促进训练、肢体平衡功能训练、器械运动训练、日常生活动作训练等康复评定及治疗费用，但实际有些并非开展。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 费用中有「多项康复评定打包 (日常生活能力 / 肢体功能 / 关节活动度 / 肌力 / 步态 / 平衡)」, 但文书中没有对应的
  执行记录, 即 "虚构 多项康复评定打包 (日常生活能力 / 肢体功能 / 关节活动度 / 肌力 / 步态 / 平衡) 项目骗取医保基金".
  按医保政策, 各项康复评定应有评定记录 + 量表分数 + 评定人. 对所有患者打包收 6 项评定但文书无对应记录 = 虚构.

  审计步骤:
  1. 用 search_fees 查 fee 是否命中. 检索关键词: "日常生活能力评定" / "肢体功能评定" / "关节活动度检查" / "肌力检查" / "步态检查" / "平衡检查"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未被收取该费用).
  3. 用 search_notes 检查文书是否有该服务的执行记录:
     - 重点检查 section: "康复评定记录" / "康复治疗记录"
     - 执行证据关键词: "评定量表" / "评定人" / "Barthel" / "FIM" / "评定日期"
  4. 若文书有任一执行证据命中 → CLEAN (服务实际开展).
  4a. 用 note_diagnosis 检查是否有支持该服务开展的诊断:
     - 偏瘫
     - 截瘫
     - 脑梗后遗症
     - 脑外伤后遗症
     - 关节置换术后
     
     若诊断有支持但文书无执行证据 → INCONCLUSIVE (有指征但记录可能缺失).
  5. 若 fee 有 + 文书无执行证据 + 诊断无支持 → VIOLATION,
     evidence: 引 fee 项目名 + 价格 + "在 康复评定记录 等 section 中未检索到 评定量表 等执行描述".
  6. 文书 section 不完整 (例如手术记录缺失) / 描述模糊 → INCONCLUSIVE.

  特殊条件: 若文书无 康复医学科 科室介入痕迹 (例: 该科记录段为空 / 该科入院记录未生成), 强支持 VIOLATION.

  注意: 甲状腺手术患者一般无康复评定指征, 命中即关注.
trigger_keywords:
  - 日常生活能力评定
  - 肢体功能评定
  - 肌力检查
  - 步态检查
  - 平衡检查
  - Barthel
  - FIM
trigger_codes:
  - S340200003
suggested_tools:
  - search_fees
  - search_notes
  - note_diagnosis
expected_signal: |
  典型违规: 单侧膝置换患者收 6 项康复评定打包, 康复记录无评定量表分数.
  典型 CLEAN: 脑梗后偏瘫患者康复评定详述 Barthel/FIM 分数.
  典型 INCONCLUSIVE: 文书有康复记录但缺评定量表分数.
