rule_id: R080
domain: 康复
violation_type: 虚构医药服务项目
question: 未开展相关诊疗项目，但收取对应诊疗费用。
example: 示例：某医院向所有诊断为单侧膝关节骨性关节病并进行膝关节置换术的患者，收取日常生活能力评定、肢体功能评定、关节活动度检查、肌力检查、步态检查、平衡检查、大关节松动训练、床边徒手肢体运动训练、本体感觉神经机头促进训练、肢体平衡功能训练、器械运动训练、日常生活动作训练等康复评定及治疗费用，但实际有些并非开展。
status: ready
priority: P0
prompt_addon: "本规则关注: 患者本次住院里, 费用中有「多项康复评定打包 (日常生活能力 / 肢体功能 / 关节活动度 / 肌力 / 步态 / 平衡)」, 但文书中没有对应的\n执行记录, 即 \"虚构 多项康复评定打包 (日常生活能力 / 肢体功能 / 关节活动度 / 肌力 / 步态 / 平衡) 项目骗取医保基金\".\n按医保政策, 各项康复评定应有评定记录 + 量表分数 + 评定人. 对所有患者打包收 6 项评定但文书无对应记录 = 虚构.\n\n【裁决基准 (举证责任, M5 虚构类通则 — 优先于下列步骤)】\n- 治疗/手术类收费项目存在 = 医院已就该操作向基金收费, 举证\"该操作确实开展\"的责任在收费方。\n- 文书找不到该操作的执行证据时, 默认下限为 INCONCLUSIVE (证据缺失待人工核查);\n  MUST NOT 因\"文书未提及 / 未检索到执行描述\"就判 CLEAN。\n- 仅当文书**正面反证**该操作确实执行 (操作记录 / 治疗单 / 麻醉记录 / 执行记载, 含操作名+时间+过程)\n  → CLEAN。\n- 若文书正面显示该操作实际**未执行** (记录为其它操作 / 明确未做 / 诊断无支持且执行痕迹全缺)\n  → VIOLATION。\n- 名称警示: 收费项目名与文书术式名常不一致 (如「肘关节截骨术」↔「尺骨截骨术」),\n  MUST NOT 仅因名称不同就断言\"未收费\"或\"未执行\"; 用解剖部位与操作类别交叉核对。\n\n审计步骤:\n1. 用 search_fees 查 fee 是否命中. 检索关键词: \"日常生活能力评定\" / \"肢体功能评定\" / \"关节活动度检查\" / \"肌力检查\" / \"步态检查\" / \"平衡检查\"\n2. 若 fee 无命中 → CLEAN (规则不适用, 患者未被收取该费用).\n3. 用 search_notes 检查文书是否有该服务的执行记录:\n   - 重点检查 section: \"康复评定记录\" / \"康复治疗记录\"\n   - 执行证据关键词: \"评定量表\" / \"评定人\" / \"Barthel\" / \"FIM\" / \"评定日期\"\n4. 若文书有任一执行证据命中 → CLEAN (服务实际开展).\n4a. 用 note_diagnosis 检查是否有支持该服务开展的诊断:\n   - 偏瘫\n   - 截瘫\n   - 脑梗后遗症\n   - 脑外伤后遗症\n   - 关节置换术后\n   \n   若诊断有支持但文书无执行证据 → INCONCLUSIVE (有指征但记录可能缺失).\n5. 若 fee 有 + 文书无执行证据 + 诊断无支持 → VIOLATION,\n   evidence: 引 fee 项目名 + 价格 + \"在 康复评定记录 等 section 中未检索到 评定量表 等执行描述\".\n6. 文书 section 不完整 (例如手术记录缺失) / 描述模糊 → INCONCLUSIVE.\n\n特殊条件: 若文书无 康复医学科 科室介入痕迹 (例: 该科记录段为空 / 该科入院记录未生成), 强支持 VIOLATION.\n\n注意: 甲状腺手术患者一般无康复评定指征, 命中即关注.\n"
