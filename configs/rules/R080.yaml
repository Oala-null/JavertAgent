expected_signal: "典型违规: 单侧膝置换患者收 6 项康复评定打包, 康复记录无评定量表分数.\n典型 CLEAN: 脑梗后偏瘫患者康复评定详述 Barthel/FIM 分数.\n典型 INCONCLUSIVE: 文书有康复记录但缺评定量表分数.\n"
