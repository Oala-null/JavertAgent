rule_id: R023
domain: 心血管内科
violation_type: 分解收费
question: 将常规心电图检查(×通道加收)，分解为多个较少通道加收（如十二通道加收、三通道加收）项目收费。
example: 示例：医院实际开展常规心电图检查(十八通道加收)检查，应收取1次"十八通道加收"（10元/次）费用，但实际分解为"十二通道加收"（10元/次）和2次"三通道加收"（5元/次），多收费10元/次，属于分解收费。
status: ready
priority: P2
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否被收取了「分解的多通道心电图加收」(把 N 通道单次拆分为多个少通道加收, 多收费).
  按各省《医疗服务诊疗目录》, 心电图检查通道加收应按实际通道数 1 次收费; 同一次心电图检查不能既收 12 通道又收 3 通道.

  审计步骤:
  1. 用 search_fees(keyword=...) 检索:
     A 类 (通道加收): "三通道加收" / "六通道加收" / "十二通道加收" / "十八通道加收"
     B 类 (主项): "常规心电图" / "心电图检查" / "十二导联心电图"
  2. 若 A 类全无命中 → CLEAN.
  3. 统计 A 类不同通道项目同次住院共出现多少种 + 各自次数.
  4. 判定:
     - A 类只命中 1 种 (如仅"十八通道加收" × 1) → CLEAN (按实际通道收 1 次, 合规).
     - A 类同次同时命中 ≥ 2 种 (如"十二通道加收" + "三通道加收 × 2") → VIOLATION (分解收费硬证据),
       evidence: 引各 A 类项目名 + 次数 + 价格 + 推算应收单项总价 vs 实际收费差额.
     - 同种通道加收 多次出现 (如"十二通道加收 × 3") + 文书 search_notes(keyword="心电图") 仅记录 1 次 ECG → VIOLATION (虚增次数).
  5. 文书 search_notes(keyword="心电图") 明确多次独立 ECG (例如术前 + 术中 + 术后, 各 1 张) → 多次通道加收合理.
  6. 文书无法明确 ECG 次数 → INCONCLUSIVE.

  特殊注意:
  - 关键判定逻辑: 同次住院 fee 多种通道加收并存 = 强 V 信号 (因为同张 ECG 只有一个通道数).
  - "十八通道加收" 和 "六通道加收" 同时出现是典型分解: 12 通道 + 6 通道 ≈ 18 通道, 拆开收两次.
trigger_keywords:
  - 三通道加收
  - 六通道加收
  - 十二通道加收
  - 十八通道加收
  - 心电图检查
  - 常规心电图
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: fee 同次含 "十二通道加收" × 1 + "三通道加收" × 2 (= 18 通道分解), 文书心电图记录仅 1 次.
  典型 CLEAN: fee 仅 "十八通道加收" × N, N 与 ECG 张数一致.
  典型 INCONCLUSIVE: 文书未明示心电图实际次数.
notes: ''
