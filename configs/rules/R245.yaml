rule_id: R245
domain: 口腔
violation_type: 虚构医药服务
question: 开展普通拔牙、阻生牙拔除操作以及对牙龈炎、牙髓炎患者的普通诊治过程中，虚构服务收取口腔颌面软组织清创术等费用，虚计费用骗取医保基金。
example: 示例：某医院口腔科在患者进行普通拔牙、阻生牙拔除或诊治牙髓炎、牙龈炎时，将本无需且未开展的各类“口腔颌面软组织清创术”项目进行收费，且病历中无相关诊疗记录，虚构医药服务项目、骗取医保基金。
status: ready
priority: P1
prompt_addon: |
  本规则关注: 患者实际诊断仅为微小口腔病变 (普通拔牙 / 牙龈炎 / 牙髓炎 / 美容修复需求 等),
  但费用中出现「口腔颌面软组织清创术」类医保大手术 / 治疗项目, 即"非医保支付的牙齿
  美容/普通诊治套用医保大手术编码"的骗保模式.
  按医保政策, '口腔颌面软组织清创术' 适用于颌面外伤 / 软组织撕裂 / 火器伤 / 烫伤后组织清创等具体损伤场景, 而单纯拔牙后的常规创面处理已含在拔牙术内涵里. 把普通诊治服务冒充为大手术骗取医保基金属于虚构医药服务.

  审计步骤:
  1. 确认本次住院/门诊涉及口腔科: 用 search_notes 看 section 是否含"口腔" 或 search_fees
     看 dept 字段是否口腔. 若无口腔科介入 → CLEAN (规则不适用).
  2. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  3. 检查是否含任一支持「口腔颌面软组织清创术」的重大诊断:
     - 颌面外伤 / 颌面部撕裂伤 / 颌面外伤性软组织损伤
     - 火器伤 / 烫伤 / 烧伤 (口腔颌面)
     - 异物嵌入颌面软组织
     - 严重感染性溃疡 / 坏死性筋膜炎 (颌面)
     - 颌面感染 / 颌面脓肿 / 蜂窝织炎
     - 颌骨骨折 / 牙槽骨骨折
     
     若有任一支持诊断 → CLEAN (手术有适应症).
  4. 用 search_fees 查是否做了该大手术. 检索关键词: "口腔颌面软组织清创术" / "软组织清创" / "颌面清创"
  5. 若 fee 无命中 → CLEAN (规则不适用).
  6. 若诊断**全部**属于以下 trivial 范围:
     - 普通拔牙 / 牙拔除术
     - 阻生牙 / 阻生齿 / 智齿 / 第三磨牙
     - 多生牙
     - 牙龈炎 / 慢性牙龈炎 / 急性牙龈炎
     - 牙髓炎 / 急性牙髓炎 / 慢性牙髓炎
     - 残根 / 残冠
     - 龋齿伴牙髓暴露
     
     且 fee 命中「口腔颌面软组织清创术」 → VIOLATION,
     evidence:
     - 诊断完整列表 (证明全是微小诊断)
     - 「口腔颌面软组织清创术」项目名 + 价格
     - 该次口腔诊治总费用
  7. 诊断只有"牙体疾病"/"口腔疾病"等无细化项 → INCONCLUSIVE.

  加分项 (强支持 VIOLATION):
  - 若 fee 同时列出"种植牙" / "烤瓷冠" / "全瓷冠" / "正畸"等自费项目 → 说明医院承认本质是美容修复, 拿大手术做医保套帽.
  - 同次诊治 fee 总额 >800 但诊断只见 trivial → 强支持 VIOLATION.

  特殊注意:
  - 同患者诊断里只要有'颌面外伤'或'软组织撕裂'等具体损伤描述, 一律 CLEAN.
  - 若 fee 同时列出'种植牙'/'烤瓷冠'/'正畸'等自费项目, 强烈支持 VIOLATION (说明本质是美容修复).


  注意: 甲状腺 pilot 50 患者命中率近 0; 该规则应在 v0.3 切换口腔/综合医院数据集后批跑.
trigger_keywords:
  - 口腔颌面软组织清创术
  - 软组织清创
  - 颌面清创
  - 阻生牙拔除
  - 阻生齿
  - 牙龈炎
  - 牙髓炎
  - 普通拔牙
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 患者诊断 '急性牙龈炎' + '阻生智齿', 费用列 '口腔颌面软组织清创术 ¥350' 和 '种植牙 ¥3800' (自费), 实际做的是种植牙美容修复.
  典型 CLEAN: 患者诊断 '颌面外伤伴软组织撕裂', 清创术有明确适应症.
  典型 INCONCLUSIVE: 患者诊断只写 '口腔疾病', 文书未细化.
