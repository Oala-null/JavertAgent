rule_id: R063
domain: 骨科
violation_type: 超标准收费
question: 经同一切口进行的两种不同疾病的手术,次要手术未按照诊疗项目计价标准收费。
example: 示例：某省《诊疗目录》规定，经同一切口进行的两种及以上不同的手术，其中第二及以后的手术按规定价格的50%计收，某医院实际按全价收费。
status: ready
priority: P0
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否未按诊疗目录规定的计价标准收取「同一切口多种手术 (计价总则)」费用.

  📖 诊疗目录条款 (来源: 截至 2026-04-01 全量诊疗项目库):
    项目名: 同一切口多种手术 (计价总则)
    计价单位: (规则总则)
    加成规则: 经同一切口进行的两种及以上不同的手术, 其中第二及以后的手术按规定价格的 75% 计收.
    (依据: 现行诊疗项目计价标准, 次要手术加成比例已由旧 50% 调整为 75%.)

  ⚠️ 典型违规模式: 同切口主+次手术全按全价收 (应该次要 75%)

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中, 记录出现次数 count + 实收金额合计. 检索关键词: "手术"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该项目).
  3. 用 search_notes(section="手术记录") 或 search_notes(keyword=...) 提取实际事件量化值 N.
     量化关键词: "同一切口" / "不同切口" / "主手术" / "次要手术" / "附加手术" / "联合手术"
  4. 按目录规则计算应收次数 expected:
     若手术记录描述'同一切口下行 A 手术 + B 手术', 应收 A 全价 + B × 75%; 若实收 A + B 都全价, 超 B 的 25%.
  5. 比对 count vs expected:
     - count 显著大于 expected → VIOLATION (超标准多收),
       evidence: 引 fee 项目名 × count + 实际事件 N + 目录单位 "(规则总则)" + 应收 expected + 多收金额.
     - count 等于 expected → CLEAN (按目录正确收).
     - count 小于 expected → CLEAN (未足量收, 不属本规则).
  6. 文书未提供量化信息 (切口数/治疗时长/牙数/血管数/疗程数 等) → INCONCLUSIVE.

  特殊注意:
  - 判定关键: 手术记录中'同一切口'/'同切口'等关键词 + 多个手术名并列
  - 若 fee 同期有 2+ 手术类项目 + 手术记录无'另作切口', 强支持 V

  注意: 需手术记录明确'同一切口'描述, 才能套该规则. J66252 单一甲状腺癌根治术, 应 CLEAN.
trigger_keywords:
  - 同一切口
  - 不同切口
  - 次要手术
  - 附加手术
  - 联合手术
  - 手术加成
suggested_tools:
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 骨科患者同切口行内固定 + 关节镜检, 两手术都按全价收.
  典型 CLEAN: 单一手术或不同切口手术按全价收 (允许).
  典型 INCONCLUSIVE: 手术记录未明示切口情况.
notes: ''
