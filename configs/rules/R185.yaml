rule_id: R185
domain: 肿瘤
violation_type: 重复收费
question: 开展根治性宫颈切除术，重复收取卵巢动静脉高位结扎术。
example: 示例：某省《诊疗目录》规定，根治性宫颈切除术含卵巢动静脉高位结扎术。某医院开展根治性宫颈切除术并收费，同时收取“卵巢动静脉高位结扎术”费用，属于重复收费。
status: ready
priority: P0
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「根治性宫颈切除术 / 广泛性子宫切除」项目 + 独立的「卵巢动静脉高位结扎术」费用.
  按各省《医疗服务诊疗目录》, 根治性宫颈切除术内涵已含卵巢动静脉高位结扎术步骤, 单独再收高位结扎 = 重复收费.

  审计步骤:
  1. 用 search_fees(category="手术类") 取手术类全部明细; 关注是否同时存在以下两类:
     A 类 (根治术): "根治性宫颈切除术" / "广泛性子宫切除" / "宫颈癌根治术"
     B 类 (高位结扎): "卵巢动静脉高位结扎术" / "卵巢血管结扎" / "高位结扎"
  2. 若 A 类无命中 → CLEAN (该患者根本没做根治性宫颈切除, 规则不适用).
  3. 若 A 类有命中且 B 类无命中 → CLEAN (根治术费用单一, 未重复收卵巢动静脉高位结扎费).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="手术记录"/"麻醉记录") 没有提到该报告由
     保留卵巢分期手术 / 双侧附件保留意图明确单独探查 (有独立手术步骤记录) → VIOLATION, evidence 引根治术笔数 + 高位结扎笔数 + 价格 + 手术记录中卵巢操作描述.
  5. 信息明确不足 (例如手术记录仅写 '根治术 + 附件处理', 未描述具体血管结扎层次) → INCONCLUSIVE.

  注意: 患者基础诊断必须含宫颈癌 / 子宫颈恶性肿瘤 (note_diagnosis 命中"宫颈癌"/"子宫颈恶性肿瘤"/"宫颈鳞癌"/"宫颈腺癌"); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - 根治性宫颈切除术
  - 广泛性子宫切除
  - 宫颈癌根治术
  - 卵巢动静脉高位结扎术
  - 卵巢血管结扎
  - 高位结扎
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 同次手术 "根治性宫颈切除术 ¥8500" + "卵巢动静脉高位结扎 ¥1200" 并存, 手术记录未将结扎作为独立分期手术叙述.
  典型 CLEAN: 仅有根治术单笔; 或手术记录明确为保留卵巢功能的独立分期操作单独计费.
notes: ''
