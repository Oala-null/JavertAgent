rule_id: R238
domain: 口腔
violation_type: 虚构医药服务项目或以骗保为目的串换项目
question: 将牙齿美容修复类（如种植牙、烤瓷/全瓷冠、正畸等）非医保支付项目，套用串换为显微根管治疗术等口腔治疗项目上传医保结算，虚构诊疗服务，骗取医保基金。
example: 示例：某医院口腔科将患者的全瓷牙、种植牙等自费项目，串换为显微根管治疗、牙周组织瓣移植术上传医保结算，实际并未提供相应诊疗服务。
status: ready
priority: P1
prompt_addon: |
  本规则关注: 患者实际诊断仅为微小口腔病变 (普通拔牙 / 牙龈炎 / 牙髓炎 / 美容修复需求 等),
  但费用中出现「显微根管治疗术」类医保大手术 / 治疗项目, 即"非医保支付的牙齿
  美容/普通诊治套用医保大手术编码"的骗保模式.
  按医保政策, '显微根管治疗术' 适用于具体损伤/重大病变场景 (颌面外伤 / 颌骨肿瘤 / 软组织缺损 / 巨大囊肿 等), 不应作为牙齿美容修复 / 普通拔牙 / 牙龈牙髓炎诊治的医保套用项目. 把这些诊治冒充为该大手术骗取医保基金 = 虚构医药服务.

  审计步骤:
  1. 确认本次住院/门诊涉及口腔科: 用 search_notes 看 section 是否含"口腔" 或 search_fees
     看 dept 字段是否口腔. 若无口腔科介入 → CLEAN (规则不适用).
  2. 用 note_diagnosis 列出该患者全部诊断 (入院/出院/术前/术后/病理).
  3. 检查是否含任一支持「显微根管治疗术」的重大诊断:
     - 颌骨囊肿 / 巨大颌骨囊肿
     - 颌面血管瘤 / 淋巴管瘤
     - 颌骨恶性肿瘤 / 牙龈癌 / 颌骨转移癌
     - 颌骨骨折 / 颌骨缺损 (外伤后)
     - 严重根尖周炎伴囊肿
     - 牙周炎伴严重骨缺损 (Ⅳ期/Ⅴ期)
     - 颌面部巨大畸形
     - 钙化根管
     - 难治性根尖周炎
     - 根管再治疗失败
     - 折断器械取出
     
     若有任一支持诊断 → CLEAN (手术有适应症).
  4. 用 search_fees 查是否做了该大手术. 检索关键词: "显微根管治疗术" / "显微根管" / "牙科显微镜下根管"
  5. 若 fee 无命中 → CLEAN (规则不适用).
  6. 若诊断**全部**属于以下 trivial 范围:
     - 龋齿 / 深龋 / 龋损
     - 牙列拥挤 / 牙列不齐 / 错颌畸形
     - 牙体缺损 / 楔状缺损 / 隐裂
     - 牙根残留 / 残根 / 残冠
     - 牙齿美容 / 美容修复 / 烤瓷冠 / 全瓷冠
     - 种植义齿 / 种植牙 / 正畸需求
     - 釉质发育不全 / 四环素牙 / 氟斑牙
     - 牙列缺损 (轻度)
     - 牙周炎 (无骨缺损/无组织瓣需要)
     
     且 fee 命中「显微根管治疗术」 → VIOLATION,
     evidence:
     - 诊断完整列表 (证明全是微小诊断)
     - 「显微根管治疗术」项目名 + 价格
     - 该次口腔诊治总费用
  7. 诊断只有"牙体疾病"/"口腔疾病"等无细化项 → INCONCLUSIVE.

  加分项 (强支持 VIOLATION):
  - 若 fee 同时列出"种植牙" / "烤瓷冠" / "全瓷冠" / "正畸"等自费项目 → 说明医院承认本质是美容修复, 拿大手术做医保套帽.
  - 同次诊治 fee 总额 >800 但诊断只见 trivial → 强支持 VIOLATION.

  特殊注意:
  - 同患者诊断里只要有支持 '显微根管治疗术' 的具体重大病变描述, 一律 CLEAN.
  - 若 fee 同时列出'种植牙'/'烤瓷冠'/'正畸'等自费项目, 强烈支持 VIOLATION (本质是美容修复套医保).


  注意: 甲状腺 pilot 50 患者命中率近 0; 该规则应在 v0.3 切换口腔/综合医院数据集后批跑.
trigger_keywords:
  - 显微根管治疗术
  - 显微根管
  - 牙科显微镜下根管
  - 种植牙
  - 烤瓷冠
  - 正畸
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 患者诊断'龋齿', 费用列显微根管治疗术 ¥1200 (普通根管约 ¥400).
  典型 CLEAN: 患者诊断含支持'显微根管治疗术'的重大病变 (如颌面外伤 / 颌骨肿瘤 / 严重病变), 手术有适应症.
  典型 INCONCLUSIVE: 患者诊断只写'口腔疾病'/'牙体疾病'等无细化.
