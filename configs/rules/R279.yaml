rule_id: R279
domain: 内分泌
violation_type: 过度检查
question: 为住院患者无指征普遍开展"甲状腺功能三项"或"甲状腺功能五项"检查并收费。
example: 示例：某医院为患者开展入院检查时，未依据患者病情，无指征为住院患者普遍开展"甲状腺功能三项"或"甲状腺功能五项"检查并收费，属于过度检查。
status: ready
priority: P1
handling_level: 可疑（警告）
prompt_addon: "本规则关注: 患者本次住院里, 是否被无指征收取了「甲状腺功能三项 / 五项」(TT3 / TT4 / TSH + FT3 / FT4) 检查.\n按诊疗规范, 甲功三/五项应用于已知甲状腺疾病 / 可疑甲状腺功能异常 / 特定术前评估 (含碘造影前) / 妊娠监测等, 不应作为入院常规打包.\n\n审计步骤:\n1. 用 search_fees(keyword=...) 查甲功项目, 记录命中次数 count.\n   检索关键词: \"甲状腺功能三项\" / \"甲状腺功能五项\" / \"TT3\" / \"TT4\" / \"TSH\" / \"FT3\" / \"FT4\" / \"促甲状腺激素\"\n2. 若 count == 0 → CLEAN (规则不适用).\n3. 用 note_diagnosis 列出诊断, 检查是否含以下指征任一:\n   - 已知甲状腺疾病 (甲亢 / 甲减 / 甲状腺炎 / 甲状腺结节 / 甲状腺癌)\n   - 可疑甲亢/甲减症状 (心悸 / 怕热多汗 / 体重下降 / 怕冷乏力 / 黏液性水肿)\n   - 妊娠 / 备孕期监测\n   - 心律失常待查 (房颤需排除甲亢)\n   - 不孕不育 / 月经不调\n   - 含碘造影剂使用前 (CT 增强 / 冠脉造影术前评估)\n   - 服用胺碘酮 / 锂剂 等可能影响甲功的药物\n   - 浸润性突眼 / 突眼检查\n   - 自身免疫病合并 (SLE / RA 等可能伴甲状腺受累)\n   - 老年虚弱状态评估 (亚临床甲减)\n\n4. 若有任一指征命中 → CLEAN.\n5. 若无任一指征命中 + count >= 1 → VIOLATION (无指征普查),\n   evidence: 引诊断完整列表 + 甲功项目名 × count + 价格.\n6. 诊断\"心悸待查\"/\"乏力待查\" 等模糊指征 → INCONCLUSIVE.\n\n特殊注意:\n- 防范: 痔疮 / 阑尾炎 / 外伤等显然无甲状腺相关诊断的患者入院开甲功五项.\n- 心血管科 / 妇科 / 内分泌科患者命中 → 多数有合理指征.\n\n\U0001F4CC 专家共识触发器 (v0.7, wangxin/jiweihui/zhoulihong 加权 9C/4V/0I):\n\
  \nCLEAN 触发器:\n- note_diagnosis 含淋巴瘤/白血病/多发转移/中枢神经系统肿瘤 → 多器官评估 (内分泌/性腺/生长激素等) 合理 → **CLEAN**\n  → wangxin: \"淋巴瘤有可能累及内分泌系统, 有检查的必要性\"\n  → jiweihui: \"入院常规都查, 建议改为提醒\"\n- 单项目 ≤ 2 次 → CLEAN\n\n反例 (V): 局部良性疾病 + 套餐 ≥3 类全打包 + 完全无对应指征.\n"
trigger_keywords:
- 甲状腺功能三项
- 甲状腺功能五项
- TT3
- TT4
- TSH
- FT3
- FT4
suggested_tools:
- note_diagnosis
- search_fees
expected_signal: '典型违规: 痔疮 / 阑尾炎患者 fee 含甲功五项, 诊断完全无甲状腺相关.

  典型 CLEAN: 心悸 / 房颤 / 甲状腺结节患者查甲功.

  典型 INCONCLUSIVE: 诊断"乏力待查", 指征模糊.

  '
