rule_id: R077
domain: 血液净化
violation_type: 重复收费
question: 开展血液透析或血液透析滤过治疗时，将测量血压或一般生命体征测量，按照血透监测收费。
example: 示例：某省《诊疗目录》规定，血透监测含血温、血压、血容量、在线尿素监测。医院在血透过程中只是测量血压或进行一般生命体征的测量，不应按照血透监测收费。某医院为患者开展日常生命体征测量，但按照血透监测项目收费，属于重复收费。
status: ready
priority: P0
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「血液透析 / 血液透析滤过类」项目 + 独立的「血透监测费」费用.
  按各省《医疗服务诊疗目录》, 血液透析项目本身已含基础生命体征测量, 单独再收血透监测费 = 重复收费 (血透监测仅适用于血温/血压/血容量/在线尿素等专用监测).

  审计步骤:
  1. 用 search_fees(category="检查类") 取检查类全部明细; 关注是否同时存在以下两类:
     A 类 (透析): "血液透析" / "血液透析滤过" / "血液净化"
     B 类 (监测): "血透监测" / "血液透析监测" / "透析中监测"
  2. 若 A 类无命中 → CLEAN (该患者根本没做血液透析, 规则不适用).
  3. 若 A 类有命中且 B 类无命中 → CLEAN (透析费用单一, 未重复收血透监测费).
  4. 若 A 类与 B 类都命中, 且文书 (search_notes section="透析记录"/"护理记录") 没有提到该报告由
     心电监护异常 / 抢救期间专项监测 (有独立异常事件记录) → VIOLATION, evidence 引血透笔数 + 血透监测笔数 + 价格 + 同日日期.
  5. 信息明确不足 (例如透析记录里仅描述 '生命体征平稳' 但费用同时收两笔, 无法判断监测内容) → INCONCLUSIVE.

  注意: 患者基础诊断必须含需要透析的肾功能损害 (note_diagnosis 命中"慢性肾衰"/"尿毒症"/"肾功能不全"/"ESRD"/"急性肾损伤"); 否则该规则不适用, 应判 CLEAN.
trigger_keywords:
  - 血液透析
  - 血液透析滤过
  - 血液净化
  - 血透监测
  - 血液透析监测
  - 透析中监测
suggested_tools:
  - note_diagnosis
  - search_fees
  - search_notes
expected_signal: |
  典型违规: 同一日 "血液透析 ¥350" + "血透监测 ¥45" 两笔, 透析记录仅记录常规血压 / 心率.
  典型 CLEAN: 仅有血液透析单笔; 或透析记录明确监测包括血温 / 血容量 / 在线尿素等专项指标.
notes: ''
