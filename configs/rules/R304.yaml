rule_id: R304
domain: 精神医学
violation_type: 重复收费
question: 开展精神障碍作业疗法训练，重复收取日常生活动作训练费用。
example: 示例：某省《医疗服务项目价格目录》，精神障碍作业疗法训练项目内涵中包含日常生活动作训练中的进食、洗脸、梳头、刷牙等11项内容。某医院开展精神障碍作业疗法训练并收费，同时收取"日常生活动作训练"费用，属于重复收费。
status: ready
priority: P1
prompt_addon: |
  本规则关注: 患者本次住院里, 是否同时被收取了「精神障碍作业疗法训练」+ 独立的「日常生活动作训练」.
  按各省《医疗服务项目价格目录》, 精神障碍作业疗法训练项目内涵中已包含进食 / 洗脸 / 梳头 / 刷牙等 11 项日常生活动作训练内容, 单独再收即重复收费.

  审计步骤:
  1. 用 search_fees(keyword=...) 查是否同时存在以下两类:
     A 类 (主项): "精神障碍作业疗法" / "精神障碍作业疗法训练"
     B 类 (附属, 应被内涵): "日常生活动作训练" / "ADL 训练"
  2. 若 A 类无命中 → CLEAN (规则不适用).
  3. 若 A 类命中且 B 类无命中 → CLEAN.
  4. 若 A 类与 B 类都命中 → VIOLATION,
     evidence: 引 A 类项目名 + 价格 + B 类项目名 + 价格.
  5. 文书 (search_notes section="病程记录" / keyword="作业疗法") 若明确把 ADL 作为独立大类训练 (例如卫生教育训练) 而非作业疗法子项 → INCONCLUSIVE.

  特殊注意:
  - 与 R303 区别: R304 限定为"精神障碍"作业疗法 (精神科患者), R303 范围更广.
  - 患者需有精神疾病诊断 (精神分裂症 / 双相 / 抑郁等), 否则 R304 不适用 (走 R303).
trigger_keywords:
  - 精神障碍作业疗法
  - 精神障碍作业疗法训练
  - 日常生活动作训练
  - ADL 训练
  - 进食训练
  - 卫生教育
suggested_tools:
  - search_fees
  - note_diagnosis
expected_signal: |
  典型违规: 精神分裂症患者 fee 同次含 "精神障碍作业疗法" + "日常生活动作训练".
  典型 CLEAN: 仅精神障碍作业疗法单项; 或仅 ADL (走其他规则).
  典型 INCONCLUSIVE: 患者无精神科诊断, 规则适用性存疑.
notes: ''
derived_from_template: M1
precheck:
  a_items:
    - 精神障碍作业疗法
    - 精神障碍作业疗法训练
  b_items:
    - 日常生活动作训练
    - ADL 训练
