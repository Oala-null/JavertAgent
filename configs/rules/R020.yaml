rule_id: R020
domain: 心血管内科
violation_type: 超标准收费
question: 开展经血管介入项目，扩张多支血管超出计价标准。如：定向冠脉内膜旋切术、经皮冠状动脉内支架置入术(STENT)、经皮冠状动脉腔内激光成形术(ELCA)、高速冠状动脉内膜旋磨术等。
example: 示例：某省《诊疗目录》规定，介入治疗原则上以经一根血管的介入治疗为起点，每增加一根血管的治疗加收20%。某医院为严重冠心病的患者行经皮冠状动脉腔内成形术，扩张3支血管。医院按全价收取3次“经皮冠状动脉腔内成形术(PTCA)”费用，其中2次应按全价的20%收取，超出部分为超标准收费。
status: ready
priority: P0
handling_level: 违规（阻断）
prompt_addon: |
  本规则关注: 患者本次住院里, 是否未按诊疗目录规定的计价标准收取「经皮冠状动脉腔内成形术 (PTCA) / 冠状动脉内支架置入术 (STENT) / 经皮冠状动脉腔内激光成形术 (ELCA) / 高速冠状动脉内膜旋磨术」费用.

  📖 诊疗目录条款 (来源: 截至 2026-04-01 全量诊疗项目库):
    项目名: 经皮冠状动脉腔内成形术 (PTCA) / 冠状动脉内支架置入术 (STENT) / 经皮冠状动脉腔内激光成形术 (ELCA) / 高速冠状动脉内膜旋磨术
    计价单位: 支血管
    加成规则: 介入治疗原则上以经一根血管的介入治疗为起点, 每增加一根血管的治疗加收 20%.

  ⚠️ 典型违规模式: 对扩张多支血管全部按全价 × N 支收费 (应该 1 + (N-1) × 20%)

  审计步骤:
  1. 用 search_fees(keyword=...) 查 fee 是否命中, 记录出现次数 count + 实收金额合计. 检索关键词: "PTCA" / "STENT" / "ELCA" / "冠状动脉腔内成形" / "冠脉内膜旋磨" / "支架置入"
  2. 若 fee 无命中 → CLEAN (规则不适用, 患者未做该项目).
  3. 用 search_notes(section="手术记录") 或 search_notes(keyword=...) 提取实际事件量化值 N.
     量化关键词: "血管数" / "病变血管" / "支血管" / "LAD" / "LCX" / "RCA" / "OM" / "D1" / "S1" / "PDA"
  4. 按目录规则计算应收次数 expected:
     设第一根血管按全价 100%, 第 2 根 +20%, 第 3 根 +20%; 即 3 支血管应收 1.4 次全价 (1 + 0.2 + 0.2). 若实际收 3 次全价, 超 1.6 次价格.
  5. 比对 count vs expected:
     - count 显著大于 expected → VIOLATION (超标准多收),
       evidence: 引 fee 项目名 × count + 实际事件 N + 目录单位 "支血管" + 应收 expected + 多收金额.
     - count 等于 expected → CLEAN (按目录正确收).
     - count 小于 expected → CLEAN (未足量收, 不属本规则).
  6. 文书未提供量化信息 (切口数/治疗时长/牙数/血管数/疗程数 等) → INCONCLUSIVE.

  特殊注意:
  - 判定关键: 从手术记录提取实际扩张的血管支数 (LAD/LCX/RCA 等命名)
  - 若 fee 命中 PTCA × N 次 (N≥2) + 文书描述多支血管, 强支持 V

  注意: 甲状腺患者无冠脉介入指征, J66252 应 CLEAN (fee 无命中). 该规则在心血管/胸痛中心患者群体高命中.
trigger_keywords:
  - PTCA
  - STENT
  - ELCA
  - 冠状动脉腔内成形
  - 冠脉内膜旋磨
  - 支架置入
  - 多支血管
trigger_codes:
  - S320500003
suggested_tools:
  - search_fees
  - search_notes
  - note_diagnosis
expected_signal: |
  典型违规: 患者诊断严重冠心病, 手术记录扩张 3 支血管, 收 PTCA × 3 次全价.
  典型 CLEAN: 单支血管扩张 + 收 1 次, 或多支扩张但按 1+(N-1)×20% 收.
  典型 INCONCLUSIVE: 手术记录未明示扩张血管支数.
