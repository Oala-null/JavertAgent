# -*- coding: utf-8 -*-
# verdict_gate 配置 — 裁决后确定性闸层分类表 (add-verdict-gate-layer).
#
# 由 src/javert/audit/verdict_gate.apply_gate 读取, 不改 Rule schema (设计 D2/D5):
#   - file_dependent_rules: ① 文件缺失硬闸只作用这些规则 (影像/麻醉记录/监测/报告单/条码/虚构文书)
#   - single_instance_violation: ② 单次硬闸的例外集 (单次本身即违规, 穿透次数闸仍 V)
#   - progress_sections: ⑤ scan_progress_indications 扫描的病程/查房 section 族
#   - default_symptom_keywords: ⑤ 症状词默认表 (复用 experience.md 共识 7)
#   - conf_floor / conf_ceiling: conf 底线硬闸区间 [floor, ceiling) 的 V → I

# ① 文件依赖类规则 — V 仅靠「文件缺失」(etl_warning / ETL_GAP) 时降 I + 标签「缺文书」
# (旧兜底闸; 现多数规则已由下方更具体的临床事实闸 / 不可确认文书闸优先接管)
file_dependent_rules:
  - R103   # 影像报告 (虚构医药服务项目)
  - R105   # 影像报告 (虚构医药服务项目)
  - R112   # 影像 (重复收费)
  - R203   # 麻醉记录 (虚构医药服务项目)
  - R224   # 监测记录 (虚构医药服务项目)
  - R015   # 虚构文书 (虚构医药服务项目)
  - R034   # 耗材条码 (串换项目)

# ⑥ 麻醉真实性闸 (fix-anesthesia-false-positive) — 病案首页手术表有手术+麻醉医师/全麻
#    → 全麻收费真实有据 → V 降 CLEAN. 专家 R203 ×6 "胡扯" / R205 ×4 "1手术1全麻=OK".
anesthesia_reality_rules:
  - R203   # 虚构全身麻醉 (虚构医药服务项目)
  - R205   # 全身麻醉按次超收 (重复收费)

# ⑦ 术前心肺评估闸 — 病案首页有全麻手术 → 心脏彩超系列术前评估有指征 → V 降 CLEAN.
#    专家 R131 ×8 "手术患者术前需排除心肺禁忌, 有检查必要性".
preop_cardiopulmonary_rules:
  - R131   # 心脏彩超/左心功能/TDI 无指征 (过度检查)

# ⑧ 肿瘤标志物指征闸 — 病案首页诊断含肿瘤/恶性 → 查标志物属正常诊疗 → V 降 CLEAN.
#    专家 13C "肿瘤病人查肿瘤标志物属于正常诊疗行为, 不予认定".
tumor_marker_rules:
  - R153   # 甲胎蛋白 AFP (过度检查)
  - R154   # 肿瘤标志物 (过度检查)
  - R156   # 肿瘤标志物/PSA (过度检查) — 无肿瘤时仍穿透单次闸保留 V

# ① 影像可确认闸 — 检查报告表(sy_patient_examination)有报告 → 服务真实 → CLEAN;
#    无报告 → 待 PACS 线下核查 → INCONCLUSIVE (绝不凭 case_notes 缺报告判虚构 V).
imaging_confirmable_rules:
  - R103   # 虚构影像服务 (虚构医药服务项目)
  - R105   # 虚构影像服务 (虚构医药服务项目)

# ① 不可确认文书闸 — 认定依赖 Javert 数据看不到的院内文书 → V 一律降 INCONCLUSIVE.
#    专家口径 "未见医嘱单/检查报告单/病理报告/PACU 记录, 需线下核查".
unconfirmable_doc_rules:
  - R112   # 影像平扫/增强部位时相差异 (重复收费) — 需检查报告
  - R015   # 心血管虚构文书 — 需医嘱单/检查报告单
  - R026   # 心电监测重复 — 需医嘱单/检查报告单
  - R034   # 骨科耗材拆分 (串换) — 需耗材粘贴条码
  - R014   # 心血管耗材 — 需耗材粘贴条码
  - R080   # 康复评估 — 需评估量表
  - R165   # 组织学检查 — 需病理报告
  - R212   # 麻醉复苏 — 需 PACU 记录单
  - R224   # 重症监测虚构 — 需监测记录单
  # 注: R278 (内分泌激素无指征) 是可逐案判定的指征类规则 (专家 J13365 判 V "无检查指征" /
  #     J61556 判 I "有鉴别诊断合理性但缺支撑"), 不能盲降 I — 交回 LLM+prompt 判定, 不进闸.

# ② 单次即违规的例外集 — 即使净次数 = 1 也不降级 (穿透单次闸保留 V)
single_instance_violation:
  - R156   # 女性患者收 PSA — 单次本身即错

# ⑤ 病程/查房 section 族 — scan_progress_indications 扫描范围 (ETL 劈碎, 无干净「日常查房记录」)
progress_sections:
  - 病程记录内容
  - 病情及处理
  - 诊疗经过
  - 目前情况
  - 入院情况
  - 简要病情
  - 首次病程
  - 日常查房记录

# ⑤ 症状词默认表 (experience.md 共识 7) — 规则未填 symptom_kw_list 时的兜底
default_symptom_keywords:
  - 胸闷
  - 气短
  - 喘
  - 憋
  - 胸痛
  - 下肢水肿
  - 发热
  - 咳嗽
  - 心悸

# conf 底线硬闸: [conf_floor, conf_ceiling) 区间内的 V → INCONCLUSIVE
conf_floor: 0.70
conf_ceiling: 0.85
