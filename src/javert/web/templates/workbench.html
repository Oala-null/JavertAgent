{% extends "base.html" %}
{% block content %}
{% if show_banner %}
{% include "welcome_banner.html" %}
{% endif %}

<div class="workbench-grid">
  {% include "_sidebar.html" %}

  <section class="detail-panel" id="detail-panel">
    <div class="detail-empty">
      <p>请从左侧列表选择一个病人</p>
      <p class="muted">当前 filter: {{ filter_label }} · 总计 {{ patients|length }} 个病人有命中</p>
    </div>
  </section>
</div>

<div class="toast-stack" id="toast-stack" aria-live="polite"></div>
{% endblock %}

{% block scripts %}
<script src="/static/app.js?v={{ asset_v }}" defer></script>
{% endblock %}
