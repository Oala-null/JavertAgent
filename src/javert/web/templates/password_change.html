{% extends "base.html" %}
{% block content %}
<section class="auth-card">
  <h1>修改密码</h1>
  <p class="muted" style="font-size:12px; margin-top:-6px;">
    当前账号: <strong>{{ current_user.username }}</strong>
    {% if current_user.display_name %}({{ current_user.display_name }}){% endif %}
  </p>
  {% if error %}
    <div class="banner-error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/account/password" class="auth-form">
    <label>
      <span>旧密码</span>
      <input type="password" name="old_password" required autofocus>
    </label>
    <label>
      <span>新密码</span>
      <input type="password" name="new_password" required>
    </label>
    <label>
      <span>再次确认新密码</span>
      <input type="password" name="confirm_password" required>
    </label>
    <button type="submit" class="btn-primary">提交</button>
  </form>
  <p class="auth-aux muted" style="font-size:12px;">
    改密后系统会让你重新登录 (安全默认).
    忘了旧密码请联系运维.
  </p>
  <p style="margin-top:14px;"><a href="/workbench">← 返回工作台</a></p>
</section>
{% endblock %}
