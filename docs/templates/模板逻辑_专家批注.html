<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Javert 8 大审计模板 · 逻辑流程图与专家批注</title>
<style>
  :root{
    --primary:#1e40af; --primary-soft:#eff3ff; --ink:#1f2937; --muted:#6b7280;
    --line:#e5e7eb; --bg:#f5f7fb;
    --V:#b91c1c; --Vbg:#fef2f2; --I:#b45309; --Ibg:#fffbeb; --C:#047857; --Cbg:#ecfdf5;
    --next:#1e40af; --nextbg:#eff6ff;
    --p0:#b91c1c; --p1:#b45309; --p2:#6b7280;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
       color:var(--ink);background:var(--bg);font-size:14px;line-height:1.6}
  header{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:12px 20px;
         display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.12)}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
  header .sub{font-size:12px;opacity:.85}
  header .spacer{flex:1}
  .btn{background:#fff;color:var(--primary);border:none;border-radius:6px;padding:6px 12px;font-size:13px;
       cursor:pointer;font-weight:500}
  .btn:hover{background:#e8eefc}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.5)}
  .btn.ghost:hover{background:rgba(255,255,255,.12)}
  .btn.save{background:#065f46;color:#fff;font-weight:600}
  .btn.save:hover{background:#047857}
  #status{font-size:12px;opacity:.9}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 20px 0;background:#fff;border-bottom:1px solid var(--line);
        position:sticky;top:52px;z-index:10}
  .tab{padding:8px 14px;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;cursor:pointer;
       background:#f3f4f6;color:var(--muted);font-size:13px;white-space:nowrap}
  .tab .id{font-weight:700;color:var(--primary);margin-right:5px}
  .tab.active{background:#fff;color:var(--ink);box-shadow:0 -2px 0 var(--primary) inset}
  .tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--I);margin-left:6px;vertical-align:middle}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .hidden{display:none}
  /* 模板头 */
  .thead{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
  .thead h2{margin:0 0 4px;font-size:20px}
  .thead h2 .id{color:var(--primary)}
  .thead .subtitle{color:var(--muted);font-size:13px;margin-bottom:12px}
  .thead .kv{margin:8px 0;padding:10px 12px;border-radius:8px;background:var(--primary-soft);font-size:13px}
  .thead .kv b{color:var(--primary)}
  .thead .warn{background:var(--Ibg);border:1px solid #fde68a}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:700;color:#fff}
  .pill.V{background:var(--V)} .pill.I{background:var(--I)} .pill.C{background:var(--C)} .pill.NEXT{background:var(--next)}
  /* 流程 */
  .flow{margin:6px 0 26px}
  .gate{background:#fff;border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:10px;
        padding:14px 16px;position:relative}
  .gate .step{display:inline-block;background:var(--primary);color:#fff;font-size:11px;font-weight:700;
              border-radius:5px;padding:2px 8px;margin-right:8px}
  .gate .qt{font-weight:600;font-size:14.5px}
  .gate .why{color:var(--muted);font-size:12.5px;margin-top:5px;padding-left:2px;border-left:2px solid var(--line);padding-left:8px}
  .outs{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .out{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
  .out.V{background:var(--Vbg);border-color:#fecaca} .out.I{background:var(--Ibg);border-color:#fde68a}
  .out.C{background:var(--Cbg);border-color:#a7f3d0} .out.NEXT{background:var(--nextbg);border-color:#bfdbfe}
  .out .cond{flex:1}
  .out .cond .ct{font-weight:600}
  .out .cond .cd{color:var(--muted);font-size:12.5px}
  .out .verdict{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;color:#fff;white-space:nowrap;margin-top:1px}
  .out.V .verdict{background:var(--V)} .out.I .verdict{background:var(--I)}
  .out.C .verdict{background:var(--C)} .out.NEXT .verdict{background:var(--next)}
  .connector{height:22px;width:2px;background:var(--line);margin:0 auto;position:relative}
  .connector::after{content:"▼";position:absolute;left:-5px;bottom:-4px;color:var(--line);font-size:11px}
  /* 批注 */
  .notebtn{position:absolute;top:12px;right:12px;background:#f3f4f6;border:1px solid var(--line);border-radius:6px;
           font-size:12px;padding:3px 9px;cursor:pointer;color:var(--muted)}
  .notebtn.has{background:#fef9c3;border-color:#fde047;color:#854d0e}
  .notewrap{margin-top:10px}
  textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;font-family:inherit;
           resize:vertical;line-height:1.5;background:#fffef7}
  textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft)}
  .note-label{font-size:12px;color:#854d0e;margin-bottom:4px;font-weight:600}
  /* 总评 */
  .summary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:22px 0}
  .summary h3{margin:0 0 10px;font-size:15px}
  .summary h3 .ic{color:var(--primary)}
  /* 规则表 */
  .rules{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .rules h3{margin:0 0 12px;font-size:15px}
  .rules h3 .cnt{color:var(--muted);font-weight:400;font-size:13px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:#f9fafb;color:var(--muted);font-weight:600;font-size:12px;position:sticky}
  td.rid{font-weight:700;color:var(--primary);white-space:nowrap}
  td.q{color:var(--ink)}
  .prio{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:700;color:#fff}
  .prio.P0{background:var(--p0)} .prio.P1{background:var(--p1)} .prio.P2{background:var(--p2)}
  .rnote-toggle{cursor:pointer;color:var(--primary);font-size:12px;white-space:nowrap;user-select:none}
  .rnote-toggle.has{color:#854d0e;font-weight:700}
  tr.rnote-row td{background:#fffef7}
  @media print{
    header,.tabs,.notebtn,.rnote-toggle,#status{display:none!important}
    .panel{display:block!important;page-break-after:always}
    textarea{border:1px solid #ccc;background:#fff}
    body{background:#fff}
  }
</style>
</head>
<body>
<header>
  <h1>⚖️ Javert 8 大审计模板</h1>
  <span class="sub">逻辑流程图 · 医学专家批注</span>
  <span class="spacer"></span>
  <span id="status">批注自动保存于本浏览器</span>
  <button class="btn save" onclick="saveHTML()">💾 保存</button>
  <button class="btn" onclick="exportJSON()">⬇ 导出JSON</button>
  <button class="btn" onclick="document.getElementById('imp').click()">⬆ 导入JSON</button>
  <input id="imp" type="file" accept=".json" class="hidden" onchange="importJSON(this)">
  <button class="btn ghost" onclick="window.print()">🖨 打印 / PDF</button>
  <button class="btn ghost" onclick="clearTab()">🗑 清空本模板</button>
</header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>

window.SAVED_NOTES = {}; //__SAVED_NOTES__  (「保存」按钮会把当前批注写进这里, 重开文件即恢复)

// ---------- 批注存取 (localStorage + 文件内种子) ----------
const KEY = "javert_tpl_annot_v1";
let STORE = load();
// 本机若有更新的 localStorage 用它; 否则用文件里保存的批注 (换机器/清缓存后仍能恢复)
function load(){ try{ const ls=localStorage.getItem(KEY); if(ls) return JSON.parse(ls); }catch(e){} return Object.assign({}, window.SAVED_NOTES||{}); }
function save(){ localStorage.setItem(KEY, JSON.stringify(STORE));
  const s=document.getElementById("status");
  const t=new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  s.textContent="已保存 "+t; }
function get(k){ return STORE[k]||""; }
function set(k,v){ if(v) STORE[k]=v; else delete STORE[k]; save(); refreshDots(); }

// ---------- 渲染 ----------
const V_LABEL={V:"违规 VIOLATION",I:"存疑 INCONCLUSIVE",C:"合规 CLEAN",NEXT:"继续下一步"};
let CUR = DATA.order[0];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function esc(s){return (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function buildTabs(){
  const bar=document.getElementById("tabs"); bar.innerHTML="";
  DATA.order.forEach(mid=>{
    const f=DATA.flows[mid];
    const t=el("div","tab"+(mid===CUR?" active":""));
    t.innerHTML=`<span class="id">${mid}</span>${esc(f.name)}<span class="dot" data-tabdot="${mid}" style="display:none"></span>`;
    t.onclick=()=>{CUR=mid;render();};
    bar.appendChild(t);
  });
}

function noteBtn(k,label){
  const wrap=el("div");
  const btn=el("button","notebtn"+(get(k)?" has":""),(get(k)?"✎ 已批注":"✎ 批注"));
  const box=el("div","notewrap hidden");
  const ta=el("textarea"); ta.rows=3; ta.placeholder=label||"在此写下您的意见 / 修正 / 补充指征…";
  ta.value=get(k);
  ta.oninput=()=>{set(k,ta.value); btn.className="notebtn"+(ta.value?" has":""); btn.textContent=ta.value?"✎ 已批注":"✎ 批注";};
  box.appendChild(ta);
  btn.onclick=()=>{box.classList.toggle("hidden"); if(!box.classList.contains("hidden"))ta.focus();};
  if(get(k)) box.classList.remove("hidden");
  wrap.appendChild(box);
  return {btn,wrap};
}

function render(){
  buildTabs();
  const f=DATA.flows[CUR];
  const m=document.getElementById("main"); m.innerHTML="";

  // 模板头
  const head=el("div","thead");
  head.appendChild(el("h2",null,`<span class="id">${CUR}</span> ${esc(f.name)}`));
  head.appendChild(el("div","subtitle",esc(f.sub)));
  head.appendChild(el("div","kv",`<b>关注点</b>　${esc(f.focus)}`));
  head.appendChild(el("div","kv"+(f.basis.indexOf("⚠️")>=0?" warn":""),esc(f.basis)));
  if(f.premise) head.appendChild(el("div","kv",`<b>前提</b>　${esc(f.premise)}`));
  head.appendChild(el("div","legend",
    `<span><span class="pill NEXT">流转</span>继续下一步</span>
     <span><span class="pill V">V</span>违规</span>
     <span><span class="pill I">I</span>存疑</span>
     <span><span class="pill C">C</span>合规</span>`));
  m.appendChild(head);

  // 流程图
  const flow=el("div","flow");
  f.gates.forEach((g,gi)=>{
    const gate=el("div","gate");
    gate.appendChild(el("div",null,`<span class="step">步骤 ${gi+1}</span><span class="qt">${esc(g.t)}</span>`));
    if(g.why) gate.appendChild(el("div","why",esc(g.why)));
    const outs=el("div","outs");
    g.outs.forEach(o=>{
      const row=el("div","out "+o.v);
      row.innerHTML=`<div class="cond"><div class="ct">${esc(o.c)}</div>${o.d?`<div class="cd">${esc(o.d)}</div>`:""}</div>
                     <div class="verdict">${o.v==="NEXT"?"→ 下一步":V_LABEL[o.v]}</div>`;
      outs.appendChild(row);
    });
    gate.appendChild(outs);
    // 该步骤批注
    const {btn,wrap}=noteBtn(`${CUR}#gate${gi}`,"针对本步骤判定逻辑的意见…");
    gate.appendChild(btn); gate.appendChild(wrap);
    flow.appendChild(gate);
    if(gi<f.gates.length-1) flow.appendChild(el("div","connector"));
  });
  m.appendChild(flow);

  // 总评大文本框
  const sum=el("div","summary");
  sum.appendChild(el("h3",null,`<span class="ic">📝</span> ${CUR} 模板总评（专家意见）`));
  const sk=`${CUR}#summary`; const ta=el("textarea"); ta.rows=6;
  ta.placeholder="对本模板整体逻辑的评价：判定是否合理？漏了哪些指征 / 排除条件？阈值是否合适？边界情形…";
  ta.value=get(sk); ta.oninput=()=>set(sk,ta.value);
  sum.appendChild(ta); m.appendChild(sum);

  // 归属规则
  const rules=el("div","rules");
  rules.appendChild(el("h3",null,`📋 归属细规则 <span class="cnt">（${f.rules.length} 条）</span>`));
  const tbl=el("table");
  tbl.innerHTML=`<thead><tr><th>规则号</th><th>领域</th><th>违规类型</th><th>优先级</th><th>问题描述</th><th>批注</th></tr></thead>`;
  const tb=el("tbody");
  f.rules.forEach(r=>{
    const rk=`rule#${r.rule_id}`;
    const tr=el("tr");
    tr.innerHTML=`<td class="rid">${esc(r.rule_id)}</td><td>${esc(r.domain)}</td><td>${esc(r.vtype)}</td>
      <td><span class="prio ${r.priority}">${esc(r.priority)}</span></td>
      <td class="q">${esc(r.question)}</td>
      <td><span class="rnote-toggle${get(rk)?" has":""}">${get(rk)?"✎ 已批注":"✎ 批注"}</span></td>`;
    const noteRow=el("tr","rnote-row hidden");
    const td=el("td"); td.colSpan=6;
    const ta2=el("textarea"); ta2.rows=2; ta2.placeholder=`对 ${r.rule_id} 的意见…`; ta2.value=get(rk);
    const tog=tr.querySelector(".rnote-toggle");
    ta2.oninput=()=>{set(rk,ta2.value); tog.className="rnote-toggle"+(ta2.value?" has":""); tog.textContent=ta2.value?"✎ 已批注":"✎ 批注";};
    td.appendChild(ta2); noteRow.appendChild(td);
    tog.onclick=()=>{noteRow.classList.toggle("hidden"); if(!noteRow.classList.contains("hidden"))ta2.focus();};
    if(get(rk)) noteRow.classList.remove("hidden");
    tb.appendChild(tr); tb.appendChild(noteRow);
  });
  tbl.appendChild(tb); rules.appendChild(tbl); m.appendChild(rules);

  refreshDots();
}

function refreshDots(){
  DATA.order.forEach(mid=>{
    const has=Object.keys(STORE).some(k=>k.startsWith(mid+"#") || (k.startsWith("rule#") && DATA.flows[mid].rules.some(r=>k==="rule#"+r.rule_id) && STORE[k]));
    // 仅按模板内步骤/总评 + 该模板规则批注计
    const dot=document.querySelector(`[data-tabdot="${mid}"]`);
    if(dot) dot.style.display=has?"inline-block":"none";
  });
}

// ---------- 导入导出 ----------
function saveHTML(){
  save(); // 先落 localStorage
  // 把当前批注烧进文件里的 SAVED_NOTES 种子; 转义 < 防止批注文本截断脚本标签
  const notes = JSON.stringify(STORE).replace(/</g,"\\u003c");
  let doc = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  doc = doc.replace(/window\.SAVED_NOTES\s*=\s*\{[\s\S]*?\};\s*\/\/__SAVED_NOTES__/,
                    "window.SAVED_NOTES = "+notes+"; //__SAVED_NOTES__");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([doc],{type:"text/html"}));
  a.download="Javert模板批注_"+new Date().toISOString().slice(0,10)+".html"; a.click();
  document.getElementById("status").textContent="已保存文件 · 批注已写入";
}
function exportJSON(){
  const blob=new Blob([JSON.stringify({_meta:{tool:"Javert模板批注",exported:new Date().toISOString()},notes:STORE},null,2)],
    {type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="javert_模板批注_"+new Date().toISOString().slice(0,10)+".json"; a.click();
}
function importJSON(input){
  const file=input.files[0]; if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
      const j=JSON.parse(rd.result); const notes=j.notes||j;
      if(typeof notes!=="object") throw 0;
      if(!confirm("导入将合并到当前批注（同一位置会被覆盖）。继续？")) return;
      Object.assign(STORE,notes); save(); render();
      alert("已导入 "+Object.keys(notes).length+" 条批注。");
    }catch(e){ alert("文件格式不对，无法导入。"); } };
  rd.readAsText(file); input.value="";
}
function clearTab(){
  if(!confirm(`确定清空 ${CUR} 模板的全部批注？（其它模板不受影响）`)) return;
  Object.keys(STORE).forEach(k=>{
    if(k.startsWith(CUR+"#")) delete STORE[k];
    if(k.startsWith("rule#") && DATA.flows[CUR].rules.some(r=>"rule#"+r.rule_id===k)) delete STORE[k];
  });
  save(); render();
}

render();
</script>
