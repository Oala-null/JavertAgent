[project]
name = "javert"
version = "0.1.0"
description = "国家医保局2026自查自纠「做不了」规则的LLM审计脚手架 (pilot 34)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "ruamel.yaml>=0.18.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "nanoid>=2.0.0",
    "click>=8.1.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "tabulate>=0.9.0",
    "requests>=2.31.0",
    "jinja2>=3.1",
    # Web (FastAPI + SSE)
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    # 工作台: 鉴权 + 表单 + 限流 + SSE
    "bcrypt>=4.0.0",
    "itsdangerous>=2.1.2",
    "python-multipart>=0.0.9",
    "slowapi>=0.1.9",
    "sse-starlette>=2.0.0",
    # 142 双写 (sqlalchemy 安全, pyodbc 在 sqlserver extra)
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.25.0",  # for FastAPI TestClient
]
kb = [
    # 仅构建 PDF 来源的药品知识库时需要，运行 Javert 不依赖。
    "pdfplumber>=0.11.0",
]
sqlserver = [
    # 需要系统 unixODBC + msodbcsql17
    # macOS: brew install unixodbc; brew tap microsoft/mssql-release; brew install msodbcsql17
    "pyodbc>=5.0.0",
]

[project.scripts]
javert = "javert.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/javert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "slow: 需要 sglang 连接的慢速测试 (默认跳过, 用 -m slow 启用)",
]
